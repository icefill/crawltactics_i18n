curse_spreader = Difusor de Maldición
curse_spreader_desc = Cuando infliges un efecto de debuff, se propaga a todos los miembros del grupo del objetivo afectado.

summon_demon_lord = Invocar Señor Demonio
summon_demon_lord_desc = Invoca a un Señor Demonio.

waterproof_coating = Revestimiento Impermeable
waterproof_coating_desc = Los enemigos mecánicos no se oxidan al moverse sobre losetas de agua.

summon_mecharonasle = Invocar Mechanasle
summon_mecharonasle_desc = Invoca a un Mechanasle.

construct_robot = Construir Robot
construct_robot_desc = Construye un Robot Guardián.

auto_mecharonasle = Auto Mechanasle
auto_mecharonasle_desc = Construye automáticamente un Mechanasle al inicio de la batalla.

install_electric_coil = Instalar Bobina Eléctrica
install_electric_coil_desc = Instala una bobina eléctrica.

transmute_attack_potion = Transmutar Poción de Ataque
transmute_attack_potion_desc = Selecciona y transmuta una poción de ataque.
transmute_support_potion = Transmutar Poción de Soporte
transmute_support_potion_desc = Selecciona y transmuta una poción de soporte.

install_fire_jar = Instalar Tarro de Fuego
install_fire_jar_desc = Instala un tarro de fuego.

install_ice_jar = Instalar Tarro de Hielo
install_ice_jar_desc = Instala un tarro de hielo.

potionology_master = Maestro de Poción
potionology_master_desc = Aumenta la duración de los efectos de las pociones.

kill_switch = Interruptor de Muerte
kill_switch_desc = Detona una unidad mecánica que creaste, causando daño a las unidades cercanas.

soul_synthesis = Síntesis de Piedra del Alma
soul_synthesis_desc = Consume la barra de Ira para sintetizar una Piedra del Alma.

trap_expert = Experto en Trampas
trap_expert_desc = Aumenta el área de daño al activar cañones, tarros y dispositivos similares.

install_cannon = Instalar Cañón
install_cannon_desc = Instala un cañón.

install_auto_turret = Instalar Torretas Automáticas
install_auto_turret_desc = Instala una torreta de ballesta que dispara automáticamente.

install_magic_jar = Instalar Tarro Mágico
install_magic_jar_desc = Selecciona e instala un tarro mágico.

throw_glacial_spear = Lanzar Lance Glacial
throw_glacial_spear_desc = Lanza la lanza equipada, causando daño de hielo a los enemigos en su camino.

dual_wielder = Portador Dual
dual_wielder_desc = Al usar armas de dos manos, usar una habilidad con un arma cuerpo a cuerpo de una mano desencadena un ataque adicional con el arma en la otra mano.

leap_attack = Ataque Férreo
leap_attack_desc = Salta para moverte y atacar a un solo objetivo.

blade_and_gun_mastery = Maestría en Espada y Pistola
blade_and_gun_mastery_desc = Al empuñar tanto una pistola como un arma cuerpo a cuerpo, dispara la pistola después de aplicar un ataque básico cuerpo a cuerpo. Al usar una habilidad con un arma cuerpo a cuerpo, realiza un ataque adicional con la pistola en la otra mano.

heavy_dual_wield = Doble Empuñadura Pesada
heavy_dual_wield_desc = Permite equipar dos armas de dos manos que no sean lanzas, una en cada mano.

blood_pact_aura = Pacto de Sangre
blood_pact_aura_desc = Agrega un beneficio de robo de vida a las criaturas invocadas, y el invocador también recupera tanto como roban las criaturas invocadas. Cuando recibes una bendición, también se manifiesta a tus invocaciones.

toxicology_master = Maestro en Toxicología
toxicology_master_desc = Aumenta la duración de los efectos de veneno. El daño por veneno puede matar al objetivo.

fire_and_lightning_spreader_aura = Aura Difusora de Fuego y Relámpago
fire_and_lightning_spreader_aura_desc = Aumenta el alcance de propagación de incendios iniciados por aliados y el alcance de propagación de electricidad sobre el agua.

amplifying_dice = Dados Amplificadores
amplifying_dice_desc = Lanza un dado para aumentar el daño, la curación, etc. del objetivo proporcional al resultado.

summon_balrog = Invocar Balrog
summon_balrog_desc = Invoca a un Balrog.
