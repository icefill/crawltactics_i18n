shrine_quest_text = Una misteriosa estatua se encuentra aquí. Al activarla, se pueden obtener los siguientes resultados.

#### QUEST 1 #######################

a_small_frog_title = Una Pequeña Rana
a_small_frog_summary = Una Rana Pequeña en Busca de un Beso
a_small_frog_text = Una pequeña rana está aquí. Parece estar buscando un beso de una bella mujer. ¿Qué quieres hacer con ella?

choice_kiss_the_frog_title = Besar la Rana
choice_kiss_the_frog_summary = Cumple el Pedido de la Rana
choice_kiss_the_frog_text = Uno de los miembros de tu grupo le da un beso a la rana. Sin sorpresas, no pasa nada, y tu unidad se siente enferma. La rana ofrece un amuleto como disculpa.

choice_kiss_female_title = Besar la Rana
choice_kiss_female_text = ¡La apariencia de Groff ha cambiado!
choice_kiss_female_summary = Cumple el pedido de la rana.
choice_kiss_male_title = Besar la Rana
choice_kiss_male_text = Uno de los miembros de tu grupo besa a la rana. Sorprendentemente, no pasa nada, y tu miembro del grupo siente dolor. Como disculpa, la rana ofrece un talismán.
choice_kiss_male_summary = Cumple el pedido de la rana.
finmuck_title = Finmuck
finmuck_text = Groffkan se presentó como Finmuck. Como recompensa por devolverlo a su forma original, Finmuck ofrece ayudar a tu grupo en la batalla hasta que llegues a tu destino.
hire_finmuck_title = Contratar a Finmuck
hire_finmuck_text = Has contratado a Finmuck como tu invitado.
hire_finmuck_summary = Contratar a Finmuck.

frozen_tolbok_title = Tolbok Congelado
frozen_tolbok_summary = Un Tolbok congelado busca ayuda.
frozen_tolbok_text = Un Tolbok está congelado aquí. Dice que fue congelado debido a una broma de un mago. Explicó que este hielo mágico solo puede derretirse con el legendario objeto, el Colgante de Copo de Nieve. Luego marcó la ubicación del Colgante de Copo de Nieve en tu mapa.
choice_give_item_ruknash_summary = Dar el objeto a Ruknash.
choice_give_item_ruknash_text = Le diste el Colgante de Copo de Nieve a Ruknash.
ruknash_title = Ruknash
ruknash_text = A cambio de salvarlo, se ofreció a asistirte hasta que llegues a tu destino.
hire_ruknash_summary = Contratar a Ruknash como Invitado

kronasle_escort_title = Solicitud de Escolta de Kronasle
kronasle_escort_summary = Has encontrado a un shaman Kronasle solitario. Desea abandonar este lugar y busca tu escolta.
kronasle_escort_text = Has encontrado a un shaman Kronasle solitario. Quiere abandonar este calabozo pero necesita tu ayuda porque todos sus compañeros han muerto. Promete recompensarte con una Piedra del Alma si lo acompañas hasta el final del calabozo.
escort_grik_summary = Escoltar a Grik
escort_grik_text = …
fight_grik_summary = Luchar

kronasle_escort_reward_title = Recompensa por la Escolta de Kronasle
kronasle_escort_reward_text = Grik te agradeció.
griks_reward_summary = Tomar piedras del alma de Grik
griks_reward_text = ...

druz_the_warrior_title = Druz el Guerrero
druz_the_warrior_summary = El beligerante Druz busca una batalla uno a uno.
druz_the_warrior_text = Te encuentras con un guerrero Vashi que empuña un arma maldita. Si lo derrotas en batalla, dice que te asistirá en la lucha en este calabozo o te dará el arma.

druz_after_surrender_title = Druz Tras la Rendición
druz_after_surrender_text = Druz ha admitido su derrota.

hire_druz_summary = Contratar a Druz como Compañero de Misión
hire_druz_text = Druz ha aceptado ayudarte en el calabozo.

receive_icycle_summary = Recibir un Arma
receive_icycle_text = Druz te dio un arma idéntica a la suya.

rescue_tolbok_title = Tolbok en Peligro
rescue_tolbok_summary = Tolbok está rodeado por Grofkhans. Él busca rescate.
rescue_tolbok_text = Encuentras a un Tolbok rodeado por Grofkans. ¡Está en peligro! Los Grofkans dicen que si ignoras la situación y sigues adelante, te recompensarán con Piedras del Alma. ¿Qué vas a hacer?
fight_against_grofkans_to_rescue_tolbok_summary = Luchar contra los Grofkans para rescatar al Tolbok.
ignore_grofkans_summary = Ignorar y seguir adelante.
ignore_grofkans_text = Ignoraste la situación y seguiste adelante. Los Grofkans te lanzaron un saco que contiene piedras del alma.
tolbok_rescue_reward_title = La Recompensa de Tolbok
tolbok_rescue_reward_text = Tolbok quiere ofrecer una recompensa a cambio.
choice_rescued_tolbok_summary = Recibir una carta de Tolbok.
choice_rescued_tolbok_text = Tolbok expresó su agradecimiento.
choice_rescued_tolbok_item_summary = Recibir un objeto de Tolbok.
choice_rescued_tolbok_item_text = Tolbok expresó su agradecimiento.

tolboks_and_vashies_title = Tolboks y Vashies
tolboks_and_vashies_summary = Un grupo de Tolboks y un grupo de Vashies se están mirando fijamente aquí. Ambos te miran y piden tu apoyo.
tolboks_and_vashies_text = Un grupo de Tolboks y un grupo de Vashies se están mirando fijamente aquí. Al llegar, ambos te miran y piden tu apoyo. ¿Qué harás?
fight_with_tolboks_summary = Apoyar a los Tolboks y luchar.
fight_with_vashies_summary = Apoyar a los Vashies y luchar.
tolbok_party_prize_title = La Recompensa de la Fiesta de Tolbok
tolbok_party_prize_text = Los Tolboks te ofrecieron un regalo como recompensa por luchar a su lado.
tolbok_prize_item_summary = Recibir un objeto.
tolbok_prize_item_text = ..
vashi_party_prize_title = La Recompensa de la Fiesta Vashi
vashi_party_prize_text = Los Vashies te ofrecieron un regalo como recompensa por luchar a su lado.
vashi_prize_item_summary = Recibir un objeto.
vashi_prize_item_text = ..

kronasle_revenge_request_title = Solicitud de Venganza de un Kronasle
kronasle_revenge_request_summary = Kronasle Busca Venganza
kronasle_revenge_request_text = Un Kronasle está de pie aquí con una expresión cansada. Se presenta como un exlíder del Clan de la Llama Inextinguible, traicionado por su mano derecha. Quiere recuperar su arma robada.

choice_give_item_title = Devolver Su Arma
choice_give_item_summary = Recuperar el Arma Robada
choice_give_item_text = Él recibe su arma con una expresión amarga. Como signo de gratitud, le enseña a la unidad seleccionada uno de sus hechizos de fuego.

kronasle_unquenchable_flame_clan_title = El Clan de la Llama Inextinguible
kronasle_unquenchable_flame_clan_summary = Encuentro con el Clan de la Llama Inextinguible
kronasle_unquenchable_flame_clan_text = Un grupo de Kronasles está aquí. El líder empuña una inusual espada llameante. Él afirma ser el líder del clan inextinguible y explica que destronó al antiguo líder abusivo.

wolf_companion_title = Un Lobo Espera a Su Maestro
wolf_companion_summary = Un Lobo Buscando a Su Maestro
wolf_companion_text = Un lobo solitario está de pie aquí. Dice que está esperando a su maestro y que han pasado más de 3 días desde que comenzó a esperar.

wolf_after_visit_master_title = Descubriendo la Verdad
wolf_after_visit_master_summary = Descubrir el Destino del Maestro del Lobo
wolf_after_visit_master_text = Ahora sabes que su maestro ya está muerto. ¿Qué quieres hacer ahora?

tell_the_wolf_the_truth_summary = Decir la Verdad al Lobo
tell_the_wolf_the_truth_text = Le dices al lobo que su maestro está muerto y le muestras sus restos. El lobo te agradece por tu ayuda y decide seguirte.

tell_a_lie_to_the_wolf_summary = Mentir al Lobo
tell_a_lie_to_the_wolf_text = Le dices al lobo que te encontraste con su maestro, pero que el maestro ya no lo quería. El lobo no te cree del todo pero te enseña cómo invocar a su amigo para que te ayude como forma de mostrar su gratitud.

injured_hawk_title = Halcón Herido
injured_hawk_summary = Un halcón herido está buscando ayuda.
injured_hawk_text = Encontraste un halcón herido. El halcón parece estar buscando ayuda. ¿Qué harás?
hawk_after_healed_text = Gracias a ti, el halcón se ha recuperado por completo. Parece que te seguirá cuando hagas una señal.
learn_hawk_familiar_summary = Acompañar al halcón.
give_hawk_potion_summary = Darle al halcón una poción curativa.
give_hawk_potion_text = Le diste al halcón una poción curativa.

blood_pact_with_imp_title = Pacto de Sangre
blood_pact_with_imp_summary = Un Ímp busca su nuevo maestro.
blood_pact_with_imp_text = Has encontrado un Ímp. El Ímp quiere que te conviertas en su nuevo contratista, ya que el anterior ha muerto. ¿Qué elegirás?
choice_blood_pact_summary = Hacer un pacto de sangre con el Ímp.
choice_blood_pact_text = Aceptaste la solicitud del Ímp.

a_corpse_of_human_text = Un Cadáver de Cazador Yace Aquí.
wolf_master_corpse_text = El cuerpo de un cazador yace aquí. Parece que el cadáver es del maestro del lobo.

injured_tolbok_party_title = Un Grupo de Tolboks Envenenados
injured_tolbok_party_summary = Un grupo de toloks envenenados está buscando ayuda.
injured_tolbok_party_text = Un grupo de tolboks está aquí. No parecen hostiles como los monstruos habituales. El líder dice que están envenenados por haber comido ciertos frutos y necesitan un antídoto hecho de Elixir de Inteligencia.

tolbok_asking_antidote_title = Tolbok Pidiendo un Antídoto
tolbok_asking_antidote_summary = Tolbok Busca un Antídoto
tolbok_asking_antidote_text = El líder de los tolboks nota que tienes el elixir. Te pide que se lo des, o no te dejará pasar.

antidote_quest_title = Elixir de Inteligencia
antidote_quest_summary = Buscar el Elixir de Inteligencia
antidote_quest_text = Hay un santuario misterioso aquí.

give_antidote_summary = Dar el Elixir a los Tolboks
give_antidote_result = Los Tolboks usan el elixir para crear un antídoto y curarse. En agradecimiento, te dan una carta.

fight_injured_tolbok_party_title = Lucha
fight_injured_tolbok_party_summary = Batalla

examine_the_shrine_summary = Examinar el Santuario
examine_the_shrine_result = ...

old_warrior_title = La Solicitud de un Viejo Guerrero
old_warrior_summary = Un viejo guerrero ha tenido su arma robada por monstruos.
old_warrior_text = Un viejo guerrero está de pie aquí. Dijo que los monstruos le robaron su arma mientras dormía. Sabe dónde están, pero no puede recuperarla él mismo. Ofrece enseñarte sobre combate cuerpo a cuerpo si le ayudas.

give_his_weapon_back_summary = Devolver Su Arma
give_his_weapon_back_text = Él expresa su gratitud y te da un elixir misterioso.

kronasle_thieves_title = Ladrones Kronasle
kronasle_thieves_summary = Encuentro con los Ladrones Kronasle
kronasle_thieves_text = Un grupo de Kronasles está aquí. Tienen un arma rara que no parece ser de ellos.

choice_fight_thieves_summary = Luchar contra los Ladrones

bram_1on1_title = Bram el Porteador del Escudo
bram_1on1_summary = Un lancer busca a alguien más fuerte que él para seguir.
bram_1on1_text = Encuentras a un lancer que lleva un escudo aquí. Se presenta como Bram. Dice que está dispuesto a ayudar en tu aventura, pero solo sigue a alguien más fuerte que él.
bram_fight_1on1_summary = Batalla 1v1 con Bram
bram_after_surrender_text = Bram está impresionado por tu fuerza y quiere seguirte.
hire_bram_summary = Contratar a Bram

renee_the_jealous_title = Renee la Celosa
renee_the_jealous_summary = Hay una hermosa arquera que se niega a seguir a otras mujeres.
renee_the_jealous_text = Una hermosa arquera está de pie aquí. Dice que no seguirá a una mujer.

renee_condition_leader_is_male_title = Renee la Celosa
renee_condition_leader_is_male_text = Una arquera experimentada se acerca y te habla. Se presenta como Renee y está fascinada por ti. Te seguirá si se lo permites, pero podría no llevarse bien con otras mujeres.

skeleton_with_a_heart_title = Esqueleto con un Corazón
skeleton_with_a_heart_summary = Un esqueleto parlante quiere aprender sobre su verdadera identidad.
skeleton_with_a_heart_text = ...
before_visit_skeleton_friend_title = Esqueleto con un Corazón
before_visit_skeleton_friend_text = Encontraste un soldado esqueleto. A diferencia de los esqueletos típicos, parece capaz de razonar y hablar. Menciona que aunque ha perdido su memoria, recuerda vagamente a una sacerdotisa y cree que si la encuentra, podría descubrir la verdad sobre su identidad.
say_a_lie_to_skeleton_summary = Decir una mentira y sugerir que te siga
say_a_lie_to_skeleton_text = Le dijiste que encontraste a la sacerdotisa, pero que ella ya había muerto, y en su lugar sugeriste que te siguiera.
after_visit_skeletons_friend_text = Ahora conoces la identidad del esqueleto y sobre su amigo. ¿Actuarás sin dudar?
hire_skeleton_summary = Contratar al Esqueleto
hire_skeleton_text = Agradecido por tu ayuda, el esqueleto decidió seguirte.
resurrect_skeleton_summary = Resucitar al Esqueleto
resurrect_skeleton_text = Usaste el pergamino dado por la sacerdotisa para resucitar al esqueleto.
skeletons_friend_title = El Amigo del Esqueleto
skeletons_friend_text = ...
after_visit_skeleton_title = El Amigo del Esqueleto
after_visit_skeleton_text = Encontraste a la sacerdotisa que coincide con la descripción que el esqueleto te dio. Confirmó que el esqueleto era efectivamente su compañero y había huido de una batalla con un nigromante. Te dio un pergamino y te pidió que lo usaras en el esqueleto para restaurarlo a su forma humana. A cambio, prometió enseñarte la habilidad de Exorcismo, que causa un gran daño a las unidades no-muertas, si logras restaurarlo.
after_resurrect_skeleton_text = La sacerdotisa desea enseñarte la habilidad de Exorcismo como recompensa por tu ayuda.
learn_exorcism_summary = Aprender la habilidad de Exorcismo
learn_exorcism_text = ...

hire_renee_summary = Contratar a Renee
hire_renee_text = Se ha unido a tu grupo.

john_the_virtuous_title = John el Virtuoso
john_the_virtuous_summary = Un caballero herido necesita una poción curativa.
john_the_virtuous_text = Un caballero herido te habla, jadeando. Dice que los monstruos lo hirieron y necesita curación. Te seguirá si le ayudas.

after_healed_title = Después de Curar
after_healed_text = Te seguirá si se lo permites, pero se irá si haces algo malo.

give_john_potion_summary = Darle a John una Poción Curativa
give_john_potion_text = Le das una poción curativa y se siente mejor. Te seguirá si le dejas, pero se irá si haces algo malo.

hire_john_summary = Contratar a John

awakener_of_rage_title = El Despertador de la Ira
awakener_of_rage_summary = Un guerrero demoníaco ofrece despertar la ira a cambio de salud.
awakener_of_rage_text = Te has encontrado con un guerrero demoníaco. Se llama a sí mismo el Despertador de la Ira y ofrece despertar el poder de la ira a cambio de tu salud. ¿Qué harás?
leader_health_to_rage_summary = Sacrificar la salud del líder para despertar la ira
leader_health_to_rage_text = Aceptaste la oferta del demonio y adquiriste el poder de la ira.

the_weapon_collector_title = El Coleccionista de Armas
the_weapon_collector_summary = Un mago demoníaco ofrece aumentar el mana máximo a cambio de una valiosa arma.
the_weapon_collector_text = Encontraste a un hechicero demoníaco que irradia poderosas energías mágicas. Se presentó como el Coleccionista de Armas y te ofreció aumentar el mana máximo de tu grupo a cambio de una valiosa arma. ¿Qué elegirás?
give_a_weapon_and_increase_mana_summary = Aceptar la oferta del demonio.
give_a_weapon_and_increase_mana_text = Le entregaste tu arma. A cambio, el demonio aumentó el mana máximo de tu grupo.

frost_fall_title = Caída de Escarcha
frost_fall_summary = Un noble quiere rescatar a su amante de los monstruos.
frost_fall_text = Un noble de aspecto frágil llamado Caída de Escarcha está aquí. Te habla sobre un grupo de monstruos que secuestraron a su amante y está buscándola para rescatarla. Pide tu ayuda para traerla de vuelta.

after_killing_lujath_title = Después de Matar a Lujath
after_killing_lujath_text = Has matado a Lujath, pero Frost no lo sabe. ¿Qué quieres decirle a Frost?

give_lujath_corpse_and_tell_a_lie_summary = Decirle una mentira que Grug la mató
give_lujath_corpse_and_tell_a_lie_text = No podías confesar la verdad de que la mataste junto con Grug. En su lugar, mentiste diciendo que Grug fue el responsable. Frost pareció triste pero agradecido por la retribución. Te recompensó con un arma. A pesar de sentirte culpable, mantuviste la verdad oculta.

after_hearing_the_truth_title = Después de Escuchar la Verdad Sobre Lujath
after_hearing_the_truth_text = Has aprendido que Lujath ni siquiera conocía a Frost. ¿Qué planeas decirle a Frost ahora?

tell_the_truth_to_frost_title = Decirle que ella ama a Grug
tell_the_truth_to_frost_summary = Decirle que ella ama a Grug
tell_the_truth_to_frost_text = Le has dicho que Lujath siguió a Grug debido a sus afectos por él y que no le importaba a Frost. Enfurecido, Frost emite una súbita explosión de llamas que daña a tu grupo. Luego se disculpa y te ofrece un arma elegante como compensación.

after_visit_title = Después de Visitar a Grug
after_visit_summary = Después de Visitar a Grug
after_visit_text = ¿Qué planeas decirle a Grug?

the_beauty_and_beasts_title = La Belleza y las Bestias
the_beauty_and_beasts_text = Un grupo de monstruos está acompañado por una hermosa chica en una posición extraña. ¿Qué acción tomarás?

fight_with_grug_title = Lucha
fight_with_grug_summary = Lucha

after_visit_frost_fall_title = Después de Visitar a Frost
after_visit_frost_fall_text = Te encuentras con un grupo de monstruos y una hermosa chica. Parecen coincidir con la descripción de la búsqueda de Caída de Escarcha. Sin embargo, los monstruos no parecen amenazantes, ni la chica parece asustada. ¿Qué harás?

fight_with_grug2_title = Lucha
fight_with_grug2_summary = Participar en una pelea

persuade_the_girl_title = Intentar Persuadir
persuade_the_girl_summary = Intentar Persuadir
persuade_the_girl_text = Intentas persuadir a los monstruos y a la chica para que regresen con Frost. Ella enfatiza que tiene afecto por el líder de los monstruos debido a su fuerza y revela que apenas sabe algo sobre Frost. Desafortunadamente, se niega a dejar a los monstruos.

fel_party_title = Fiesta Fel
fel_party_summary = Hay un grupo de Fel que solo sigue a mujeres y muestra hostilidad hacia los hombres.
fel_party_text = Un grupo de Fels está reunido aquí. Expresan un fuerte resentimiento hacia el liderazgo masculino, y sus opiniones extremas los llevan a atacar a tu grupo.

fight_with_fel_party_title = Comienza la Batalla
fight_with_fel_party_summary = Comienza la Batalla

fel_party_when_our_leader_is_female_title = Fiesta Fel
fel_party_when_our_leader_is_female_text = Un grupo de Fels está presente, y su líder femenina parece tener un enamoramiento contigo. Está dispuesta a unirse a tu grupo, pero solo si no se permite que más mujeres sigan.

hire_olases_summary = Contratar a Olases
hire_olases_title = Contratar a Olases
hire_olases_text = Olases ahora te seguirá. Sin embargo, no aceptará a ninguna otra mujer en el grupo.

karas_the_charismatic_title = Karas la Carismática
karas_the_charismatic_summary = Una mujer ofrece mejorar el liderazgo a cambio de maná y piedras del alma.
karas_the_charismatic_text = Una mujer llamada Karas la Carismática se presenta ante ti. Ofrece mejorar tus habilidades de liderazgo y persuasión a cambio de tu maná y un pequeño pedazo de tu alma.

karas_add_charisma_lose_mana_summary = Dale a Karas los recursos y aprende de ella
karas_add_charisma_lose_mana_text = Karas imparte las lecciones prometidas, dejándote sentir más carismático.

kain_the_dark_warrior_title = Kain el Guerrero Oscuro
kain_the_dark_warrior_summary = Un Caballero del Terror desea seguir a un grupo maligno.
kain_the_dark_warrior_text = Se encuentra un misterioso caballero del terror. Tu intento de conversar con él genera poco interés, y deja de hablar.

kain_when_player_evil_title = Kain el Guerrero Oscuro
kain_when_player_evil_text = El guerrero oscuro percibe una aura malévola de tu parte y decide unirse a tu grupo. ¿Cuál será tu próximo paso?

hire_kain_summary = Contratar a Kain
hire_kain_title = Contratar a Kain
hire_kain_text = ...

dark_smith_title = Herrero Oscuro
dark_smith_summary = Hay un herrero que forja armas a costa de la salud de una unidad.
dark_smith_text = Un diablo con un enorme martillo está aquí, presentándose como un herrero que forja armas utilizando almas. Ofrece forjarte un arma, exigiendo la salud y el alma de un hombre como pago.

receive_item_lose_health_summary = Sacrifica la salud de una unidad por un arma
receive_item_lose_health_text =...

luna_the_witch_title = Luna la Bruja
luna_the_witch_summary = Una bruja traviesa busca ingredientes terribles.
luna_the_witch_text = Una bruja de aspecto extraordinario llamada Luna busca los ojos de criaturas anfibias para una poción. Promete un objeto útil hecho de los ojos como recompensa.

give_frog_eyes_title = Dale los Ojos a la Bruja
give_frog_eyes_summary = Entrega los ojos a la bruja
give_frog_eyes_text = Le entregas los ojos, y ella los rechaza de inmediato como repulsivos. Fiel a su palabra, te ofrece un elixir a cambio.

say_it_is_gross_title = Di que los ojos son asquerosos
say_it_is_gross_summary = Di que son asquerosos y declina la solicitud
say_it_is_gross_text = Ella está de acuerdo, comentando que tal vez realmente son asquerosos. Su expresión toma un giro enigmático, insinuando algún motivo oculto. Con una sonrisa inquietante, te entrega un elixir. En un suave soliloquio, captas susurros de su renovado interés en ti y su intención de influenciarte. Sugiere que te seguirá, siempre que se lo permitas.

luna_after_saying_gross_title = Luna la Bruja
luna_after_saying_gross_text = Ahora te acompañará si lo aceptas.

hire_luna_summary = Contratar a Luna
hire_luna_text = ...

frogman_title = Los Anfibios
frogman_text = Se presenta una reunión de monstruos anfibios.

ray_the_deceiver_title = Ray el Engañador
ray_the_deceiver_summary = Un ominoso nigromante busca investigaciones prohibidas.
ray_the_deceiver_text = ...

ray_first_visit_title = Ray el Engañador
ray_first_visit_text = Un ominoso nigromante se presenta como Ray el Engañador. Busca objetos peculiares e informa que necesita el cadáver de una persona llamada Alicia. ¿Cuál será tu acción?

choice_fight_ray_summary = Derrotar a Ray

ray_after_visit_alisia = Ray el Engañador
ray_after_visit_alicia_text = Un ominoso nigromante, potencialmente el criminal que Alicia persigue, está ante ti. ¿Cuál es tu decisión?

listen_ray_summary = Intentar conversar con Ray
listen_ray_text = Ray admite abiertamente su identidad e intereses. Afirma ser un artista fascinado por la humanidad en lugar de centrarse en actividades siniestras. Hace una propuesta: trae el cuerpo de Alicia, y te recompensará con un relicario para engañar a la muerte.

ray_visit_again_title = Después de Escuchar a Ray y a Alicia
ray_visit_again_text = Te enfrentas a Ray nuevamente, ahora consciente de su interés en el cadáver de Alicia. ¿Qué harás respecto a Ray?

give_the_corpse_of_alicia_summary = Entrega el cadáver de Alicia
give_the_corpse_of_alicia_text = Le das a Ray el cadáver de Alicia, y él cumple su palabra.

after_giving_the_corpse_of_alicia_text = Ray habla. Puedes elegir una de estas opciones.

receive_ring_of_nec_summary = Obtén el Anillo de Nigromancia
receive_ring_of_nec_text = Ray te regala un anillo capaz de transformarte en una criatura no muerta. Desaparece en una nube de humo púrpura.

receive_book_of_dark_summary = Recibe el Libro del Conocimiento de Magia Oscura
receive_book_of_dark_text = Como recompensa, Ray te da un libro que contiene conocimiento de magia oscura. Desaparece después del intercambio.

fight_ray_summary = Luchar

alicia_party_after_visit_ray_title = La Fiesta de Alicia
alicia_party_after_visit_ray_text = Llegas al lugar que Ray mencionó, encontrando un grupo de caballeros y arqueros liderados por Alicia. ¿Cuál será tu próximo movimiento?

choice_fight_alicia_summary = Enfrentar a Alicia en combate
listen_alicia_summary = Intentar conversar con Alicia
listen_alicia_text = Discutes sobre Ray con Alicia. Ella se identifica como parte del ejército real, encargada de capturar criminales graves. Ofrece una recompensa si traes el cadáver de Ray.

alicia_first_visit_title = La Fiesta de Alicia
alicia_first_visit_text = Un grupo de caballeros y arqueros está ante ti. La líder, Alicia, y su equipo están en una misión para capturar a un criminal responsable de actos atroces. Ofrece una recompensa a cambio de localizar y traer al criminal, Ray.

alicia_visit_again_title = La Fiesta de Alicia
alicia_visit_again_text = Te encuentras nuevamente con Alicia. Ella busca la captura de Ray, ya que representa una grave amenaza. ¿Cómo manejarás esta situación?

give_rays_corpse_summary = Entregar el cadáver de Ray
give_rays_corpse_text = Le proporcionas a Alicia el cadáver de Ray, y ella cumple su promesa, ofreciéndote una recompensa.

dogs_and_lizards_title = Perros y Lagartos
dogs_and_lizards_summary = Sardils y Taves están a punto de entrar en batalla. Ambas partes podrían recompensarte por tu asistencia.
dogs_and_lizards_text = Sardils y Taves, conocidos por su mutua hostilidad, están a punto de entrar en batalla. Ambas partes podrían recompensarte por tu asistencia.

fight_both_summary = Batalla contra ambas partes.
fight_with_lizards_summary = Luchar junto a los Lagartos
fight_with_dogs_summary = Luchar junto a los Taves
pass_by_silently_summary = Ignorar y pasar en silencio

dogs_prize_title = Recompensa de los Taves
//dogs_prize_text = Dado que ayudaste a los Taves, su líder decide enviar un esbirro para asistirte.

dogs_prize_text = Has ganado la confianza de los Taves. Su líder te concede permiso para usar a sus soldados si lo deseas.
unlock_taves_merc_camp_summary = Desbloquear el Campamento de Mercenarios de los Taves.
unlock_taves_merc_camp_text = Ahora puedes construir el Campamento de Mercenarios de los Taves en el pueblo.

hire_dog_minion_summary = Contratar a un esbirro de los Taves

lizards_prize_title = Recompensa de los Sardils
lizards_prize_text = Al ayudar a los Sardils, su líder te ofrece un esbirro para unirte a tu grupo.

hire_lizard_minion_summary = Contratar a un esbirro Sardil

mummified_frogs_title = Ranas Momificadas
mummified_frogs_summary = Un grupo de Groffins, agotados por el calor, pide ayuda.
mummified_frogs_text = Encuentras un grupo cansado de Groffins. El área está extremadamente caliente y seca. Los Groffins exhaustos explican que han sido maldecidos por el calor y solo pueden recuperarse si obtienen la Carta de Inundación. Mencionan que la Carta de Inundación está escondida, y han marcado su ubicación en tu mapa.
give_flood_card_summary = Entregar la Carta de Inundación a los Groffins.
fight_injured_groffin_party_summary = Luchar contra el grupo de Groffin herido.
flood_card_quest_title = Carta de Inundación
flood_card_quest_text = Un altar donde algo está escondido se encuentra aquí.
examine_the_flood_shrine_summary = Examinar el altar.
groffin_asking_flood_card_text = El grupo de Groffins te pide la Carta de Inundación. ¿Cuál será tu decisión?
give_flood_card_text = Le diste la Carta de Inundación al grupo de Groffins. Los Groffins se recuperaron, y ahora puedes contratar mercenarios Groffin.

dark_sacrifice_title = Sacrificio Oscuro
dark_sacrifice_summary = Un grupo de sacerdotes oscuros busca sacrificar un paladín a la oscuridad.
dark_sacrifice_text = Un grupo de sacerdotes oscuros y un paladín están enfrentándose aquí. Los sacerdotes oscuros dicen que si el paladín es ofrecido como sacrificio, el dios oscuro estará complacido y otorgará una recompensa. ¿Cuál es tu elección?
fight_against_dark_priests_summary = Luchar contra los sacerdotes oscuros.
fight_with_dark_priests_summary = Ayudar a los sacerdotes oscuros a luchar.
jeanne_reward_title = Jeanne la Santa
jeanne_reward_text = Se presentó como Jeanne. Mencionó que mientras luchaba tras recibir una revelación divina, fue atacada por sacerdotes demoníacos, pero gracias a ti, pudo escapar del peligro. Jeanne desea darte el escudo legendario.
choice_holy_defender_summary = Recibir un escudo de Jeanne.
dark_priests_reward_title = Recompensa de los Sacerdotes Oscuros
dark_priests_reward_text = Los sacerdotes malvados dijeron que el paladín fue un sacrificio elegido por el dios maligno, y ahora pueden construir un templo para los muertos utilizando este sacrificio. También dijeron que si lo permites, podrán construir un templo de la muerte en tu área.
choice_temple_of_the_dead_summary = Permitir la construcción de un templo para los muertos en el pueblo.

vulcan_the_blacksmith_title = Herrero Vulcan
vulcan_the_blacksmith_summary = El herrero solicita una escolta para abandonar este lugar.
vulcan_the_blacksmith_text = Te encuentras aquí con un herrero. Se presenta como Vulcan y dice que se perdió mientras buscaba minerales. Mencionó que si lo ayudas a llegar a la salida de esta mazmorras, puede ofrecerte una recompensa. ¿Qué harás?
escort_vulcan_summary = Escoltar a Vulcan
vulcan_escort_reward_title = La Recompensa del Herrero
vulcan_escort_reward_text = Vulcan dijo que como recompensa por tu ayuda, puede permitirte construir una forja en el pueblo o darte una armadura legendaria. ¿Cuál es tu elección?
choice_vulcan_reward_blacksmith_summary = Desbloquear la forja
choice_vulcan_reward_armor_summary = Recompensa de armadura

philosophers_stone_title = Piedra Filosofal
philosophers_stone_summary = El alquimista quiere detener su creación y recuperar la Piedra Filosofal.
philosophers_stone_text = Aquí te encuentras con un alquimista. Afirma haber creado con éxito la Piedra Filosofal, pero después de intentar la transmutación humana, la construcción completada se negó a obedecerle y se marchó. Promete que si puedes devolver la Piedra Filosofal de la construcción, él construirá un laboratorio de alquimia para ti.
albertus_asking_the_stone_text = Albertus te pide que le devuelvas la Piedra Filosofal. ¿Cuál es tu decisión?
give_philosophers_stone_summary = Entregar la Piedra Filosofal a Albertus.
homunculus_title = Homúnculo
homunculus_text = Te encuentras con un ser que se asemeja a un humano pero es extrañamente antinatural. ¿Qué harás?
after_meeting_albertus_text = Descubres un gigante ante ti. Parece ser el humano artificial del que habló el alquimista. El gigante te ofrece piedras del alma si lo dejas en paz. ¿Cuál es tu decisión?
fight_with_homunculus_summary = Luchar contra el homúnculo
receive_soul_crystals_from_homunculus_summary = Aceptar las piedras del alma

trapped_soul_title = Alma Atrapada
trapped_soul_summary = Un fantasma con un alma atrapada desea liberarse del contrato y ganar su libertad.
trapped_soul_text = Al entrar en este lugar, descubres un fantasma. Parece tener algo que decir.
choice_listen_to_soul_summary = Escuchar al fantasma.
choice_listen_to_soul_text = El fantasma explica que su alma ha sido atrapada por un mago malvado y necesita tu ayuda. Si eliminas al mago, sus esbirros abandonarán la lucha. Después de hablar, el fantasma desaparece de repente en una nube de humo púrpura.
soul_manipulator_title = Manipulador de Almas
soul_manipulator_text = Te encuentras con un mago que está controlando a un grupo de no muertos. ¿Qué harás?
after_meeting_ghost_title = Faust
after_meeting_ghost_text = Te encuentras con un mago con un grupo de esbirros no muertos. Entre ellos está el fantasma que viste anteriormente, y parece que el mago los está controlando.
fight_with_faust_summary = Participar en la batalla
ghost_after_free_title = Fantasma Liberado
ghost_after_free_text = Los no muertos permanecen inmóviles, sin reaccionar.
child_ghost_is_alive_title = Alma Liberada
child_ghost_is_alive_text = El fantasma te agradece por ayudarle a encontrar la libertad. Se ofrece a seguirte si lo permites. ¿Cuál será tu decisión?
choice_hire_ghost_summary = Contratar a Eliza

harpione_title = Harpione
harpione_summary = Un Hombre Halcón desea seguir a una persona sabia.
harpione_text = Aquí encuentras a una mujer Halcón. Presentándose como Harpione, afirma que sus alas serían útiles para tu aventura. Sin embargo, Harpione solo desea seguir a un hombre sabio; de lo contrario, exige una recompensa apropiada para unirse a ti. ¿Qué elegirás?

hire_harpione1_summary = Convéncela de seguir tu brillantez.
hire_harpione1_text = Inicias una breve conversación con Harpione. Cautivada por tu intelecto, acepta seguirte.

hire_harpione2_summary = Contratar a Harpione con piedras del alma.
hire_harpione2_text = Atraída por las piedras del alma, decide seguirte.

rescue_beatrix_title = Beatrix en Peligro
rescue_beatrix_summary = Un sacerdote está rodeado de monstruos y busca ayuda.
rescue_beatrix_text = Una acólita rodeada de monstruos demoníacos parece estar en grave peligro. Su supervivencia puede depender de tu intervención. ¿Qué harás?

fight_against_kronasles_to_rescue_beatrix_summary = ¡Lucha contra los demonios para rescatarla!
ignore_fiends_summary = Ignora y pasa en silencio
ignore_fiends_text = Decides no asistir, dejando a la acólita a su destino.

beatrix_hire_title = Beatrix
beatrix_hire_text = Expresando gratitud por tu ayuda, la acólita se presenta como Beatrix. Irónicamente, ha vagado por la mazmorras para ayudar a otros en peligro. Ella propone unirse a tu grupo para devolver tu amabilidad.

choice_hire_beatrix_summary = Contrata a Beatrix.

kalodor_the_aggressive_title = Kalodor el Agresivo
kalodor_the_aggressive_summary = Un Sardil fuertemente armado busca una batalla uno a uno.
kalodor_the_aggressive_text = Un Sardil fuertemente armado llamado Kalodor se presenta, ansioso por combatir. Te desafía a un combate singular, prometiendo unirse si es derrotado. ¿Cuál es tu respuesta?

fight_1on1_summary = Participa en un duelo uno a uno

kalodor_after_surrender_title = Kalodor el Agresivo
kalodor_after_surrender_text = Derrotado, Kalodor concede y reconoce tu fuerza. Expresa interés en unirse a tu grupo para más batallas emocionantes. Ahora puedes elegir contratarlo.

hire_kalodor_summary = Contrata a Kalodor
hire_kalodor_text = Kalodor ahora es parte de tu grupo.

padna_the_greedy_title = Padna la Codiciosa
padna_the_greedy_summary = Padna es una maga hábil pero motivada por el dinero. Al ser contratada, exige pago después de cada batalla.
padna_the_greedy_text = Padna, una maga confiada, exige un pago de 75 de oro por cada batalla en la que participe. Ofrece sus habilidades mágicas, pero solo si es compensada. ¿Qué decidirás?

hire_padna_summary = Contrátala

devil_party_request_title = Petición del Diablo
devil_party_request_summary = Los demonios buscan un tesoro que solo las personas buenas pueden obtener.
devil_party_request_text = Al encontrar demonios, buscan el Elixir de la Salud. Este elixir es concedido a individuos virtuosos por el santuario, que recompensa a los buenos corazones. Dado que los demonios no pudieron obtener el elixir debido a su naturaleza malvada, piden tu ayuda y revelan la ubicación del santuario. ¿Cuál es tu decisión?

give_elixir_of_hp_summary = Da el elixir
give_elixir_of_hp_text = Los demonios reciben el elixir y te recompensan con una reliquia que emite un aura oscura.

fight_devil_summary = Lucha contra los demonios

elixir_of_con_quest_title = Santuario del Elixir de la Salud
elixir_of_con_quest_text = Un santuario se erige ante ti, protegido por un aura que repele el mal. Dentro reposa una poción desconocida. ¿Cómo procederás?

examine_the_elixir_shrine_summary = Investiga el santuario
examine_the_elixir_shrine_text = Al examinar, no encuentras nada, a pesar de que claramente viste una botella brillante antes.

examine_the_elixir_shrine_positive_text = ¡El examen revela un elixir!

examine_the_elixir_shrine_negative_text = ¡Mientras examinas, el aura protectora ataca a la unidad seleccionada!

hire_ray_summary = Sacrifica la unidad seleccionada, contrata a Ray.
hire_ray_text = Aceptaste la sugerencia y señalaste a un compañero sin decir nada.\
   El compañero, sorprendido por tu traición, intentó decir algo, pero no pudiste oír nada. De repente, el cielo se oscureció como una noche sin luna y oyes un grito...

mana_horse_title = Eohippus
mana_horse_summary = Un mago con forma de caballo desea usar a tu aliado como sacrificio para su investigación.
mana_horse_text = Te encuentras con un mago en forma de caballo. Dice que necesita un humano para su investigación, y pide al más experimentado entre tus aliados. Si aceptas, él mejorará tu habilidad de carga de maná a cambio de un sacrificio. ¿Qué harás?

kill_highest_level_ally_summary = Sacrifica al aliado de mayor nivel.
kill_highest_level_ally_text = Mientras Eohippus recita un hechizo, la oscuridad te rodea, seguida del grito de tu aliado. Cuando el cielo vuelve a iluminarse, tu aliado ha desaparecido sin dejar rastro.

angel_ring_quest_title = Anillo del Ángel
angel_ring_quest_summary = Un ángel desciende y desea dar un regalo.
angel_ring_quest_text = Te encuentras con un ángel aquí. Ella te dice que lo divino fue conmovido por tus heroicas aventuras y tu buen corazón, y te otorgó un símbolo del ángel. Se dice que este anillo puede resucitar al portador como un ser celestial al morir. ¿Qué harás?

receive_angel_ring_summary = Recibe el anillo del ángel.

undead_ray_quest_title = El Que Abandonó la Humanidad
undead_ray_quest_summary = Un mago malicioso desea darte un regalo a cambio del sacrificio de tu aliado.
undead_ray_quest_text = Aquí, sentiste una presencia siniestra. Pronto, descubres a un mago en forma de espectro. Para tu sorpresa, afirma haberte encontrado antes. Mencionó que hizo buen uso del cadáver de Alicia, que le diste. Expresó respeto por tus acciones y dijo que había estado esperándote. Para su investigación final, necesita a uno de tus compañeros, y a cambio, ofrece un pequeño regalo. ¿Qué elegirás?

receive_ring_of_the_dead_summary = Acepta su propuesta.
receive_ring_of_the_dead_text = Aceptaste su oferta y señalaste silenciosamente a uno de tus compañeros. El compañero, conmocionado por tu traición, intentó decir algo, pero no oíste nada. De repente, el cielo se oscureció como una noche sin luna y oíste gritos…

fight_with_ray_summary = Lucha contra él.

tyrus_the_fierce_title = Tyrus el Feroz
tyrus_the_fierce_summary = El guerrero Minotauro busca una batalla uno a uno.
tyrus_the_fierce_text = Te encuentras con un guerrero Minotauro. Se presenta como Tyrus y dice que cree que solo la fuerza física es el verdadero poder, y que aquellos que usan magia son cobardes. Si uno de tus compañeros puede derrotarlo usando solo fuerza física, él se someterá. ¿Qué deseas hacer?

fight_1on1_with_tyrus_summary = Participa en una pelea uno a uno con Tyrus.

tyrus_after_surrender_title = Rendición de Tyrus
tyrus_after_surrender_text = Tyrus reconoció su derrota y aceptó seguirte si así lo deseas.
hire_tyrus_summary = Contrata a Tyrus

killorin_the_man_eater_title = Killorin el Comehombres
killorin_the_man_eater_summary = Un gigante conocido por el apodo "Comehombres" se erige ante ti.
killorin_the_man_eater_text = Aquí está un gigante con un solo ojo y colmillos masivos. Se presentó como Killorin el Comehombres, diciendo que la gente lo llama así. Luego expresó su deseo de probar a uno de tus compañeros y ofreció ayudarte en tu viaje si aceptabas su propuesta. ¿Cuál es tu decisión?
sacrifice_your_ally_summary = Sacrifica a tu compañero.
sacrifice_your_ally_text = Señalaste a uno de tus compañeros. Sin embargo, Killorin se rió, diciendo que todo era una broma y que no tenía interés en seguir a alguien tan rápido en sacrificar a sus propios. En ese momento, tu compañero, decepcionado de ti, huyó. Como disculpa, Killorin te dio un arma que tenía pero que siempre había dudado en usar debido a su naturaleza ominosa.
fight_with_killorin_summary = Lucha con Killorin.
fight_with_killorin_text = Killorin se disculpó, diciendo que solo era una broma.
killorin_hire_title = Killorin
killorin_hire_text = A Killorin le gustaron tus acciones y expresó su deseo de seguirte.
choice_hire_killorin_summary = Contrata a Killorin.

ancient_giant_general_title = General Gigante Antiguo
ancient_giant_general_summary = Hay los restos de un gigante con un agujero en su pecho.
ancient_giant_general_text = Descubriste un esqueleto gigante. Sin embargo, el esqueleto simplemente permanecía allí, sin mostrar reacción. Hay un agujero vacío en su pecho.
give_frozen_heart_summary = Coloca el corazón congelado en el pecho del esqueleto.
give_frozen_heart_text = Colocaste el corazón congelado en el pecho del esqueleto. Una luz brilló en los ojos del esqueleto y parecía que tenía algo que decirte.
hire_gendric_quest_title = Gigante Esqueleto
hire_gendric_quest_text = El esqueleto transmitió sus pensamientos a tu mente. Dijo que era un antiguo general que recuperó la consciencia gracias a tu ayuda. Aunque su cuerpo ha estado mucho tiempo en descomposición y solo quedan huesos, desea seguirte en tu viaje.
choice_hire_gendric_summary = Acepta la oferta de Gendric.

frozen_heart_quest_title = Corazón Congelado
frozen_heart_quest_text = Descubriste un altar. En el altar, una gema azul con forma de corazón brilla, emitiendo un aura fría.

sauril_escort_title = Anciano Sardil
sauril_escort_summary = El Anciano Sadil busca un escolta.
sauril_escort_text = Aquí, te encuentras con un viejo Sardil. Se presenta como uno de los ancianos Sardil y explica que perdió a todos sus subordinados en una emboscada. Te pide que lo ayudes a escapar de la mazmorras. Si lo asistes, dice que ganarás la confianza de los Sardil. ¿Qué decidirás?
choice_escort_sauril_summary = Escolta a Sauril
sauril_escort_reward_title = Gratitud del Anciano
sauril_escort_reward_text = Gracias a tu ayuda, el anciano llegó a su destino a salvo. A cambio, permitió que se construyera un campamento de mercenarios Sardil en tu aldea.
saurils_reward_summary = Acepta la recompensa

defend_the_keep_title = Defensa de la Fortaleza
defend_the_keep_summary = Un grupo de soldados solicita tu mando mientras se preparan para un ataque de monstruos.
defend_the_keep_text = Te encuentras en una fortaleza donde soldados y monstruos se enfrentan. Los soldados explican que los monstruos están a punto de invadir y que una gran horda llegará pronto. Al carecer de experiencia, piden tu liderazgo. Si la fortaleza es defendida con éxito, dicen que te apoyarán siempre que necesites tropas.

accept_defend_title = Defiende la fortaleza con los soldados
accept_defend_summary = Defiende la fortaleza con los soldados

defend_reward_title = 
defend_reward_text = Los soldados te agradecen por tu liderazgo y ofrecen una recompensa.

choice_reinforce_card_summary = Recibe cartas de refuerzo

gold_stolen_title = Robo de Oro
gold_stolen_text = ¡Un monstruo ha irrumpido en tu almacenamiento mal guardado, llevándose parte de tu oro!

soul_stolen_title = Robo de Piedras de Alma
soul_stolen_text = Aprovechándose de la baja seguridad del pueblo, ¡un monstruo robó piedras de alma de tu almacenamiento!

epidemic_title = Epidemia
epidemic_text = Debido a la falta de seguridad en el pueblo, se ha propagado una epidemia, envenenando a tus aliados. Esta maldición durará una semana.

gold_bonus_title = Enano Dorado
gold_bonus_text = En tu pueblo seguro y protegido, un Enano Dorado hizo una visita y dejó un regalo de oro.

soul_bonus_title = Regalo de Piedras de Alma
soul_bonus_text = Reconociendo el orden y la paz de tu pueblo, un Alquimista dejó una piedra de alma como símbolo de gratitud antes de partir.

heal_bonus_title = Regalo del Ángel
heal_bonus_text = La prosperidad de tu pueblo ha traído alegría a sus residentes, moviendo lo divino a enviar un ángel. El ángel ha restaurado completamente la salud de tus compañeros mercenarios.

named_merc_title = Mercenario Renombrado
named_merc_text = Al escuchar sobre tu reputación, el mercenario renombrado {0} ha venido a visitarte. Este mercenario mencionó que se quedará en la taberna por esta semana.\n{1}

monster_invasion_title = Invasión de Monstruos
monster_invasion_text = Aprovechándose de las débiles defensas del dominio, ¡los monstruos han invadido! Si no los derrotas, destruirán uno de los edificios del pueblo.

bandits_invasion_title = Invasión de Bandidos
bandits_invasion_text = Aprovechándose de las débiles defensas del dominio, ¡una banda de bandidos ha invadido! Si no los derrotas, saquearán el oro y las piedras de alma del pueblo.

wraith_invasion_title = Invasión de Espectros
wraith_invasion_text = ¡Espectros, potenciados por energía oscura, han invadido tu dominio! Si no los derrotas, destruirán un edificio en el pueblo. Si no quedan edificios, tu dominio caerá.

potion_bonus_title = Poción de Curación
potion_bonus_text = El dueño de la tienda de pociones, agradecido por tu dedicación a la aldea, ha donado una poción de curación.

curse_title = Maldición
curse_text = ¡Un mago malvado ha llegado al pueblo, colocando una maldición sobre tus mercenarios! Esta maldición durará una semana.

special_event_title = Evento Especial
special_event_text = Se ha detectado un evento especial en el observatorio. Puede ser revisado en la gremio.

gear_bonus_title = Arma Mágica
gear_bonus_text = El comerciante de armas está agradecido por tu dedicación y te ha dado un arma mágica!

xp_bonus_title = Bonificación de XP
xp_bonus_text = La luz sagrada fluye desde el Salón de la Experiencia, otorgando XP a todos tus mercenarios!

xp_penalty_title = Pérdida de XP
xp_penalty_text = El estrés por las amenazas a tu dominio ha causado que tus mercenarios pierdan XP!

invasion_title = Invasión
invasion_summary = ¡Las fuerzas enemigas se han vuelto más fuertes y monstruos han invadido el pueblo!
invasion_text = ¡Las fuerzas enemigas se han vuelto más fuertes y monstruos han invadido el pueblo!

defend_camp_title = Defensa de Tolbok
defend_camp_summary = Debes defenderte contra una horda de Tolboks.
defend_camp_text = Te encuentras con un grupo de guerreros. Ellos explican que se reportó una masiva invasión de Tolboks hace unos días, y aunque construyeron defensas alrededor de su aldea, carecen de suficiente mano de obra. Piden tu ayuda. Si ayudas a defender la aldea, prometen darte una carta de Torretas de Bolt. ¿Qué harás?
accept_defend_camp_summary = Ayuda a los guerreros.
defend_camp_reward_title = Recompensa de Defensa
defend_camp_reward_text = Agradecidos por tu ayuda, los guerreros te ofrecen una recompensa.
choice_bolt_turret_card_summary = Recibe una carta de Torretas de Bolt.

defend_keep3_title = Defiende la Fortaleza
defend_keep3_text = Encuentras un grupo de soldados en las murallas. Ellos explican que los demonios se están reuniendo para atacar la fortaleza, y les falta suficientes arqueros para defender las paredes. Si los ayudas, prometen recompensarte con una carta de Refuerzo de Defensor que puedes invocar cuando lo necesites.
defend_keep3_summary = Ayuda a los soldados a defender la fortaleza de los demonios.
accept_defend_keep3_summary = Ayuda a los soldados.
defend_keep3_reward_title = Recompensa de Defensa
defend_keep3_reward_text = Los soldados te agradecen y ofrecen una recompensa.
choice_reinforcement_defender_summary = Recibe la recompensa.

defend_keep2_title = Defensa de la Fortaleza
defend_keep2_text = Encuentras un grupo de arqueros en las murallas de la fortaleza. Ellos explican que los Sadils se están preparando para invadir y, aunque han establecido defensas, aún carecen de suficiente mano de obra. Si los ayudas, te recompensarán con una carta de refuerzo de arqueros que te permitirá invocarlos cuando sea necesario.
defend_keep2_summary = Ayuda a los arqueros a defender la fortaleza de los demonios.
accept_defend_keep2_summary = Ayuda a los soldados.
defend_keep2_reward_title = Recompensa de Defensa de Invasión  
defend_keep2_reward_text = Los soldados te agradecen y ofrecen una recompensa.  
choice_reinforcement_archer_summary = Recibe una carta de refuerzo de arquero.  

siege_kronasle_camp_title = Toma el Campamento Kronasle  
siege_kronasle_camp_summary = Ayuda a los soldados a tomar el campamento Kronasle.  
siege_kronasle_camp_text = Descubres un campamento de demonios Kronasle. Enfrente de él, los soldados se preparan para un asalto. Ellos explican que los demonios han estado acosando su aldea continuamente y desean eliminarlos, pero les falta experiencia. Al ver tu experiencia, te piden que los lideres en el asalto. Como recompensa, prometen una carta de refuerzo de defensor.  
accept_siege_kronasle_camp_summary = Comanda a los soldados.  
siege_kronasle_camp_reward_title = Recompensa de los Soldados  
siege_kronasle_camp_reward_text = Agradecidos por tu asistencia, los soldados te ofrecen una carta de refuerzo de defensor.  
choice_reinforce_defender_card_summary = Recibe una carta de refuerzo de defensor.  

defend_keep_title = Defensa del Bastión  
defend_keep_text = Encontraste un grupo de soldados en las murallas del castillo. Ellos dijeron que los demonios esperan invadir frente a las murallas y les faltan arqueros para defenderse del enemigo desde arriba. Si los ayudas, dicen que te darán una carta de invocación de cañón como recompensa.  
defend_keep_summary = Ayuda a los soldados a defender las murallas del castillo de los demonios.  
accept_defend_keep_summary = Ayuda a los soldados.  
defend_keep_reward_title = Recompensa de Defensa  
defend_keep_reward_text = Los soldados te agradecen y ofrecen una recompensa.  
choice_cannon_card_summary = Recibe la recompensa.  

siege_thieves_keep_title = Captura el Bastión de los Ladrones  
siege_thieves_keep_text = Encontraste un bastión bien defendido y un grupo de guerreros frente a él. Ellos dijeron que quieren apoderarse del bastión, que es la base de los ladrones, y eliminarlos, pero no saben cómo tomarlo. Te pidieron que ayudaras con el asalto, y si el bastión es capturado, te recompensarán con una carta de refuerzo de guerrero que te permite invocarlos cuando desees. ¿Cuál es tu elección?  
siege_thieves_keep_summary = Los guerreros desean capturar el bastión de los ladrones.  
accept_siege_thieves_keep_summary = Lidera a los guerreros y captura el bastión.  
siege_thieves_keep_reward_title = Recompensa de Captura del Bastión  
siege_thieves_keep_reward_text = Los guerreros te agradecieron por tu ayuda y ofrecieron una recompensa.  
choice_reinforce_warrior_card_summary = Recibe la carta de refuerzo de guerrero.  

siege_taves_keep_title = Toma el Bastión de Taves  
siege_taves_keep_summary = Toma el Bastión de Taves utilizando el Cañón Dragón.  
siege_taves_keep_text = Descubres el bastión de los Taves. Afuera está un caballero y canónicas dragón. Él puede atacar las defensas del bastión con los cañones, pero le preocupa que las tropas de Taves puedan atacar los cañones mientras tanto. Ofrece una carta de cañón dragón que puede ser invocada si lo asistes. ¿Cuál es tu decisión?  
accept_siege_taves_keep_summary = Acepta la solicitud del caballero.  
siege_taves_keep_reward_title = Recompensa de Toma del Bastión  
siege_taves_keep_reward_text = El caballero te agradece por tu ayuda y ofrece una recompensa.  
choice_dragon_cannon_summary = Recibe una carta de cañón dragón.
