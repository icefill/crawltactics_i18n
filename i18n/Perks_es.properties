CurseAndPoisonAmplifier_desc = Aumenta el alcance de ataque de las habilidades de Maldición y Veneno.

AutoMecharonasle = Automechanasle
AutoMecharonasle_desc = Construye automáticamente un Mechanasle al inicio de la batalla.

PotionologyMaster = Maestro de Poción
PotionologyMaster_desc = Aumenta la duración de los efectos de las pociones.

HarshnessOfNature = Dureza de la Naturaleza
HarshnessOfNature_desc = Aumenta el daño de los hechizos ofensivos de la escuela de la Naturaleza.

Lucky7 = Suerte 7
Lucky7_desc = Aumenta la Suerte

WaterProofCoating = Recubrimiento Impermeable
WaterProofCoating_desc = Los enemigos mecánicos no se oxidan al moverse sobre casillas de agua.

StatusEffectPerk = Efecto de Estado
StatusEffectPerk_desc =

KnowledgeIsPower = El Conocimiento es Poder
KnowledgeIsPower_desc = Los ataques físicos cuerpo a cuerpo infligen daño adicional basado en la Inteligencia.

CurseIsPoison = La Maldición es Veneno
CurseIsPoison_desc = Los objetivos afectados por la Maldición también reciben daño adicional de veneno.

FearMonger = Temor
FearMonger_desc = El daño oscuro infligido a los enemigos aumenta en proporción a su nivel de Miedo.

VehicleOwner = Propietario de Vehículo

TrapExpert = Experto en Trampas
TrapExpert_desc = Aumenta el área de daño al activar cañones, frascos y dispositivos similares.

FireSpreader = Difusor de Fuego
FireSpreader_desc = El fuego se extiende a un área más amplia al encender casillas.

LightningSpreader = Difusor de Rayo
LightningSpreader_desc = Aumenta el alcance de propagación al causar daño de rayo sobre agua.

HeadOrTail = Cara o Cruz
HeadOrTail_desc = Cuando el ataque acierta, elige si lanzar una moneda. Si cae de cara, dispara de nuevo. Si cae del lado contrario, todo el daño recibido hasta ahora se cura. La moneda se puede lanzar hasta 4 veces.

AmplifyingDice = Dados Amplificadores
AmplifyingDice_desc = Lanza 2 o menos: daño 0 / Lanza 3 o más: daño (rollx50)%.

DualWielder = Doble Empuñadura
DualWielder_desc = Al usar armas con doble empuñadura, usar una habilidad de arma cuerpo a cuerpo de una mano desencadena un ataque adicional con el arma de la otra mano.

BladeAndGunMastery = Maestría en Espada y Arma de Fuego
BladeAndGunMastery_desc = Al empuñar tanto una pistola como una espada, dispara la pistola después de aplicar un ataque básico cuerpo a cuerpo. Al usar una habilidad de arma cuerpo a cuerpo, realiza un ataque adicional con la pistola de la otra mano.

HeavyDualWield = Doble Empuñadura Pesada
HeavyDualWield_desc = Permite equipar dos armas de dos manos que no son lanzas, una en cada mano.

CurseSpreader = Propagador de Maldiciones
CurseSpreader_desc = Cuando infliges Maldición, se propaga a todos los miembros del grupo del objetivo maldito.

SummonBlessingSpreader = Propagador de Bendiciones de Invocación
SummonBlessingSpreader_desc = Cuando recibes una bendición, también se propaga a tus invocaciones.

ToxicologyMaster = Maestro en Toxicología
ToxicologyMaster_desc = Aumenta la duración del ataque de veneno. El daño por veneno puede matar al objetivo.

FireAndLightningSpreaderAura = Aura de Propagación de Fuego y Relámpago
FireAndLightningSpreaderAura_desc = Aumenta el rango de propagación del fuego iniciado por aliados y el rango de propagación de electricidad sobre el agua.

PlayingCardDeck = Baraja de Cartas
PlayingCardDeck_desc = Al inicio de la mazmorras, roba 4 cartas de una baraja de 17. Las cartas robadas pueden ser usadas con la habilidad de robo de cartas. Cuando se usan 3 cartas, si la suma de sus números es 7 o se incluye un Joker, la suerte aumenta. Después de usar 3 cartas, roba 4 cartas nuevas de la baraja restante.

Cheating = Hacer Trampa
Cheating_desc = Todas las apuestas tienen éxito. Las monedas siempre caen de cara, los dados siempre sacan 6, y una carta aleatoria en la baraja se convierte en un Joker.
