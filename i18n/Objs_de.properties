EDungeonType.Ruin_desc=Die Überreste der Architektur einer verlorenen Zivilisation.\nRuinen, Gras und Teiche.
EDungeonType.Forest_desc=Ein Gebiet, das von Bäumen und Gras dominiert wird.\nTiere und wilde Bestien erscheinen oft.
EDungeonType.Desert_desc=Die Temperatur ist hoch, und es gibt keinen Regen. Viele Feinde sind immun gegen Feuermagie.
EDungeonType.Catacomb_desc=Von Menschenhand geschaffene unterirdische Durchgänge für religiöse Praktiken. Kein Gras oder Wasser aber viele Fallen, Leichname.\nUntote blühen auf.
EDungeonType.Cavern_desc=Eine natürliche Leere im Boden. Das Gelände ist felsig ohne Gras, hat aber manchmal Grundwasser.\nTeuflische Monster erscheinen oft.
EDungeonType.RiverSide_desc=Niederungen mit fließenden Gewässern.\nAmphibienmonster erscheinen oft.
EDungeonType.SnowMt_desc=Eine schneebedeckte Bergregion. Die Temperatur ist niedrig, und es gibt viele Feinde, die gegen Eiszauber resistent sind.

