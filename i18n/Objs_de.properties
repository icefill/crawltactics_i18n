holy_avenger_desc=Der Heilige Rächer ist ein einhändiges Langschwert, das mit göttlichem Licht glänzt. Es gewährt seinem Träger heiligen Schaden und die Fähigkeit, Angst zu vertreiben.
holy_avenger_lore=Der Heilige Rächer, ein heiliges einhändiges Schwert, soll von himmlischen Kräften gesegnet sein. Seine Klinge strahlt mit der Reinheit des Lichtes, und diejenigen, die seinen Griff ergreifen, finden ihren Mut gestärkt. Mit der Kraft, heilige Energie zu wield und Angst zu vertreiben, wird der Heilige Rächer oft von Helden gewählt, die sich gegen die Dunkelheit stellen.
glacial_edge_desc=Die Gletscherkante ist eine furchterregende zweihändige Axt, die einen eisigen Hauch ausstrahlt. Ihre Schläge entfesseln eine Reihe von frostigen Stürmen und frieren die Feinde ein.
glacial_edge_lore=Legenden sprechen von der Gletscherkante, einer mächtigen zweihändigen Axt, die im Herzen eines ewigen Schneesturms geschmiedet wurde. Ihre frostige Berührung verwandelt jeden Schwung in eine Kaskade von Eisstürmen und hinterlässt einen eisigen Pfad der Zerstörung. Man sagt, sie sei die Waffe eines legendären Frostkriegers, der die Kraft des Winters selbst bezwingt.
gungnir_desc=Dieser legendäre Speer soll, wenn er geführt wird, knackende Blitze ausstrahlen, die mit beeindruckender Kraft zuschlagen.
gungnir_lore=Nach uralter Überlieferung wurde Gungnir von den göttlichen Schmieden der Antike geschmiedet, durchdrungen von der Wut von Gewittern und der Macht des Blitzes. Es wird gesagt, dass die Essenz des Himmels durch seine Adern fließt und seinem Träger die Kontrolle über die primären Kräfte der Natur verleiht. Krieger, die Gungnir schwingen, werden geflüstert, dass sie zu Avataren des Donners werden und Blitze herbeirufen, um ihre Feinde im Kampf zu treffen.
phoenix_rod_desc=Der Phönixstab ist ein goldener Stab mit einer falkenförmigen Spitze, die mit einem Rubin geschmückt ist. Er steigert Intelligenz und Feuermagie.
phoenix_rod_lore=Der Phönixstab, ein Stab uralter Mystik, wird für seine goldene Schönheit und das von Falken inspirierte Design verehrt. Er flüstert von vergessenen Geheimnissen und alten Feuern. Während die Benutzer seine Energie kanalisieren, erhöht sich ihre Intelligenz und ihre Beherrschung des Feuers vertieft sich, sodass sie Flammen mit einer Fähigkeit befehlen können, die von den meisten unerreicht bleibt.
