battle_over = Kampf beendet
continue_or_restart_battle_message = Möchtest du Leben verwenden, um fortzufahren, oder den Kampf neu starten?\n\nFortfahren: Verbinde Verbündete wieder und setze den Kampf fort.\nNeustart: Gehe zurück zum Anfang des Kampfes und starte neu.\nAblehnen: Breche das aktuelle Spiel ab und beende das Spiel.
continue_or_restart_battle_quest_message = Möchtest du Leben verwenden, um fortzufahren, oder den Kampf neu starten?\n\nFortfahren: Verbinde Verbündete wieder und setze den Kampf fort.\nNeustart: Gehe zurück zum Anfang des Kampfes und starte neu.\nAblehnen: Breche den aktuellen Kampf ab und kehre ins Dorf zurück.
