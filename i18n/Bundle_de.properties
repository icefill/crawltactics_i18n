tut_phase1=Du kannst das [GREEN]Phasensymbol[] oben links auf dem Bildschirm sehen.

tut_move = Einheit bewegen
tut_move_title =Erkundungsphase: Einheit bewegen
tut_move0=  Im Erkundungsmodus wird die Führungs-Einheit automatisch ausgewählt.\n\n\
  Das Spiel wird [GREEN]vorbei[] sein, wenn [GREEN]die Führungs-Einheit stirbt[] und ihr Körper verschwindet.
tut_move1=Die ausgewählte Figur kann [GREEN]frei bewegen[] durch [GREEN]Linksklick[] auf das Feld, zu dem du gehen möchtest.\
  \n\n  Wenn du den Cursor auf das Feld bewegst, auf das du gehen möchtest, erscheint der Weg zu diesem Feld.
tut_move1_c=Die ausgewählte Figur kann [GREEN]frei bewegen[] durch Bewegen des Cursors auf das Feld, indem du [GREEN]{0}[] verwendest und dann [GREEN]{1}[] drückst.\n\n  Wenn du den Cursor auf das Feld bewegst, auf das du gehen möchtest, erscheint der Weg zu diesem Feld.
tut_move1_c'=Die ausgewählte Figur kann [GREEN]frei bewegen[] durch Bewegen des Cursors auf das Feld, indem du [GREEN]Dpad[] verwendest und dann [GREEN]{0}[] drückst.\n\n  Wenn du den Cursor auf das Feld bewegst, auf das du gehen möchtest, erscheint der Weg zu diesem Feld.

tut_move2=Züge werden in der Erkundungsphase nicht erhöht\
  \n\n  [YELLOW]Versuche, das Feld auszuwählen, auf das der Pfeil zeigt.[]
tut_move3 = Gut gemacht! Jede Einheit hat ihre eigene Sprungrate nach oben und Sprungrate nach unten.\n\n  Normalerweise kann eine Einheit [GREEN]2 Felder nach oben[] und [GREEN]3 Felder nach unten springen[]\n\n
tut_move4 =  Beachte, dass die [GREEN]Stachelfalle[] in der Nähe der Spieler-Einheit dem Spieler nicht geschadet hat.\n\n  Fallen auf Feldern werden [GREEN]aktiviert[], wenn eine [GREEN]Einheit darauf stoppt[].
tut_move5 = Oh nein! Plötzliches Wetter aus dem Himmel... \n  Keine Sorge, die Einheiten des Spielers werden [GREEN]nicht sofort sterben[], selbst wenn ihre [GREEN]HP auf null[] gehen.
tut_move6 = Die Spieler-Einheit wird sich im [RED]Todestür[] Zustand befinden, wenn ihre HP auf null geht. \
  Im Todestür-Zustand:\n\n\
  - [RED]Verletzte[] Einheit hat eine 66% Chance zu [RED]sterben[]\n\n\
  - [GREEN]Heilende[] Einheit wird [GREEN]nicht mehr[] in diesem Zustand sein.
