tut_intro = Einführung
tut_intro_title = Einführung
tut_intro0 =  Willkommen!\n\n  Dies ist eine Erklärung der grundlegenden Elemente von Crawl Tactics.\n\n  Drücke die [GREEN]Fortfahren[]-Taste, um fortzufahren.
tut_intro1 = Drücke die [GREEN]Wiederholen[]-Taste, wenn du es erneut versuchen oder wenn etwas schiefgegangen ist.\n\n Drücke die [GREEN]Überspringen[]-Taste, wenn du den aktuellen Inhalt überspringen möchtest.\n\n Drücke die [GREEN]Weiter[]-Taste, um zum nächsten Abschnitt zu gelangen.
tut_intro2 = Drücke die [GREEN]{0}[] oder das [GREEN]Zahnrad-Symbol[] , um das Menü zu öffnen.\n Von dort aus kannst du [GREEN]Tutorial-Einträge[], [GREEN]Einstellungen[] ändern oder [GREEN]Das Spiel verlassen[].\n Außerhalb des Tutorials führt das Verlassen des Spiels zu einem [GREEN]automatischen Speicher[].
tut_intro1_c = Drücke die [GREEN]{0}[] oder die Abbrechen-Taste ([GREEN]{1}[]), wenn es nichts abzubrechen gibt, um das Menü zu öffnen.\n Von hier aus kannst du die [GREEN]Tutorial-Option[], die [GREEN]Einstellungen[] ändern oder [GREEN]Das Spiel beenden[].\n Wenn du außerhalb des Tutorials beendest, wird das Spiel [GREEN]automatisch gespeichert[].

tut_intro1_c' = Wenn nichts ausgewählt ist, öffnet sich das Menü durch Drücken von [GREEN]{0}[].\n Von hier aus kannst du die [GREEN]Tutorial-Option[], die [GREEN]Einstellungen[] ändern oder [GREEN]Das Spiel beenden[].\n\n Wenn du außerhalb des Tutorials beendest, wird das Spiel [GREEN]automatisch gespeichert[].

tut_intro2_t = Drücke das [GREEN]Zahnrad-Symbol[], um das Menü zu öffnen.\n Von dort aus kannst du [GREEN]Tutorial-Einträge[], [GREEN]Einstellungen[] ändern oder [GREEN]Das Spiel verlassen[].\n Außerhalb des Tutorials führt das Verlassen des Spiels zu einem [GREEN]automatischen Speicher[].

tut_input = Allgemeine Eingabe
tut_input_title = Allgemeine Eingabe
tut_input0= Drücke die [GREEN]{0}[]-Taste, um die Shortcuts ein- und auszuschalten.\n\n Viele Tasten und UI-Elemente zeigen Tooltips an, wenn du über sie fährst.
tut_input0_c=Viele Tasten und UI-Elemente haben Tooltips, die sichtbar sind, wenn du den Cursor bewegst.
