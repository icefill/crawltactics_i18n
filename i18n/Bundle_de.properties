ARMOR_MASTERY_long_desc = *Rüstungsstrafe: Schwere Rüstungen mit Verteidigungswerten haben normalerweise Strafen wie reduzierte Intelligenz oder Beweglichkeit. Höhere Rüstungsbeherrschung verringert diese Strafen. Einige Rüstungen sind mit einer „Keine Strafe“-Eigenschaft versehen, die es erlaubt, sie auch bei niedriger Beherrschung zu tragen, aber der Verteidigungsmultiplikator aus der Rüstungsbeherrschung gilt dennoch, was zu einer geringeren Effektivverteidigung führt.\n\nMenge: Verteidigungsmultiplikator (%): Multipliziert durch den Verteidigungswert der Rüstung.\nReduzierung: Strafmultiplikator (%): Multipliziert durch den Strafwert der Rüstung.
