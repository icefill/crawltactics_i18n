FEAR_desc = Gibt an, wie leicht eine Einheit erschreckt wird.\nWenn die HP einer Einheit weniger als [GREEN]Angst(%) der maximalen HP[] sind, wird die Einheit [GREEN]panisch[].
Hire_desc = Anzahl der aktuellen Gruppenmitglieder.
MaxHire_desc = Anzahl der maximal rekrutierbaren Einheiten.

Mana_desc = Kristallisierte magische Energie.\n Erhöht sich für jede Runde und verschwindet nach dem Kampf.\n Wird verwendet, um Magie zu wirken.
Mana_arg_desc = Kristallisierte magische Energie.\n Erhöht sich um [GREEN]{0}[] für jede Runde und verschwindet nach dem Kampf.\n Wird verwendet, um Magie zu wirken.
MaxMana_desc = Menge des maximalen Manna, das geladen werden kann.
ManaCharge_desc = Menge des pro Runde geladenen Manna.
Rage_desc = Wird verwendet, um Wutfähigkeiten zu wirken.\n Wird aufgeladen, wenn Verbündete von einem Angriff getroffen werden.
MaxRage_desc = Wird verwendet, um Wutfähigkeiten zu wirken.\n Wird aufgeladen, wenn Verbündete von einem Angriff getroffen werden.
Gold_desc = Wird verwendet, um etwas zu handeln.
Soul_desc = Kristallisierte Seele.\nWird verwendet, um Fähigkeiten, Gebäude zu verbessern.\nDurch das Sammeln dieser Ressource können neue Klassen oder Startgruppen freigeschaltet werden.
Food_desc = Dies wird automatisch verbraucht.\n Mangel an Nahrung verringert HP.\n Wird beim Abschluss eines Levels aufgefüllt.
Alignment_desc = Die Moral der Gruppe reicht von -4 bis 4\n +12,5% Heilung und -6,25% dunkler Magieschaden pro Punkt.
Portal_desc = Gibt die maximale Anzahl von Einheiten an, die durch das Portal transportiert werden können, um an jedem Kampf teilzunehmen.

Resource = Ressource
Resource_desc = Dies sind Ressourcen, die von der Gruppe geteilt werden.
Gold_long_desc = Gold ist eine grundlegende Ressource, die zum Kaufen, Verkaufen von Gegenständen oder für den Handel während Events verwendet wird. Es ist weniger selten als Seelensteine.
Soul_long_desc = Seelensteine werden verwendet, um Fähigkeiten zu verbessern oder Gebäude in Städten zu errichten. Da die Menge, die Sie erhalten können, begrenzt ist, verwenden Sie sie weise. Die insgesamt während des Spiels gesammelten Seelensteine werden auch verwendet, um neue Einheiten freizuschalten.
MaxHire_long_desc = Jedes Mal, wenn Sie eine Einheit einstellen, erhöht sich Ihre Einstellung um eins, und Sie können nicht mehr Einheiten einstellen als Ihr maximales Einstelllimit. Beschwörungen, Vertraute und Gästeeinheiten sind von diesem Limit ausgeschlossen.\n*Hinweis: Die Anzahl der Dungeonfeinde passt sich an die Größe Ihrer aktuellen Gruppe an.
MaxMana_long_desc = Mana wird von Magie-Einheiten benötigt, um Zauber zu wirken. Es beginnt mit 0 zu Beginn des Kampfes und erhöht sich jede Runde entsprechend der Gruppe. Einige Einheiten können AP verwenden, um Mana aufzuladen. Jede Gruppe hat eine maximale Mana-Kapazität, die durch Upgradepunkte des Anführers oder besondere Events erhöht werden kann.
MaxRage_long_desc = Wut ist eine Ressource, die für Wutfähigkeiten verwendet wird und in der Regel steigt, wenn Verbündete Schaden nehmen. Ein Balken entspricht 100 und die Benutzung einer Verzweiflungspflege verbraucht einen Balken. Die maximale Wut kann durch Upgradepunkte des Anführers oder spezielle Events erhöht werden.
Portal_long_desc = Eine Ressource, die exklusiv für den Quest-Modus ist. Sie kann am Portal mit Seelensteinen erhöht werden.
Security_long_desc = Eine Ressource, die exklusiv für den Quest-Modus ist. Sie sinkt, wenn Sie eine Runde ohne Auswahl einer Quest verstreichen lassen, und kann durch Jagdquests erhöht werden.
Alignment_long_desc = Der Alignment erhöht die Heilkraft der heiligen Magie und verringert den dunklen Schaden. Höhere Ausrichtung steigert auch die Effektivität heiliger Heilzauber. Einige spezielle Events ändern sich basierend auf der Ausrichtung. Die Ausrichtung kann in der Regel über Engel-Statuen in Dungeons oder Stadtgebäuden geändert werden. Das Angreifen neutraler Gruppen verringert die Ausrichtung, und bestimmte Ereignis-Resultate beeinflussen sie ebenfalls.

BaseStat = Basisstatistik
BaseStat_desc = Gibt die grundlegenden Attribute des Charakters an.
BaseStat_long_desc = Wenn Sie aufsteigen, können Sie wählen, diese Statistiken zu erhöhen, anstatt eine Fähigkeit zu erlernen. Die zur Verfügung stehenden Statistiken, die erhöht werden können, hängen von der Klasse ab. Dazu gehören Stärke, Geschicklichkeit, Intelligenz, Beweglichkeit und Charisma.

Mastery = Meisterschaft
Mastery_desc = Statistiken, die darstellen, wie effektiv ein Charakter Waffen oder Elementarmagie einsetzen kann.
Mastery_long_desc = Waffen- und Magie-Meisterschaften erhöhen den Schaden und die Genauigkeit, wenn mit dieser Waffe angegriffen oder Elementarschaden zugefügt wird. Die Schildbeherrschung erhöht den Blockwert, während die Rüstungsbeherrschung den Verteidigungswert der Rüstung erhöht und Strafen beim Tragen von Rüstungen verringert. Im Allgemeinen ist es erforderlich, mindestens Level 1 zu haben, um richtigen Schaden zu verursachen, und alles darunter kann zu Strafen führen.

Knowledge = Wissen
Knowledge_desc = Erforderlich beim Erlernen von Fähigkeiten durch Bücher.
Knowledge_long_desc = *Hinweis: Dies ist anders als die Meisterschaft. Meisterschaft wird beim Waffeneinsatz angewendet, während Wissen erforderlich ist, um neue Fähigkeiten zu erlernen.\n\nFähigkeiten gehören zu einer von zehn Wissensdisziplinen und haben Wissensstufen von 1 bis 3. Wenn Ihre Wissensstufe die Anforderungen der Fähigkeit erfüllt oder übersteigt, können Sie die Fähigkeit über Bücher erlernen oder verbessern. Jede Wissensstufe ist in der Regel an eine bestimmte Klasse gebunden.\n*Allerdings erfordern Fähigkeiten, die von einer Klasse mit Fertigkeitspunkten erlernbar sind, kein Wissen.

DefensiveStat = Defensive Statistik
DefensiveStat_desc = Statistiken, die die Fähigkeit eines Charakters darstellen, eingehenden Schaden zu reduzieren oder zu vermeiden.
DefensiveStat_long_desc = Defensive Statistiken umfassen physische wie Block, Ausweichen und Verteidigung sowie magische wie Feuer-, Kälte- und Blitzwiderstand. Block ist eine Statistik, die durch Schilde erhalten wird und die Wahrscheinlichkeit (%) angibt, physische Angriffe abzuwehren. Ausweichen repräsentiert die Wahrscheinlichkeit (%) Angriffe zu vermeiden. Verteidigung und Elementarwiderstände reduzieren den eingehenden Schaden aus jedem entsprechenden Element (%). Feindliche defensive Statistiken haben Obergrenzen, die von der Schwierigkeit abhängen, und die defensiven Statistiken der Verbündeten sind in der Regel auf 75 begrenzt.

