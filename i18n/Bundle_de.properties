tut_inven0=Um das [GREEN]Inventar[] zu öffnen,\n\n 1.Drücke die Inventartaste unten links oder\n\n 2.Tippe auf das [GREEN]Porträt der ausgewählten Einheit[] auf dem Bildschirm.
