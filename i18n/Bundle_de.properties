tut_inven0_c = Du kannst das [GREEN]Inventar[] öffnen, indem du das [GREEN]Fähigkeitenrad[] öffnest.
tut_inven2 =  Gut!\n\nIm Ausrüstungsfenster kannst du Gegenstände verwenden oder Ausrüstung und Fähigkeiten anlegen. Diese Aktionen verbrauchen AP.

tut_inven21 = Magische Rollen:
tut_inven22 = Rollen sind Einweggegenstände, die nach der Benutzung verschwinden.\n\n[YELLOW]Versuche, eine Heilrolle zu verwenden.[]
