restart_battle_quest_message = Möchtest du den Kampf neu starten?\n\nNeustart: Gehe zurück zum Anfang des Kampfes und starte neu.\nAbbrechen: Breche den aktuellen Kampf ab und kehre ins Dorf zurück.
continue_message = Möchtest du Leben verwenden, um fortzufahren?\n\nFortfahren: Verbinde Verbündete wieder und setze den Kampf fort.\nAbbrechen: Breche das aktuelle Spiel ab und beende das Spiel.
continue_quest_message = Möchtest du Leben verwenden, um fortzufahren?\n\nFortfahren: Verbinde Verbündete wieder und setze den Kampf fort.\nAbbrechen: Breche den aktuellen Kampf ab und kehre ins Dorf zurück.

