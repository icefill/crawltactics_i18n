tut_inven3= Du kannst Ausrüstung [GREEN]anlegen[] oder ablegen, indem du entweder\n\n 1. [GREEN]Sie auswählst[] und die entsprechende Taste drückst oder\n\n 2. Sie auswählst, während du [GREEN]{0}[] gedrückt hältst.
