tut_stats = Statistiken
tut_stats_title = Party-Info :Stats Fenster
tut_stats0 = Wähle eine Einheit aus, um das Ausrüstungsfenster zu öffnen.
tut_stats00=Es gibt einen anderen Weg, das Inventar zu öffnen. Drücke die [GREEN]{0}[]-Taste oder tippe die ausgewählte Einheit [GREEN]einmal mehr[] an, um das Kreis-Menü zu öffnen. Das Kreis-Menü zeigt verschiedene Optionen an, abhängig davon, ob du erkundest, dich auf den Kampf vorbereitest oder im Kampf bist. Eine dieser Optionen ermöglicht es dir, das Inventar zu öffnen.
tut_stats1 = Im [GREEN]Statistik-Fenster[] kannst du verschiedene Statistiken über den ausgewählten Charakter sehen.\n\nDie Statistiken im Statistiken-Fenster sind kategorisiert, und das Überfahren jeder Statistik zeigt eine Beschreibung an.
tut_stats2 = 1. [GREEN]Attribute[]: Grundattributsstatistiken wie Stärke, Geschicklichkeit und Agilität.
tut_stats3 = 2. [GREEN]Hauptwaffe[]: Statistiken, die sich auf die Hauptwaffe beziehen.
tut_stats4 = 5. [GREEN]Wissen[]: Statistiken, die erforderlich sind, um neue Fähigkeiten durch Bücher zu lernen.
tut_stats5 = 6. [GREEN]Beherrschung[]: Statistiken, die sich darauf beziehen, wie effektiv du Waffentypen oder Magietypen verwenden kannst.
tut_stats6 = 7. [GREEN]Fähigkeiten[]: Gelernte Fähigkeiten.
