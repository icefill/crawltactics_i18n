standard_mode = Dungeon-Modus
standard_mode_desc = Erkunde Dungeons, die in Räume unterteilt sind, besiege Bosse und kehre ins Dorf zurück, um dich neu zu gruppieren und auf die nächste Herausforderung vorzubereiten.
quest_mode = Quest-Modus
quest_mode_desc = Erweitere dein Dorf und stelle verschiedene Söldner ein, um die Gegend zu erkunden, während du dich gegen feindliche Invasionen in regelmäßigen Abständen verteidigst. Finde und breche die Siegel, um die Dämonen zu besiegen.
quest_mode_introduction = Einführung
# Features und Einführung
quest_mode_intro1=Du bist der Nachkomme eines kleinen Dorfherrn, der die Geschichte eines versiegelten Dämons gehört hat, der die Welt bedroht. Bei deiner Ankunft im Dorf musst du das Dorf entwickeln, Söldner anheuern, um das Siegel zu finden und zu öffnen, und den entfesselten Dämon besiegen.\n\nMerkmale des Questmodus:\n\n1. Im Gegensatz zum Dungeon-Modus gibt es keinen Anführer, und selbst wenn alle Gefährten im Kampf sterben, endet das Spiel nicht.\n2. Dungeons in diesem Modus kommen in zwei Typen:\n   - Erkundungsdungeons\n   - Jagddungeons\n\n   Das Abschließen von Erkundungsdungeons erhöht die weltweite Schwierigkeit (Spielsicherheit), und du musst den Boss in der Region besiegen, um schließlich das Siegel freizuschalten.\n\n   Jagddungeons können genutzt werden, um deine Söldner zu fördern.
# Gameplay und Ziel
quest_mode_intro2=Gameplay:\n\n1. Dorfbau: Du kannst Gebäude im Dorf errichten.\n2. Anheuern von Gefährten: Stelle Gefährten in der Taverne ein.\n3. Missionsauswahl: Wähle Missionen aus der Gilde.\n4. Bewege dich zu Kampforten: Bewege dich zu Kampforten durch das Portal.\n\nSpielziel:\n- Das Ziel des Spiels ist es, alle Erkundungsdungeons abzuschließen, die Siegel zu öffnen und den entfesselten Dämon zu besiegen.\n\nViel Erfolg bei deinem Abenteuer!

fix_head: Kopf-Aussehen sperren
fix_head_desc: Hält den Kopf und die Kopfzubehörteile bei der Beförderung unverändert.

fix_upper = Oberkörper sperren
fix_upper_desc: Hält den Oberkörper bei der Beförderung unverändert.

fix_lower = Unterkörper sperren
fix_lower_desc: Hält den Unterkörper bei der Beförderung unverändert.

