# Ranger bad ending
bad_ending_text_RangerParty0 = Als der Ranger das Amulett erlangte, blitzte seine Vergangenheit in seinem Kopf auf. Er hatte einst als Kronprinz des Imperiums gestanden, aber nach dem Tod des Kaisers, als er versuchte, die chaotische politische Lage zu stabilisieren, wurde er schwer verwundet durch den Verrat eines engen Vertrauten und verlor seine Erinnerungen. Er kehrte ins Imperium zurück und wurde Kaiser, vereinte schließlich die Welt, aber es war eine Geschichte, die in Blut geschrieben wurde. Trotz der höchsten Macht blieb in seinem Herzen nur die ständige Angst, erneut verraten zu werden und alles zu verlieren.

# Added (251226)

ATTACK_STAT = Angriffsstatistik
ATTACK_STAT_desc = Statistiken im Zusammenhang mit Angriffen.
ATTACK_STAT_long_desc = \
* Waffenangriffe und Skill-Angriffe\n\
\ - [Waffenangriff]: Ein Angriff, dessen Schaden und Genauigkeit mit den Basiswerten der Waffe skalieren.\n\
\ - [Skill-Angriff]: Ein Angriff, der keine Waffe verwendet und für jede Fähigkeit eigene Basisschaden und Genauigkeit hat.\n\n\
* Magische Angriffe und Physische Angriffe\n\
\ - [Magischer Angriff]: Ein Angriff, der magischen Schaden verursacht und nicht von Höhenunterschieden oder der Ausrichtung betroffen ist.\n\
\ - [Physischer Angriff]: Ein Angriff, der physischen Schaden verursacht und von Höhenunterschieden und der Ausrichtung betroffen ist. Er wird in [Nahkampf Physische Angriffe] und [Fernkampf Physische Angriffe] unterteilt.

DAMAGE = Schaden
DAMAGE_desc = Der numerische Wert des von jedem Angriff zugefügten Schadens.
DAMAGE_formula = \
[GREEN]*[] Physischer Angriff -> [Basis Schaden] x (100 - [Verteidigung]) / 100\n\
[GREEN]*[] Magischer Angriff -> [Basis Schaden] x [Magie Meisterschaft] / 100 x (1 + [INT] x 0.04) x (1 - [Magie Schutz] / 100) x [Umgebungs Mod %] / 100 x [Ausrichtung Mod]

BASE_DAMAGE = Basis Schaden
BASE_DAMAGE_formula = \
[GREEN]*[] Nahkampf Waffenangriff -> [Waffen Schaden] x [Skill Schaden %] / 100 x [Wpn Meisterschaft Mod] / 100 x (1 + [STR] x 0.04)\n\
[GREEN]*[] Fernkampf Waffenangriff -> [Waffen Schaden] x [Skill Schaden %] / 100 x [Wpn Meisterschaft Mod] / 100 x (1 + [DEX] x 0.04)\n\
[GREEN]*[] Nahkampf Physischer Skill Angriff -> [Skill Schaden] x (1 + [STR] x 0.04)\n\
[GREEN]*[] Fernkampf Physischer Skill Angriff -> [Skill Schaden] x (1 + [DEX] x 0.04)\n\
[GREEN]*[] Magischer Skill Angriff -> [Skill Schaden]

WEAPON_DAMAGE = Waffenschaden
WEAPON_DAMAGE_desc = Der Basiswert des Schadens, der für jede Waffe angegeben ist.
SKILL_DAMAGE = Skillschaden
SKILL_DAMAGE_desc = Der Schaden, der in der Beschreibung jeder Fähigkeit aufgeführt ist.
SKILL_DAMAGE_PERCENT = Skillschaden %
SKILL_DAMAGE_PERCENT_desc = Der Schadenswertprozentsatz, der in der Beschreibung jeder Fähigkeit aufgeführt ist.

WEAPON_MASTERY = Waffenmeisterschaft
WEAPON_MASTERY_short = Wpn Meisterschaft
WEAPON_MASTERY_desc = Repräsentiert die Fertigkeit mit jeder Waffe und beeinflusst den Waffenschaden und die Genauigkeit der Angriffe.
MAGIC_MASTERY = Magie Meisterschaft
MAGIC_MASTERY_short = Magie Meisterschaft
MAGIC_MASTERY_desc = Ein Meisterschaftswert, der auf dem Attribut jedes magischen Angriffs basiert und den Magieschaden und die Genauigkeit der magischen Angriffe beeinflusst.
MAGIC_PROTECTION = Magie Schutz
MAGIC_PROTECTION_short = Magie Prot
MAGIC_PROTECTION_desc = Ein Verteidigungswert, der je nach Typ des magischen Schadens variiert. Reduziert magischen Schaden um den angegebenen Prozentsatz.
ENV_DAM_MODIFIER = Umgebungs Mod
ENV_DAM_MODIFIER_short = Umgebungs Mod
ENV_DAM_MODIFIER_formula =\
Feuermagie: Auf Wasser -> 0.5, Heißes Wetter -> 1.25, Kaltes Wetter -> 0.75\n\
Eismagie: Heißes Wetter -> 0.75, Kaltes Wetter -> 1.25
ALIGN_MODIFIER = Ausrichtungs Mod
ALIGN_MODIFIER_formula = Dunkle Magie -> 1 - 0.0625 x [Ausrichtung]\nHeilige Magie -> 1 + 0.0625 x [Ausrichtung]
HEIGHT_DAM_MODIFIER = Höhen Mod
HEIGHT_DAM_formula = 1 - 0.25 x [Höhenunterschied]

HIT_RATE = Genauigkeit
HIT_RATE_desc = Die prozentuale Chance, dass jeder Angriff trifft.

PHY_ACC = Physische Genauigkeit
PHY_ACC_formula = [Basis Genauigkeit] x [Umgebungs Mod] x [Höhen Mod] x [Ausrichtungs Mod]

BASE_ACC = Basis Genauigkeit
BASE_ACC_formula =\
[GREEN]*[] Physischer Waffenangriff -> [Wpn Genauigkeit] x [Skill Genauigkeit %] x (1 + [DEX] x 0.04) x [Wpn Meisterschaft Mod] / 100\n\
[GREEN]*[] Physischer Skill Angriff -> [Skill Genauigkeit] x (1 + [DEX] x 0.04)\n\
[GREEN]*[] Magischer Waffenangriff -> [Wpn Genauigkeit] x [Skill Genauigkeit %] x [Wpn Meisterschaft Mod] / 100\n\
[GREEN]*[] Magischer Skill Angriff -> [Skill Genauigkeit]

WPN_ACC = Wpn Genauigkeit
WPN_ACC_desc = Der Genauigkeitswert, der der Waffe innewohnt.

SKILL_ACC = Skill Genauigkeit
SKILL_ACC_desc = Die Basisgenauigkeit eines Angriffs der Fähigkeit.

SKILL_ACC_PERCENT = Skill Genauigkeit %
SKILL_ACC_PERCENT_desc = Ein Genauigkeitsmultiplikator, der auf die Waffengenauigkeit durch den Angriff einer Fähigkeit angewendet wird.

ENV_ACC_MODIFIER = Umgebungs Mod
ENV_ACC_MODIFIER_formula = \
Bei Regen, Fernkampf physische Angriffe -> 0.75\n\
Sonst -> 1

HEIGHT_ACC_MODIFIER = Höhen Mod
HEIGHT_ACC_formula = 1 - [Höhenunterschied] x 0.1

FACING_ACC_MODIFIER = Ausrichtungs Mod
FACING_ACC_MODIFIER_formula = \
[GREEN]*[] Nahkampf Angriff -> Seite -> 1.15\n\
[GREEN]*[] Heck -> 1.30\n\
[GREEN]*[] Fernkampf Angriff -> Heck -> 1.25

CRIT = Kritische Treffer-Rate
CRIT_short = Krit
CRIT_desc = Die Chancen, dass ein kritischer Treffer eintritt, wenn ein Angriff trifft.
CRIT_long_desc = Kritische Treffer gelten nur für physische Angriffe. Wenn ein kritischer Treffer eintritt, verursacht er normalerweise 150% des endgültigen Schadens, aber dieser Wert kann je nach Fähigkeiten oder Merkmalen der Einheit erhöht werden.
CRIT_formula =\
[GREEN]*[] Waffenangriff -> [Wpn Krit] x [Skill Krit %] / 100 x [Höhen Mod] x [Ausrichtungs Mod]\n\
[GREEN]*[] Skill Angriff -> [Skill Krit] x [Höhen Mod] x [Ausrichtungs Mod]

WPN_CRIT = Wpn Krit
WPN_CRIT_desc = Der kritische Wert, der der Waffe innewohnt.
SKILL_CRIT = Skill Krit
SKILL_CRIT_desc = Die kritische Chance der Fähigkeit.
SKILL_CRIT_PERCENT = Skill Krit %
SKILL_CRIT_PERCENT_desc = Ein kritischer Treffer-Ratenmultiplikator, der durch Waffenskills bereitgestellt wird.

FACING_CRIT_MODIFIER = Ausrichtungs Mod
FACING_CRIT_MODIFIER_formula = \
[GREEN]*[] Nahkampf Angriff -> Seite -> 1.15\n\
[GREEN]*[] Heck -> 1.30\n\
[GREEN]*[] Fernkampf Angriff -> Heck -> 1.25

HEIGHT_CRIT_MODIFIER = Höhen Mod
HEIGHT_CRIT_MODIFIER_formula = 1 - [Höhenunterschied] x 0.1
