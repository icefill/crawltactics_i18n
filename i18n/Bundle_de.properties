# Difficulty Window

EnvHazard = Umweltgefahr
EnvHazard_simple_desc = Umweltgefahr vorhanden
EnvHazard_desc = Zu Beginn des Kampfes besteht die Chance, dass eine Umweltgefahr auftritt. Umweltgefahren umfassen Blitzschläge, Hagel oder Waldbrände. Die Felder, die getroffen werden, sind im Voraus markiert, und der Angriff erfolgt auf diesen Feldern in der nächsten Runde. Sie verschwinden, wenn der Kampf endet.

HasCorruption = Korruption
HasCorruption_simple_desc = Korruption vorhanden
HasCorruption_desc = Nach mehreren Runden zu Beginn des Spiels beginnen Gespenster, den Spieler zu verfolgen.

WorldTurnLimit = Weltuntergangszähler
WorldTurnLimit_simple_desc = Weltuntergangszähler: {0} Runden.
WorldTurnLimit_desc = Wenn diese Option aktiviert ist, werden Gespenster nach einer bestimmten Anzahl von Runden in dein Gebiet eindringen. Das Versagen, sie zu besiegen, führt zu Verlusten, aber erfolgreiche Erkundung kann die Invasion hinauszögern.

InvasionStartDifficulty = Schwierigkeit des Invasionsstarts
InvasionStartDifficulty_simple_desc = Wenn die Welt-Schwierigkeit {0} oder höher erreicht, beginnen die Feinde, das Dorf anzugreifen.
InvasionStartDifficulty_desc = Der Schwierigkeitsgrad, ab dem Feinde beginnen, das Dorf anzugreifen.

InvasionStartWeek = Invasionsstartwoche
InvasionStartWeek_simple_desc = Feinde beginnen, das Dorf nach Woche {0} anzugreifen.
InvasionStartWeek_desc = Die Woche, in der Feinde beginnen, das Dorf anzugreifen.

InvasionTerm = Intervall der Feindeinvasion
InvasionTerm_simple_desc = Feinde greifen alle {0} Wochen das Dorf an.
InvasionTerm_desc = Das Intervall zwischen den Feindeinvasionen des Dorfes.

HasDeathDoor = Todespfad
HasDeathDoor_simple_desc = Verbündete Einheiten erhalten den Zustand "Todespfad".
HasDeathDoor_desc = Wenn die HP einer Einheit 0 erreichen, stirbt sie nicht, sondern geht in den Zustand "Todespfad". In diesem Zustand hat das Erleiden von Schaden eine 40%ige Chance, die Einheit zu töten.

DecreaseSecurityOnlyWhenPassingTurn = Sicherheitsverlust nur bei Rundenpass
DecreaseSecurityOnlyWhenPassingTurn_simple_desc = Sicherheit sinkt nur beim Auslassen von Runden.
DecreaseSecurityOnlyWhenPassingTurn_desc = Die Sicherheit sinkt nur, wenn Runden ohne Abschluss von Quests ausgelassen werden. Ohne diese Option sinkt die Sicherheit wöchentlich.

Continue = Fortfahren
Continue_simple_desc = Leben: {0}
Continue_desc = Belebt gefallene Verbündete wieder und setzt den Kampf fort, wenn die verbündete Gruppe ausgelöscht wird.

Retry = Wiederholen
