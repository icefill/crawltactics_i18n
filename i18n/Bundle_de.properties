tut_companion = Begleiter
tut_companion_title = Erkundungsphase: Begleiter
tut_companion0 = Du kannst Begleiter anheuern, um mitzuarbeiten.
tut_companion1 = Um eine Einheit zu heuern, sollte der [GREEN]Heuer-Punkt[] höher sein als die Anzahl der Begleiter in deiner Gruppe.\n  Der Heuer-Punkt wird durch das Symbol dargestellt, auf das der Pfeil zeigt.
tut_companion2 = Du kannst einen [GREEN]Begleiter auswählen[], indem du einfach darauf klickst\n  oder den nächsten Verbündeten auswählst, indem du [GREEN]TAB[] drückst.
tut_companion2_c = Du kannst einen [GREEN]Begleiter auswählen[], indem du einfach das Feld unter ihm auswählst.\n
tut_companion3 = [YELLOW]Versuche, den markierten Begleiter auszuwählen.[]
tut_companion4 = Gut!

tut_map = Karte
tut_map_title = Erkundungsphase: Karte
tut_map0 = Die Dungeons von Crawl Tactics bestehen aus Räumen.\n  Du kannst die [GREEN]Minikarte[] des Dungeons in der [GREEN]oberen rechten Ecke[] sehen.\n  Drücke [GREEN]'M'[] oder die Taste, um das Minikartenfenster zu öffnen.
tut_map0_c = Die Dungeons von Crawl Tactics bestehen aus Räumen.\n  Du kannst die [GREEN]Minikarte[] des Dungeons in der [GREEN]oberen rechten Ecke[] sehen.\n  Drücken von [GREEN]{0}[] öffnet das Minikartenfenster.
tut_map0_c' = Dungeons in Crawl Tactics bestehen aus Räumen.\n  Die [GREEN]Minikarte[] befindet sich in der [GREEN]oberen rechten Ecke[] des Bildschirms.\n  Während du im [GREEN]Erkundungsmodus[] bist, kannst du das Kartenfenster mit dem [GREEN]Kreis-Menü[] öffnen.
tut_map1 =[YELLOW]Versuche, das Minikartenfenster zu öffnen![]
tut_map2 = Gut gemacht!!
tut_map3 = Du bist bei [YELLOW]1[] und
tut_map4 = Das [GREEN]Ziel[] ist es, bei [YELLOW]2[] anzukommen.
tut_map5 = Die Zahlen neben den Symbolen repräsentieren die verbleibenden Züge bis zur [GREEN]Korruption[]\n\n  Korruption wird dich verfolgen, und du musst gegen [GREEN]Unheilige Armeen[] kämpfen, wenn die Korruption dich einholt.
tut_map6 = Du kannst zu [GREEN]anderen 'Räumen'[] gelangen, indem du Türfelder auswählst.
tut_map7 = [YELLOW]Versuche, die Figur zu dem Türfeld zu bewegen, auf das der Pfeil zeigt.[]
tut_map8 = Gut!

tut_prepare = Bereite den Kampf vor
tut_prepare_title = Kampfphase: Kampf vorbereiten
tut_prepare0 = Wenn Feinde im Raum sind, wird die Spielphase von Erkundung zu [GREEN]Kampfphase[] geändert.
tut_prepare1 = Vor dem tatsächlichen Kampf kannst du deine Verbündeten organisieren und positionieren. Dies ist die [GREEN]Vorbereitungs-Kampfphase[].
tut_prepare2 = Du kannst Verbündete auf blau schattierten Feldern platzieren.
tut_prepare3= [YELLOW]Wähle den Anführer und versuche, seine Position zu ändern.[]
tut_prepare4 = Gut gemacht!
tut_prepare5 = Du kannst eine [GREEN]Karte[] einmal verwenden, bevor der Kampf beginnt.\n  Jede Karte hat verschiedene Effekte wie Positionswechsel, Heilung, Klimawandel usw..
tut_prepare6 = [YELLOW]Versuche, das Kartenfenster zu öffnen, indem du die[] [GREEN]{0}[][YELLOW] drückst.[]
tut_prepare6' = Während der [GREEN]Vorbereitungs-Kampfphase[] kannst du das Kartenfenster mit dem [GREEN]Tortenmenü[] öffnen.\n\n[YELLOW]Öffne das Tortenmenü, um auf das Kartenfenster zuzugreifen.[]
tut_prepare7 = Gute Arbeit!
tut_prepare8 = Einige Karten benötigen Eingaben zur Anwendung, während andere sofort nach der Benutzung angewendet werden.
tut_prepare9 = [YELLOW]Versuche, die 'Heilen'-Karte zu verwenden[]
tut_prepare10 = Gut gemacht! Jede Karte kann nur einmal pro Dungeon verwendet werden.
tut_prepare11 = Du kannst [GREEN]Ausrüstung[] oder [GREEN]Fähigkeiten[] in diesem Zustand ohne AP verbrauchen.
tut_prepare12 = Wenn du jetzt [GREEN]{0}[] drückst, beginnt der Kampf.
tut_prepare13 = [YELLOW]Lass uns den Kampf beginnen![]

tut_battle = Kampf
tut_battle_title= Kampfphase
tut_battle0 = In der Kampfphase,\n wechseln sich Spieler- und Gegnerzüge ab.
tut_battle1 = Jede Einheit hat [GREEN]AP-Punkte[].\n Jede Aktion verbraucht einen AP.
tut_battle2 = [GREEN]Grüne Balken[] (Verbündete) und [RED]Rote Balken[] (Feinde) zeigen [GREEN]HP[]. [YELLOW]Gelbe[] Punkte daneben zeigen [YELLOW]AP[] an.
tut_battle2_c = [GREEN]Wenn[] du mit dem Cursor über eine Figur fährst, wird die Information angezeigt.

tut_battle3 = [YELLOW]Versuche, die Einheit auszuwählen, auf die der Pfeil zeigt[]
tut_battle4 = [YELLOW]Gelbe[] Punkte neben der HP-Leiste sind [YELLOW]AP[] Punkte\n\n  [SKY]Blaue[] schattierte Flächen sind der [SKY]bewegliche Bereich[] und\n\n  [RED]Rote[] umrandete Felder repräsentieren [RED]angreifbare[] Objekte.
tut_battle5 = [YELLOW]Versuche, die Figur zu bewegen, indem du das blaue schattierte Feld auswählst, auf das der Marker zeigt[]
tut_battle6 = Du kannst sehen, dass [GREEN]AP[] um eins verringert wurde.
tut_battle7 = [GREEN]Umzingeln[] und [GREEN]Hinterhalt[] bieten Angriffsboni. Auch,\n\n  [GREEN]Höhenvorteil[] gibt Angriffsboni, während [GREEN]Tiefenlage[] Strafen gibt.
tut_battle8 = [YELLOW]Versuche jetzt, den Feind anzugreifen, auf den der Pfeil zeigt![]
tut_battle9 = Gut gemacht! Beachte, dass der Feind, [GREEN]den du mit einem physischen Angriff hinterrücks angegriffen hast[], [GREEN]kritischen Schaden[] erhält!

tut_trap = Fallen
tut_trap_title = Kampfphase : Fernangriffe
tut_trap0 = Du kannst eine Falle [GREEN]aktivieren[], indem du sie angreifst.
tut_trap1 = [YELLOW]Wähle die Bogenschützen-Einheit, auf die der Pfeil zeigt.[]
tut_trap2_0 = [YELLOW]Bewege den Cursor auf das Feld, das der Pfeil anzeigt.[]
tut_trap2 = Wenn du über ein Feld, zu dem du ziehen kannst, [GREEN]schwebst[], zeigt es die [GREEN]Trajektorie[] für angreifbare Feinde, Fallen und ob Feinde die Einheit angreifen können.\n\n[YELLOW]Bewege den Bogenschützen auf das Feld, auf das der Pfeil zeigt.[]
tut_trap3 = [YELLOW]Jetzt greife das Gefäß an, auf das der Pfeil zeigt.[]
##Um Pfeilangriffe zu nutzen, benötigst du [GREEN]Pfeile[]. Pfeile werden [GREEN]jede Runde[] aufgefüllt.\n\n
tut_trap4 = Gut gemacht!\n\n  Beachte, dass [GREEN]Blitz[] nahe [GREEN]Wasser[]-Feldern [GREEN]Flächenschaden[] verursacht\n\n  Wenn es regnet, verhält sich jedes Feld wie ein Wasserfeld.

##Du kannst sehen, dass der [GREEN]Pfeil[] unten links auf dem Bildschirm verwendet wird.\n\n

tut_magic = Magie
tut_magic_title = Kampfphase : Magie
tut_magic0 = Einige Fähigkeiten benötigen [GREEN]Mana[] zur Verwendung.
tut_magic1 = Dies sind die Mana-Punkte der Spielergruppe.\n  Es wird [GREEN]von allen Gruppenmitgliederngeteilt und erhöht sich mit jeder Runde.
tut_magic2 = [YELLOW]Wähle die Abenteurer-Einheit, auf die der Pfeil zeigt.[]
tut_magic3 = [YELLOW]Bewege die Einheit auf das Feld, auf das der Pfeil zeigt.[]
tut_magic4 = Die Zahlen auf dem Fähigkeitsbutton geben Informationen über die Fähigkeit an.\n\n  [SKY]Blaue[] Zahl   :  Mana-Verbrauch\n  [RED]Rote[] Zahl    :  Abklingzeit\n  [GREEN]Grüne[] Zahl :  Menge pro Dungeon-Ebene.
tut_magic5 = [YELLOW]Greife die Kanone mit Burn-Magie an.[]
tut_magic5_c = Du kannst das Tortenmenü öffnen, wenn du [GREEN]{0}[] drückst und dann die gewünschte Fähigkeit auswählst\n\n[YELLOW]Greife die Kanone mit Burn-Magie an.[]
tut_magic6 = Gut gemacht!\n  Beachte, dass das Gras mit magischer Flamme in Brand gesteckt wird.\n  Das [GREEN]Feuer breitet sich[] in jede Runde auf nahe [GREEN]Gras[]-Felder aus.

tut_delayed = Verzögerte Magie
tut_delayed_title = Kampfphase : Verzögerte Magie
tut_delayed0 = Einige Zaubersprüche werden am Ende des Zuges geworfen, sind aber sehr mächtig.
tut_delayed1 = Diese Fähigkeit ist eine verzögerte Magie. Du kannst das [YELLOW]D[]-Symbol auf dem Fähigkeitsbutton sehen.
tut_delayed' = Verzweiflung Fähigkeit
tut_delayed_title' = Kampfphase : Verzweiflung Fähigkeit
tut_delayed0' = Einige Fähigkeiten benötigen [YELLOW]Wutanzeige[] zur Verwendung, sind aber sehr mächtig. Die Wutanzeige füllt sich, wenn [YELLOW]Verbündete Einheiten beschädigt oder getötet werden[].
tut_delayed1' = Diese Fähigkeit ist eine [YELLOW]Verzweiflung Fähigkeit[]. Du kannst das [YELLOW]D[]-Symbol auf dem Fähigkeitsbutton sehen.
tut_delayed2' = [YELLOW]Versuche, die Verzweiflung Fähigkeit auf das Feld zu werfen, auf das der Marker zeigt.[]
tut_delayed2 = [YELLOW]Versuche, die Verzweiflung Fähigkeit auf das Feld zu werfen, auf das der Marker zeigt.[]
tut_delayed3 = Wir haben alle AP unserer Verbündeten verbraucht.\n  Zeit, diese Runde zu beenden.
tut_delayed4 = [YELLOW]Drücke die Runde beenden Taste.[]
tut_delayed5 = Jetzt ist der Gegner am Zug...

tut_charged = Geladene Magie
tut_charged_title = Kampfphase : Geladene Magie
tut_charged0_0 = Wähle jetzt den Anführer, auf den der Pfeil zeigt.
tut_charged0 = Einige Fähigkeiten haben [GREEN]begrenzte Anwendungen[] pro [GREEN]Ebene[]. Dies gilt meist für [GREEN]Heilung[]. Die [GREEN]grüne Zahl[] [GREEN]oben rechts[] am Button zeigt die Aufladungen.
tut_charged1 = [YELLOW]Verwende jetzt die {0} Fähigkeit auf den Novizen-Bogenschützen.[]
tut_charged2 = Gut gemacht. Du kannst jetzt sehen, dass die [GREEN]Anzahl der Aufladungen[] für die {0} Fähigkeit um [GREEN]eins gesenkt[] wurde.

tut_fight = Kampf
tut_fight_title = Kampfphase
tut_fight0 = Oft erscheinen [GREEN]Seelensplitter[] auf dem Schlachtfeld. Sie verschwinden nach einigen Runden, werden aber bei vorzeitigem Kampfende automatisch aufgenommen. Seelen verbessern Zauber, errichten oder erweitern Gebäude.
tut_fight1 = [GREEN]Besiege die Feinde![]
tut_fight2 = Gut!

tut_after = Stufenaufstieg
tut_after_title = Nach dem Kampf : Stufenaufstieg
tut_after0 = Gut! Nach dem Kampf erhalten Verbündete XP und können aufsteigen.
tut_after0_1 = Wenn eine Einheit [GREEN]aufsteigt[], erhält sie einen [GREEN]Fähigkeitspunkt[]. Wenn Fähigkeitspunkte verfügbar sind, erscheint ein [RED]^[]-Symbol auf dem Einheitenpanel.\n\n[YELLOW]Klicke auf die angegebene Fähigkeitspunkt-Taste.[]
tut_after0_1_c = Wenn eine Einheit [GREEN]aufsteigt[], erhält sie einen [GREEN]Fähigkeitspunkt[]. Wenn Fähigkeitspunkte verfügbar sind, erscheint ein [RED]^[]-Symbol auf dem Einheitenpanel.\n\n[YELLOW]Wähle jetzt den Lehrling und öffne das Ausrüstungsfenster.[]
tut_after0_1_2_c = [YELLOW]Wähle jetzt den neuen Fähigkeitsbutton, auf den der Pfeil zeigt.[]
tut_after0_2 = Ein Stufenaufstieg gewährt einen [GREEN]Fähigkeitspunkt[], der verwendet werden kann, um neue Fähigkeiten zu erlernen. Es gibt zwei Arten von Stufen: die Basis-Einheiten-[GREEN]stufe[] und die [GREEN]Klassenstufe[]. Beide Arten erhöhen sich beim Aufstieg, aber [GREEN]Klassenwechsel setzt[] die Klassenstufe auf 1 zurück.
tut_after0_3 = 1. [GREEN]Stats[] erhöhen die Grundattribute der Einheit und können unabhängig von Stufen erhöht werden.\n\n2. [GREEN]Basisfähigkeiten[] können gelernt werden, sobald die Anforderungen an die Einheitsstufe erfüllt sind.
tut_after0_4 = 3. Die Fähigkeiten unterhalb der Basisfähigkeiten können gelernt werden, wenn die Anforderungen an die [GREEN]Klassenstufe[] erfüllt sind.\n\nEin Klick auf die Fähigkeits-Symbole zeigt die Fähigkeitsinformationen im rechten Fenster an.
tut_after0_5 = Fähigkeiten, die du nicht lernen kannst, werden dunkel angezeigt.\n\n[YELLOW]Wähle die gewünschte Fähigkeit aus und klicke auf den Lern-Button, der durch den Pfeil angezeigt wird.[]

tut_after1 = [YELLOW]Bewege dich jetzt in den nächsten Raum.[]
tut_after2 = "Gut!"

tut_portal = Portal
tut_portal_title = Das Ende des Dungeons
tut_portal0 = Wir haben den Zielraum erreicht.
tut_portal1 = Es gibt einen Schatz im Zielraum.
tut_portal2 = [YELLOW]Nehme den Schatz auf![]
tut_portal3 = Normalerweise würdest du durch diese Tür in den nächsten Dungeon ziehen, aber für die Bequemlichkeit des Tutorials wirst du in den Portalraum gehen.\n\n[YELLOW]Gehe jetzt in den Portalraum![]
tut_portal4 = Am Ende des Dungeons gibt es ein Portal, das ins Dorf führt.\n\n[YELLOW]Gehe zum Portal![]
tut_portal5 = Gut gemacht. Das ist dein Dorf!
tut_portal6 = Am Ende des Dungeons gibt es Statuen, bei denen du deine Verbündeten [GREEN]heilen[] und [GREEN]Klassen wechseln[] kannst. Um in den nächsten Dungeon zu gelangen, musst du die Heilstatue benutzen.
tut_portal7 = Wenn du nicht heilen möchtest, kannst du stattdessen einen Seelenstein von der Statue erhalten.\n\n[YELLOW]Wähle die Statue aus und aktiviere sie, auf die der Pfeil zeigt.[]

tut_portal8 = Um die Klassen zu wechseln, benutze den [GREEN]Klassenwechselaltar[] im Dungeon oder baue einen im Dorf.\n\n[YELLOW]Wähle den Lehrling aus, auf den der Pfeil zeigt, und aktiviere den Klassenwechselaltar.[]
tut_portal9 = Um Klassen zu wechseln, muss die [GREEN]Klassenstufe[] über einem bestimmten Schwellenwert liegen.\n\n[RED]Hinweis[]: Um Klassen zu wechseln, darfst du keine verbleibenden Fähigkeitspunkte haben.\n\n[YELLOW]Wähle den Elementar-Magier-Button aus und klicke dann auf den Klassenwechsel-Button.[]

