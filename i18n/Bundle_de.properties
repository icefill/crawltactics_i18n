tut_portal8' = Um Klassen zu wechseln, musst du den [GREEN]Klassenwechsel-Altar[] im Dungeon verwenden oder einen Klassenwechsel-Altar im Dorf bauen.\n\n[YELLOW]Aktiviere den Klassenwechsel-Altar, den du gebaut hast.[]
tut_portal9' = Um Klassen zu wechseln, muss dein [GREEN]Klassenlevel[] über einem bestimmten Schwellenwert liegen.\n\n[YELLOW]Wähle die Elementarmagier-Taste, und drücke dann den Klassenwechsel-Button.[]

tut_town7' = [YELLOW]Baue jetzt den Klassenwechsel-Altar, der durch den Marker angezeigt wird.[]

