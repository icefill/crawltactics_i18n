tut_input3_c=[GREEN]{0}[] und [GREEN]{1}[] sind für [GREEN]Bildschirm drehen[] und\n\n[GREEN]{2}[] und [GREEN]{3}[] sind für [GREEN]Zoom[] rein/raus.\n\n[YELLOW]Versuche, den Bildschirm zu drehen![]
tut_input4 = Gut.
tut_input5 = Wenn es schwierig ist, Einheiten aufgrund der Höhendifferenzen auf dem Schlachtfeld zu sehen, kannst du die [GREEN]{0}[]-Taste gedrückt halten, um ein flaches Schlachtfeld zu sehen.\n\n[YELLOW]Halte die {0}-Taste 2 Sekunden lang gedrückt.[]


