tut_intro2_t = Drücke die [GREEN]Gear[]-Taste, um das Menü zu öffnen.\n Hier kannst du [GREEN]Tutorial[]-Optionen auswählen, [GREEN]Einstellungen[] ändern und das Spiel [GREEN]beenden[].\n Wenn du das Spiel außerhalb des Tutorials beendest, wird es [GREEN]automatisch gespeichert[].
tut_input3_t= Verwende eine [GREEN]Zwei-Finger-Rotationsgeste[], um den Bildschirm zu drehen\n Verwende eine [GREEN]Pinchgeste[], um hinein- und herauszuzoomen.\n [GREEN]Ziehe den Bildschirm[], um die Ansicht zu bewegen.\n\n [YELLOW]Versuche den Bildschirm zu drehen![]
tut_input5_t = Wenn die Terrainhöhe die Einheiten schwer zu sehen macht, [GREEN]wische mit zwei Fingern nach unten[], um eine [GREEN]abgeflachte[] Karte anzuzeigen, und wische [GREEN]nach oben[], um zurückzukehren.\n\n[YELLOW]Versuche, die Karte abzuflachen und wiederherzustellen![]
tut_move1_t = Tippe einmal auf ein Ziel [GREEN], um den [GREEN]Pfad[] anzuzeigen.\n Tippe ein zweites Mal auf dasselbe Feld [GREEN], um [GREEN]zu bewegen[].\n\n Tippe auf ein anderes Feld oder drücke die [GREEN]Abbrechen-Taste[], um den Pfad abzubrechen.
tut_move1'_t = Gut gemacht.\n\n [YELLOW]Tippe nochmal auf dasselbe Feld, um die Einheit zu bewegen.[]

tut_inven18_t = Drücke die [GREEN]x[]-Taste oben rechts im Fenster, um es zu schließen.
tut_map0_t = Dungeons in Crawl Tactics bestehen aus mehreren 'Räumen'.\n  Die [GREEN]Minikarte[] befindet sich in der [GREEN]unteren rechten Ecke[].\n  Drücke die [GREEN]Karten-Taste[] auf dem Bildschirm, um das Kartenfenster zu öffnen.
tut_prepare6_t = Drücke die [YELLOW]Karten-Taste[], die durch das Marker angezeigt wird, um das Kartenfenster zu öffnen.[]
tut_battle8_t = Tippe einmal auf ein Ziel [GREEN], um [GREEN]Informationen[] anzuzeigen, und tippe [GREEN]erneut[] an, um einen [GREEN]Angriff[] auszuführen.\n\n  [YELLOW]Versuche jetzt, den Feind anzugreifen, der durch den Pfeil angezeigt wird![]
tut_battle8_1_t = Gut gemacht.\n\n  [YELLOW]Tippe ein weiteres Mal auf dasselbe Feld.[]
tut_magic5_t = Öffne das [GREEN]Kreis-menü[], um den gewünschten Zauber zu verwenden.\n\n[YELLOW]Wähle den Brandzauber und versuche, die Kanone anzugreifen.[]
tut_trap2_0_t = [YELLOW]Tippe auf das Feld, das durch den Pfeil angezeigt wird.[]
tut_trap2_t = Wenn du ein bewegliches Feld [GREEN]antippst[], werden angreifbare Feinde, Fallen und [GREEN]Trajektorien[] angezeigt, wenn Feinde dieses Ziel angreifen können.\n\n [YELLOW]Bewege den Bogenschützen auf das durch den Pfeil angezeigte Feld.[]
tut_after0_1_t = Wenn das [GREEN]Level steigt[], erhält die Einheit [GREEN]Fähigkeitspunkte[].\n\n[YELLOW]Wähle jetzt den durch den Pfeil angezeigten Magier aus und öffne das Ausrüstungsfenster.[]

tut_use0_t = Wenn du einen Gegenstand aufhebst, kann er aus den [GREEN]Schnellslots[] im [GREEN]Kreismenü[] verwendet werden. Drücke die [GREEN]Kreis-Taste[], die durch das Marker angezeigt wird, oder tippe erneut auf die ausgewählte Einheit, um das [GREEN]Kreismenü[] zu öffnen.\n\n  [YELLOW]Öffne das Kreismenü.[]
tut_use0_1_t = Drücke eine Taste im Kreismenü und halte deinen Finger [GREEN]fest[], während du zwischen den Tasten wechselst, um [GREEN]Informationen[] anzuzeigen. [GREEN]Lasse deinen Finger auf der gewünschten Taste los, um sie [GREEN]auszuwählen[].\n\n  [YELLOW]Berühre die Schnellslot-Taste, die durch das Marker angezeigt wird, und wähle einen Trank aus.[]
tut_use1_t = Tippe einmal auf das gewünschte Feld [GREEN], um [GREEN]Informationen[] anzuzeigen, und tippe [GREEN]erneut[], um es [GREEN]zu verwenden[].\n\n [YELLOW]Tippe auf eine Einheit und versuche, einen Gegenstand zu verwenden.[]

tip_Inspection_text3_t = Wenn deine Sicht behindert und unbequem ist, verwende eine [GREEN]zwei-Finger[] [GREEN]Rotationsgeste[], um den Bildschirm zu drehen, oder [GREEN]wische nach unten[], um das Terrain [GREEN]abzuflachen[], und wische nach oben, um es wiederherzustellen.
tip_Battle_text2_t = Während Verbündete oder Feinde agieren, ermöglicht das Drücken der [GREEN]Schnell-Vorwärtstaste[], dass Aktionen [GREEN]beschleunigt[] ablaufen, und wenn nach einem Schritt kein Schaden oder andere Effekte erhalten wurden, ist [GREEN]Rückgängig[] verfügbar.
tip_SpecialEnemy_text1_t = Ein Tippen auf diese Einheiten zeigt [GREEN]Informationen[] über ihre Eigenschaften.
tip_SpecialEnemy_text2_t = Wenn es mehrere Eigenschaften gibt, wird das Drücken auf die [GREEN]->[] Taste unter dem Tooltip zur [GREEN]nächsten Eigenschaft[] weitergeleitet.

