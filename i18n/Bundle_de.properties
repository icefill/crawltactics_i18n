HIT_RATE_long_desc =\
Ob ein Angriff trifft, wird durch die Genauigkeit bestimmt, und das Ergebnis variiert je nach Art des Angriffs.\n\
Physische Angriffe können nach erfolgreicher Trefferüberprüfung immer noch [Blockiert] werden.\n\
Wenn ein physischer Angriff nicht trifft, wird er basierend auf der [Ausweich]-Chance ausgewichen.\n\
Wenn er nicht ausgewichen wird, werden Nahkampfangriffe [Gestreift], und Fernangriffe werden [Verfehlt].\n\
Wenn ein magischer Angriff trifft, verursacht er sofort Schaden.\n\
Wenn ein magischer Angriff verfehlt, widersteht das Ziel.\n\n\
[GREEN][Streifen][]: Verursacht 1/2 des ursprünglichen Schadens\n\
[GREEN][Verfehlen][]: Verursacht keinen Schaden\n\
[GREEN][Widerstand][]: Verursacht 1/3 des ursprünglichen Schadens

HIT_RATE_formula =\
[GREEN]*[] Magischer Angriff -> [Basisgenauigkeit]\n\
[GREEN]*[] Physischer Angriff -> [Physische Genauigkeit] x (1 - [Ausweich] / 100) x (1 - [Block] / 100)

