EnemyPlayerBoundDiff = Feind-Spieler Leveldifferenzlimit
EnemyPlayerBoundDiff_simple_desc = Differenzwert, der beim Festlegen des Mindestlevels des Feindes angewendet wird
EnemyPlayerBoundDiff_desc = Wenn die Option zur Untergrenze des Feindniveaus aktiviert ist, begrenzt sie die maximale Leveldifferenz zwischen Feinden und dem Durchschnitt der Gruppe. Je größer der Wert, desto höher das Feindlevel.\n\
z. B.) Wenn dieser Wert 2 ist, beträgt das Mindestlevel des Feindes Durchschnitt der Gruppe +2

