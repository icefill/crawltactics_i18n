class_change = Klassenwechsel
class_change_desc = Wenn das Klassenlevel der aktuellen Einheit einen bestimmten Schwellenwert erreicht, kann sie in eine höhere Klasse aufsteigen. Nach dem Klassenwechsel werden die Stats und Fähigkeiten der vorherigen Klasse beibehalten, aber [PINK]Wissen und Beherrschung werden nicht beibehalten[]. Außerdem, wenn eine [GREEN]Klassenfähigkeit[] während des Klassenwechsels auf [GREEN]Level 4[] oder höher ist, wird sie in eine [GREEN]passive Fähigkeit[] umgewandelt.

