# In Game Tips

tip_BasicWeather_title = Wetter/Temperatur
tip_BasicWeather_text0 = Die Temperatur und das Wetter variieren je nach Ökosystem des jeweiligen Dungeons.\n Temperature ist in [GREEN]heiß/normal/kalt[] kategorisiert und bleibt für jeden Dungeon konstant, während die Regenwahrscheinlichkeit bestimmt wird und sich ändert, wenn du von Raum zu Raum wechselst.
tip_BasicWeather_text1_c = Du kannst das aktuelle Klima und die Temperatur durch das [GREEN]Symbol[] überprüfen, das durch den Marker in der [GREEN]oberen rechten[] Ecke angezeigt wird.
tip_BasicWeather_text1 = Du kannst das aktuelle Klima und die Temperatur durch das [GREEN]Symbol[] überprüfen, das durch den Marker in der [GREEN]oberen rechten[] Ecke angezeigt wird. Bewege die Maus über das Symbol, um mehr Informationen zu sehen.

tip_Rain_title = Wetter: Regen
tip_Rain_text0 = Es sei denn, es handelt sich um ein ständig nasses Ökosystem, tritt Regen mit einer bestimmten Wahrscheinlichkeit [GREEN]beim Betreten eines neuen Raums[] auf und hört auf, wenn du den Raum verlässt.
tip_Rain_text1 = Wenn es regnet, verringert sich die [GREEN]Genauigkeit von Pfeilen/Geschossen[]. Außerdem werden die [GREEN]Feuer[] auf dem Schlachtfeld [GREEN]erlöschen[] und die [GREEN]Giftwolken verschwinden[].
tip_Rain_text2 = Zusätzlich bilden sich Pfützen auf dem Schlachtfeld, die den [GREEN]Gefrorene Füße[] Status (bewegungsunfähig) verursachen, wenn sie von [GREEN]Eismagie[] getroffen werden und [GREEN]extra Schaden[] und [GREEN]Spritzschaden[] einstecken, wenn sie von [GREEN]Blitzmagie[] getroffen werden.

tip_Snow_title = Wetter: Schnee
tip_Snow_text0 = Wie Regen tritt Schnee mit einer bestimmten Wahrscheinlichkeit auf, wenn man einen neuen Raum betritt, und stoppt beim Verlassen des Raumes, es sei denn, es handelt sich um ein ständig schneebedecktes Ökosystem.
tip_Snow_text1 = Wenn es schneit, verringert sich die [GREEN]Genauigkeit der Pfeile[]. Außerdem werden die [GREEN]Feuer[] auf dem Schlachtfeld [GREEN]erlöschen[] und die [GREEN]Giftwolken verschwinden[].
tip_Snow_text2 = Wenn das Wetter heiß wird, verwandelt sich Schnee in Regen.

tip_Hot_title = Temperatur: Hitze
tip_Hot_text0 = Die Temperatur bleibt im gesamten Dungeon konstant, entsprechend dem Ökosystem.
tip_Hot_text1 = Bei [GREEN]heißen[] Temperaturen verursacht die [GREEN]Feuermagie[] [GREEN]mehr[] Schaden, und die [GREEN]Eismagie[] verursacht [GREEN]weniger[] Schaden.
tip_Hot_text2 = Zusätzlich [GREEN]verschwinden[] alle [GREEN]Pfützen[], die sich bilden, bis zur nächsten Runde.

tip_Cold_title = Temperatur: Kälte
tip_Cold_text0 = Die Temperatur bleibt im gesamten Dungeon konstant, entsprechend dem Ökosystem.
tip_Cold_text1 = Bei [GREEN]kaltem[] Wetter verursacht die [GREEN]Eismagie[] [GREEN]mehr[] Schaden, und die [GREEN]Feuermagie[] verursacht [GREEN]weniger[] Schaden.
tip_Cold_text2 = Zudem gibt es bei einem Treffer durch [GREEN]Eismagie[] eine 100%ige Chance, vom [GREEN]Gefroren[] Status betroffen zu sein.

new_trap = Neue Falle

tip_trap_title = Fallenobjekte
tip_trap_text0 = Fallenobjekte sind Items, die zufällig auf dem Schlachtfeld platziert werden und Schäden verursachen oder Aktionen auslösen, wie z.B. Explosionen oder das Abfeuern von Projektile, wenn sie aktiviert werden. Nach der Auslösung werden sie zerstört und können wie andere Objekte gedrückt oder geworfen werden.
tip_trap_text1 = Wenn sie beschädigt werden, werden sie zwangsläufig zerstört, jedoch feuern Fallen wie Kanonen oder Bolztürme bis zu dreimal Projektile ab, bevor sie verschwinden.

tip_device_title = Bodenfallen
tip_device_text0 = Bodenfallen, wie Stachel- oder Grasfallen, werden auf dem Boden platziert und werden [GREEN]aktiviert[], wenn sich eine Einheit darüber [GREEN]bewegt und [GREEN]stoppt[]. Sobald sie [GREEN]ausgelöst[] wurden, werden sie [GREEN]zerstört[].
tip_device_text1 = Du kannst [GREEN]nahegelegene Feinde[] auf sie [GREEN]reiben[], um Schaden zuzufügen.\n Es gibt auch Geräte wie Manaquellen und Wutquellen, die Nutzen für Einheiten bieten, wenn sie darauf stehen.

tip_corpse_title = Leichen
tip_corpse_text0 = Der Marker zeigt derzeit auf eine Leiche. Wenn eine Einheit stirbt, bleibt an ihrer Stelle eine Leiche zurück. Wenn der Leiche [GREEN]dunkler Schaden[] zugefügt wird, verursacht dies dunklen [GREEN]Spritzschaden[] auf die angrenzenden [GREEN]4 Felder[].
tip_corpse_text1 = Sei vorsichtig mit [GREEN]undead[] Einheiten, da sie sich nach einer bestimmten Anzahl von Runden [GREEN]wiederbeleben[] können, wenn ihre Leiche übrig bleibt. Du kannst eine Leiche [GREEN]entfernen[], indem du einen [GREEN]Heiltrank[] oder [GREEN]Heilmagie[] oder [GREEN]Feuermagie[] auf dem Feld anwendest, auf dem sich die Leiche befindet.
tip_corpse_text2 = Dasselbe gilt für alliierte Einheiten; ihre Leichen bleiben zurück, wenn sie sterben. Du kannst einen toten Alliierten mit einem [GREEN]Wiederbelebungstrank[] wiederbeleben, und einige Zauber können dies ebenfalls tun.
tip_corpse_text3 = Wenn der [GREEN]Anführer[] eines Verbündeten stirbt und dessen [GREEN]Leiche nicht wiederbelebt werden kann[], führt dies zu [GREEN]Spielende[].

tip_SPECIAL_EVENT_title = Raumtyp: Quest
tip_SPECIAL_EVENT_text0 = Dieser Raum enthält eine Quest. Im Gegensatz zu regulären Ereignissen verfügen Quests über [GREEN]besondere Einheiten[] oder [GREEN]Gegenstände[], und Du kannst Ergebnisse durch [GREEN]Entscheidungen[] erzielen.

tip_CREEP_title = Raumtyp: Creeps
tip_CREEP_text0 = Du bist im Raum der Creeps angekommen. Creeps sind Monster ohne Intelligenz, die [GREEN]immer kämpfen[], sobald sie die Gruppe des Spielers sehen.

tip_HOSTILE_EVENT_title = Raumtyp: Feindliche Gruppe
tip_HOSTILE_EVENT_text0 = Du bist im Raum der [GREEN]feindlichen Gruppe[] angekommen. Sie tauschen [GREEN]Waren zu höheren Preisen[] oder [GREEN]fordern Tribute[] um Kämpfen auszuweichen. Du [GREEN]kannst nicht hindurch[] gehen, ohne eine Entscheidung zu treffen.

tip_NEUTRAL_EVENT_title = Raumtyp: Neutrale Gruppe
tip_NEUTRAL_EVENT_text0 = Du bist im Raum der [GREEN]neutralen Gruppe[] angekommen. Du kannst [GREEN]Waren handeln[] mit ihnen. Du kannst [GREEN]zuerst angreifen, um den Kampf zu initiieren[], aber Dein []Alignmentscore[] wird [GREEN]abnehmen[].

tip_HIRE_EVENT_title = Raumtyp: Söldner anheuern
tip_HIRE_EVENT_text0 = Diese Einheit ist ein Söldner. Im Dungeon kannst Du [GREEN]Söldner[] gegen eine Gebühr [GREEN]anheuern[]. [GREEN]Dungeon-Söldner[] haben einzigartige [GREEN]Vorteile[] und [GREEN]Nachteile[] im Vergleich zu denen, die im Dorf angeheuert werden.\nUm Söldner anzuheuern, musst du über verbleibende [GREEN]Anheuerpunkte[] verfügen, die durch den Marker angezeigt werden.
tip_HIRE_EVENT_text1 = Wenn Du nicht über die [GREEN]erforderlichen Anheuerpunkte[] verfügst, kannst du [GREEN]bestehende Söldner[] mit dem durch den Marker angegebenen Button [GREEN]entlassen[]. Söldner, die [GREEN]für den ersten Dungeon angeheuert[] wurden, können jedoch nicht [GREEN]entlassen[] werden.

tip_BOSS_title = Raumtyp: Boss
tip_BOSS_text0 = Dieser Raum hat den [GREEN]Boss[] des Dungeons. Typischerweise bestehen Dungeons aus 2-3 Etagen, wobei der letzte Raum der Bossraum ist. Bosse sind [GREEN]viel stärker als reguläre Feinde[], also sei vorsichtig.\
Durch den Sieg über den Boss kannst Du ins Dorf zurückkehren.

tip_END_room_title = Endraum
tip_END_room_text0 = Dieser Raum ist verfügbar, wenn es nicht die letzte Ebene eines Dungeons ist. Hier kannst Du [GREEN]heilen[] oder [GREEN]Klassen wechseln[]. Wenn Du nicht heilen möchtest, kannst Du [GREEN]Seelen[] erhalten.

tip_LevelUp_title = Aufstieg
tip_LevelUp_text0 = Die durch den Marker angezeigte Einheit hat einen Aufstieg erlebt.
tip_LevelUp_text1 =  Wenn ein [GREEN]Level ansteigt[], erhält die Einheit [GREEN]Fähigkeitspunkte[]. Wenn Fähigkeitspunkte verfügbar sind, erscheint ein [RED]^[] Symbol im Einheitspanel.\n\nDrücke den Fähigkeitsbonus-Button, der durch den Marker angezeigt wird, um eine Fähigkeit zu wählen, die du erlernen möchtest.
tip_LevelUp_text1_c = Wenn ein [GREEN]Level ansteigt[], erhält die Einheit [GREEN]Fähigkeitspunkte[]. Wenn Fähigkeitspunkte verfügbar sind, erscheint ein [RED]^[] Symbol im Einheitspanel.\n\nÖffne das Ausrüstungsfenster, indem du erneut auf den ausgewählten Charakter drückst und drücke den neuen Fähigkeitsbutton, um eine Fähigkeit zu wählen, die du erlernen möchtest.
tip_LevelUp_text1_t = Wenn ein [GREEN]Level ansteigt[], erhält die Einheit [GREEN]Fähigkeitspunkte[].\n\nÖffne das Ausrüstungsfenster, indem du erneut auf den ausgewählten Charakter drückst und drücke den neuen Fähigkeitsbutton, um eine Fähigkeit zu wählen, die du erlernen möchtest.
tip_LevelUp_text2 = Ein Levelaufstieg gewährt einen [GREEN]Fähigkeitspunkt[], der verwendet werden kann, um neue Fähigkeiten zu erlernen. Es gibt zwei Arten von Levels: das Grundeinheiten-[GREEN]Level[] und das [GREEN]Klassenniveau[]. Beide Arten steigen beim Levelaufstieg, aber [GREEN]Klasse wechseln setzt[] das Klassenniveau auf 1 zurück.
tip_LevelUp_text3 = 1. [GREEN]Stats[] erhöhen die Grundattribute der Einheit und können unabhängig von Levels gesteigert werden.\n\n2. [GREEN]Basisfähigkeiten[] können erlernt werden, sobald die Levelanforderungen der Einheit erfüllt sind.
tip_LevelUp_text4 = 3. Die Fähigkeiten unterhalb der Basisfähigkeiten können erlernt werden, wenn die Anforderungen des [GREEN]Klassenniveaus[] erfüllt sind.\n\nEin Auswählen der Fähigkeitsikonen zeigt die Fähigkeitsinformationen im rechten Fenster an.

tip_Panicked_title = Status Effekt: Panik
tip_Panicked_text0 = Die durch den Marker angezeigten Einheiten sind in einem Zustand der Panik. Wenn sie in einem Panikzustand sind, [GREEN]verlieren sie die Kontrolle[] und [GREEN]bewegen sich unberechenbar[], versuchen zu [GREEN]fliehen[] von Feinden.
tip_Panicked_text1 = Einheiten haben einen [GREEN]Angst[] Wert. Dieser Wert wird durch ein [GREEN]rotes (oder grünes) Zeichen[] auf der HP-Leiste angezeigt. Fällt die [GREEN]HP unter dieses Zeichen[], treten die Einheiten in einen Panikzustand ein. Genauer gesagt, wird die Bedingung\n[GREEN](aktuelle/max HP) < (Angst/100)[]\n erfüllt.
tip_Panicked_text2 = Verbündete haben typischerweise einen Angstwert von 0, aber Einheiten wie [GREEN]Kronasle[] haben [GREEN]hohe Angstwerte[] und geraten leicht in Panik. [GREEN]Untote[] Einheiten haben negative Angstwerte und sind [GREEN]weniger anfällig für Panik[].
tip_Panicked_text3 = Einheiten, die von [GREEN]Dunkelattribut-Angriffen[] getroffen werden, haben ihren [GREEN]Angstwert erhöht[].

tip_DeathsDoor_title = Status Effekt: Todes Tür
tip_DeathsDoor_text0 = Die durch den Marker angezeigten Einheiten stehen an der [GREEN]Todes Tür[]. In diesem Zustand erscheint ein [GREEN]Schädelzeichen[] neben der HP-Leiste.
tip_DeathsDoor_text1 = Die Todes Tür tritt typischerweise bei Verbündeten auf, deren [GREEN]HP bei 0[] liegt. Einheiten in diesem Zustand [GREEN]sterben nicht sofort[], aber wenn sie [GREEN]weiteren Schaden[] erleiden, gibt es eine [GREEN]66% Chance[], dass sie sterben.
tip_DeathsDoor_text2 = Der Todes Tür Zustand kann durch [GREEN]Heilung[] [GREEN]entfernt[] werden. Einige Feinde haben Fähigkeiten oder Eigenschaften, die es ihnen ermöglichen, den Zustand der Todes Tür zu ignorieren und Verbündete sofort zu töten.

tip_init_title = Im Spiel Tipp
tip_init_text0 = Willkommen in der Welt von Crawl Tactics. Die Nachricht, die du siehst, ist ein im Spiel angezeigter Tipp, der erscheint, wenn ein neues Element im Spiel eingeführt wird. Wenn das [GREEN]Tippfenster geöffnet ist[], funktionieren einige [GREEN]Buttons nicht[]. Wenn du [GREEN]keine Tipps mehr[] sehen möchtest, bitte [GREEN]deaktiviere das Kontrollkästchen[] unten.
tip_init_text1 = Um [GREEN]das Spiel zu beenden[] oder [GREEN]aufzugeben[], drücke die [GREEN]Zahnrad[]-Taste ({0}), die durch den Marker angezeigt wird, um das [GREEN]Menü[] zu öffnen. Das Spiel wird automatisch gespeichert, auch wenn du zu diesem Zeitpunkt das Spiel verlässt.
tip_init_text1_t = Um [GREEN]das Spiel zu beenden[] oder [GREEN]aufzugeben[], drücke die [GREEN]Zahnrad[]-Taste, die durch den Marker angezeigt wird, um das [GREEN]Menü[] zu öffnen. Das Spiel wird automatisch gespeichert, auch wenn du zu diesem Zeitpunkt das Spiel verlässt.

tip_Inspection_title = Zustand: Erkundung
tip_Inspection_text0 = Das Spiel besteht aus den Zuständen [GREEN]Erkundung, Kampfvorbereitung, Kampf und Dorf[]. Derzeit befindet es sich im Zustand [GREEN]Erkundung[]. Du kannst dies am Symbol oben links ablesen, das durch den Marker angezeigt wird.
tip_Inspection_text1 = Der Erkundungszustand erlaubt es dir, [GREEN]dich zu bewegen[] und [GREEN]mit Objekten zu interagieren[], ohne dass du durch [GREEN]Bewegungsreichweite[] oder [GREEN]AP[] eingeschränkt bist.
tip_Inspection_text2 = Wenn du eine Einheit auf das [GREEN]Durchgangsfeld[] bewegst, das durch den Marker angezeigt wird, kannst du [GREEN]in den nächsten Raum[] [GREEN]ziehen[]. Wenn eine Einheit durch den Durchgang in einen anderen Raum zieht, folgt die gesamte Gruppe.
tip_Inspection_text3 = Wenn deine Sicht behindert ist, drücke die [GREEN]Kompass[] oder [GREEN]Mausrad-Taste[], die durch den Marker angezeigt wird, um den Bildschirm [GREEN]zu drehen[], oder halte [GREEN]{0}[] gedrückt, um das Terrain für eine bessere Sicht zu ebnen.
tip_Inspection_text3' = Wenn deine Sicht behindert ist, drücke [GREEN]{0}[] oder [GREEN]{1}[], um den Bildschirm zu drehen.
tip_Inspection_text4 = Du kannst mehr über den aktuellen Dungeon durch die [GREEN]Minimap[] erfahren, die durch den Marker angezeigt wird, und du kannst dich auch bewegen, indem du den gewünschten Raum auf der Minimap auswählst.
tip_Inspection_text5 = Um detaillierte Karteninformationen zu sehen, drücke die Karten-Taste, die durch den Marker angezeigt wird.

tip_PrePareBattle_title = Zustand: Kampfvorbereitung
tip_PrePareBattle_text0 = Der aktuelle Zustand ist Kampfvorbereitung. Während dieser Zeit kannst du deine Einheiten [GREEN]neu anordnen[], [GREEN]Items verwenden[], und [GREEN]Fähigkeiten ausrüsten oder ändern[]. Dies erlaubt dem Spieler, die Gruppe je nach Schlachtfeldsituation vorzubereiten.
tip_PrePareBattle_text1 = Im Zustand der Kampfvorbereitung kannst du Karten verwenden. [GREEN]Karten[] können Verbündete heilen, das Terrain verändern und Positionen ändern, unter anderen Effekten. Der Button, auf den der Marker zeigt, ist der Karten verwenden Button.
tip_PrePareBattle_text2 = Karten werden [GREEN]bis zur nächsten Dungeonrunde[] [GREEN]unbenutzbar[], nachdem sie verwendet wurden.
tip_PrePareBattle_text3 = [GREEN]Wähle das Durchgangsgebiet[], durch das deine Gruppe eingetreten ist, um [GREEN]sich zurückzuziehen[], oder
tip_PrePareBattle_text4 = Drücke den [GREEN]Start Kampf[] Button unten rechts, um den Kampf zu beginnen.

tip_Battle_title = Spielzustand: Kampf
tip_Battle_text0 = Im Kampfzustand haben Verbündete und Feinde abwechselnd [GREEN]Reihenfolge[]. Einheiten können Fähigkeiten wie Bewegung oder Angriffe durch den Verbrauch von [GREEN]AP[] verwenden.
tip_Battle_text00 = AP wird durch die [YELLOW]gelben Punkte[] über der HP-Leiste im Einheitspanel, das durch den Marker angezeigt wird, oder neben der HP-Leiste über den Charakteren dargestellt.
tip_Battle_text1 = Einheiten, die mit verbleibenden [GREEN]AP[] handeln können, werden durch eine blinkende [GREEN]Umrandung[] angezeigt. Wenn keine Verbündeten handeln können, blinkt der [GREEN]Ende Runde Button[].
#tip_Battle_text2 = Einige Fähigkeiten erfordern [SKY]Mana[], um sie zu verwenden. Mana erhöht sich [SKY]jede Runde[] bis zu einem bestimmten Betrag und kann auch durch spezifische Fähigkeiten aufgefüllt werden. Die [SKY]hellblaue Zahl[] beim [SKY]oberen rechten[] Teil des Fähigkeitsbuttons zeigt die benötigte Mana-Menge an.
#tip_Battle_text3 = Einige Fähigkeiten können nur nach einer bestimmten Anzahl von Runden erneut verwendet werden. Die [PINK]rote Zahl[] beim [PINK]unteren rechten[] Teil des Fähigkeitsbuttons zeigt die [PINK]Abkühlzeit[] an.
#tip_Battle_text4 = Es gibt auch Fähigkeiten, die den [YELLOW]Wutausschlag[] erfordern. Diese Verzweiflungsschritte, die mit einem D auf dem Fähigkeitsbutton gekennzeichnet sind, sind [YELLOW]Ultimate Moves[], und Wut sammelt sich, wenn Verbündete [YELLOW]Schaden[] erleiden.
tip_Battle_text2 = Während der Aktionen von Verbündeten oder Feinden ermöglicht das Drücken von [GREEN]{0}[] [GREEN]schnelles Vorlaufen[], und wenn nach der Bewegung kein Schaden oder andere Effekte auftreten, ist [GREEN]Zurückspulen[] möglich.
tip_Battle_text2' = Während der Aktionen von Verbündeten oder Feinden ermöglicht das Drücken der [GREEN]Linke Maustaste[] [GREEN]schnelles Vorlaufen[], und wenn nach der Bewegung kein Schaden oder andere Effekte auftreten, ist [GREEN]Zurückspulen[] möglich.

tip_Town_title = Zustand: Dorf
tip_Town_text0 = Im [GREEN]Dorfzustand[] kannst du die Gruppe nach einem Kampf reorganisieren. Um den [GREEN]Status und die Ausrüstung von Verbündeten[] zu überprüfen, wähle die [GREEN]Dorfhalle[] in der Mitte des Dorfes aus. Du kannst auch andere Strukturen bauen, um Gegenstände und Fähigkeiten zu kaufen oder zu verbessern.
tip_Town_text1 = Während des Dorfzuges kann das [GREEN]erste Gebäude[] [GREEN]kostenlos[] errichtet werden, und ab dem zweiten kostet es Seelen. Der Bau einer Taverne ermöglicht es dir, neue Söldner anzuwerben, und der Laden erlaubt den Kauf von Gegenständen.
tip_Town_text2 = Nach Abschluss der Vorbereitungen kannst du das [GREEN]Portal[] verwenden, um eine [GREEN]Karte[] und den [GREEN]nächsten Dungeon[] auszuwählen, bevor du dich wieder auf dein Abenteuer begibst.

tip_Bomberman_text0 = Die durch den Marker angezeigten Einheiten sind Einheiten der Bomberman-Klasse. [GREEN]Bomberman[]-Einheiten werden [GREEN]sich selbst zerstören[], wenn sich Verbündete in der Nähe befinden. Sei vorsichtig, da Selbstzerstörung Flammenschaden über ein weites Gebiet verursacht. Außerdem werden sie [GREEN]explodieren[], wenn sie [GREEN]Feuerschaden[] erleiden, jedoch nicht explodieren, wenn sie an anderen Schadensarten sterben.

tip_AmphibianSkin_text0 = Die durch den Marker angezeigten Einheiten haben das [GREEN]Amphibien[] Merkmal. Amphibien-Einheiten [GREEN]erholen Gesundheit mit jeder Runde[] und [GREEN]erleiden keine Bewegungseinbußen[], während sie sich auf [GREEN]Wasser[] befinden.

tip_Unholy_text0 = Die durch den Marker angezeigten Einheiten gehören zur Kategorie [GREEN]Untote[]. Untote Einheiten werden sich [GREEN]ein paar Runden nach dem Tod wiederbeleben[], daher ist es am besten, [GREEN]Tränke[] oder [GREEN]Feuer-/Heilmagie[] auf die [GREEN]Leiche[] anzuwenden, um sie zu [GREEN]entfernen[]. Zudem nehmen Untote Einheiten [GREEN]Schaden[] von [GREEN]Heilmagie[] entgegen, außer bei Dunkelheitsattribut Heilung.

new_category_type = Neue Kategorie
new_trap_obj = Neue Falle
new_floor_trap_type = Neue Bodenfalle
new_skill_type = Neuer geübter Feind
new_class_type = Neuer Klassenfeind

tip_fire_title = Neuer Terrain Effekt: Feuer
tip_fire_text0 = Das Feld, das durch den Marker angezeigt wird, steht in Flammen. Wenn Feuerschaden auf ein Feld mit Gras angewendet wird, fängt es Feuer. Feuer breitet sich jedoch nicht auf Felder mit Pfützen aus.
tip_fire_text1 = Sobald ein Feld Feuer fängt, breitet es sich in der nächsten Runde auf angrenzende Felder mit Gras und einer Höhenunterschied von 1 oder weniger aus, während das Feuer auf dem ursprünglichen Feld erlischt.

tip_soul_crystal_text0 = Ein [GREEN]Seelenfragment[] ist erschienen. Seelenfragmente [GREEN]erscheinen zufällig[] auf dem Schlachtfeld und gewähren [GREEN]2 Seelen[] Ressourcen, wenn sie eingesammelt werden. Seelenfragmente werden [GREEN]automatisch[] am [GREEN]Ende des Kampfes[] erhalten, andernfalls verschwinden sie [GREEN]nach einigen Runden[].

tip_SpecialEnemy_title = Besondere Feinde
tip_SpecialEnemy_text0 = Einige Feinde haben [GREEN]besondere Icons[] über ihren HP-Leisten. Diese Feinde haben [GREEN]bemerkenswerte Merkmale[], wie z.B. Gegenangriffe, Gelände-Boni oder Kontrolle über Zonen.
tip_SpecialEnemy_text1 = [GREEN]Wenn du mit der Maus über[] diese Einheiten fährst, erhältst du [GREEN]Informationen[] über ihre Merkmale.
tip_SpecialEnemy_text2 = Wenn sie mehrere Merkmale haben, drücke während des Hoverns den [GREEN]{0}[] Button, um [GREEN]zwischen[] den Merkmalinformationen zu [GREEN]wechseln[].

tip_elemental_jar_title = Elementar-Behälter
tip_elemental_jar_text0 = Die Objekte, die durch den Marker angezeigt werden, sind Elementar-Behälter. Elementar-Behälter zerbrechen und verursachen [GREEN]Schaden[] des entsprechenden [GREEN]elementaren Typs[], wenn sie [GREEN]beschädigt[] oder mit Fähigkeiten wie Telekinese aktiviert werden.
tip_elemental_jar_text1 = Jeder Elementar-Behälter hat eine [GREEN]andere Schadensspanne[] und ein [GREEN]Muster[], je nach seinem Element, also sei vorsichtig.
tip_elemental_jar_text2 = [PINK]Feuer[] Behälter verursachen Feuerschaden an den [PINK]umgebenden 8 Feldern[], während [YELLOW]Blitz[] Behälter Kettenblitz freisetzen, die einem [YELLOW]Pfad[] folgen.
tip_elemental_jar_text3 = [SKY]Eis[] Behälter verursachen Eisschaden an den umgebenden 8 Feldern und fügen [SKY]Frostbeule[] zu, während [GREEN]Gift[] Behälter Giftschaden verursachen und eine [GREEN]Giftwolke[] in den umgebenden 8 Feldern erzeugen.
tip_elemental_jar_text4 = [GRAY]Dunkel[] Behälter erzeugen [GRAY]Hände des Todes[] in den umgebenden 8 Feldern und hindern Feinde am Bewegen.

tip_ArmorCrushed_text0 = Die Einheit, auf die der Marker zeigt, ist derzeit in einem [GREEN]Rüstung Zerschlagen[] Zustand. In diesem Zustand wird der [GREEN]Verteidigungs[] Wert der [GREEN]Rüstung[] vorübergehend reduziert. Dieser Zustand tritt auf, wenn sie von einer stumpfen Waffe getroffen wird.\n Nahkampfwaffen haben unterschiedliche Eigenschaften.
  #[GREEN]Schwerter[] haben [GREEN]hohe Genauigkeit[], [GREEN]Äxte[] haben eine hohe [GREEN]kritische[] Trefferquote und [GREEN]Knüppel[] können [GREEN]Rüstung Zerschlagen[] verursachen.

tip_trap_obj_general_text0 = Der Marker zeigt derzeit auf einen neuen Fallenobjekt [GREEN]{0}[]
tip_floor_trap_general_text0 = Der Marker zeigt derzeit auf eine neue Bodenfalle [GREEN]{0}[]

prologue_text_amulet0 = Der Amulet von Ecillif, ein Relikt mit immenser Macht, ist seit Ewigkeiten in Geheimnis gehüllt. Der Legende nach kann dieses Amulett seinem Träger immense Macht, riesigen Reichtum oder sogar die Fähigkeit, die Toten zu erwecken, verleihen. Eines Tages begannen Gerüchte zu kursieren, dass dieses Artefakt, das einst als bloßer Aberglaube abgetan wurde, tatsächlich existierte. So begaben sich verschiedene Abenteurer auf Reisen, um dieses Artefakt zu finden, angetrieben von ihren eigenen Motivationen und Wünschen.
ending_text_general0 = Schließlich besiegte {0} den bösen Gott Nog. Seine Diener verschwanden in diesem Moment. Nog spuckte schwarzes Blut und ließ seinen Kopf fallen, und die Umgebung wurde von unheimlichem Rauch und seltsamen Klagen eingehüllt. Als der Rauch sich verzog, sprosste aus der Stelle, wo Nogs Kopf gewesen war, ein roter Tentakel, der einen goldenen Schimmer ausstrahlte, aber in der Mitte war ein Amulett mit einem roten und gelben Edelstein, der einem blinzelnden Auge ähnelte, der in der Luft schwebte. {0} ergriff das Amulet von Ecillif.
prologue_text_AdventurerParty0 = Der Abenteurer ist jemand, der neue Welten und Freiheit eher genießt als Reichtum oder Ruhm. Während einer vorherigen Reise wurde er in einem tiefen Dungeon gefangen, aber nachdem er einen wiederbelebten Dämon am Boden besiegt hatte, entkam er und fand eine unbekannte Karte. Später hatte er einen Traum, in dem er eine Armee der Toten sah, die aus dem Norden die Menschenwelt überfiel, und erhielt eine Offenbarung, dass nur das Relikt, das von der Karte angezeigt wird, es aufhalten kann.
good_ending_text_AdventurerParty0 = Der Abenteurer, der eine unheilvolle Aura vom Amulett spürte, beschloss, es nach reiflicher Überlegung zu verstecken. Dank seiner Taten genoss die Welt Frieden und Wohlstand, aber er kehrte still von seiner Reise zurück und träumte von neuen Welten.
bad_ending_text_AdventurerParty0 = Der Abenteurer wurde von der immensen Macht des Amuletts verführt und strebte danach, große Stärke zu erlangen. Ein unheilvoller Rauch umhüllte das Amulett, und während er Macht über die Zeit erlangte, verfiel sein Geist und Körper. Er wurde zum Anführer des Albtraums, den er zu verhindern versucht hatte, und zerstörte die Menschenwelt mit seiner Armee.
prologue_text_MageParty0 = Der Magier ist ein junger Meister der alten Magie. Nachdem er seine Geliebte verloren hatte, verlor er alle Emotionen und Willen und zog sich aus der Welt zurück. Eines Tages, als er alte Texte las, erfuhr er von dem Amulet von Ecillif und kam zu der Überzeugung, dass es seine verstorbene Liebe wiederbeleben könnte. Er gewann einen Funken Hoffnung und machte sich auf die Reise, um das Amulett zu finden.
good_ending_text_MageParty0 = Gerade als der Magier das Amulett verwenden wollte, um seine Geliebte wiederzubeleben, hörte er ihre Stimme in seinem Kopf. Er erinnerte sich an die Warnung seines Meisters, dass das Missachten der natürlichen Ordnung große Folgen haben würde. Als er die unheilvolle Aura spürte, entschied er sich, seinen Meister aufzusuchen, um einen Weg zu finden, das Amulett zu zerstören.
bad_ending_text_MageParty0 = Vom Verlangen besessen, seine Geliebte wiederzubeleben, chantete der Magier einen Zauber, während er das Amulett hielt. Dunkelheit umhüllte die Umgebung, und das Bild seiner Geliebten erschien aus dem Amulett, verzerrte aber bald. Scharfe Tentakel zerschnitten die Hände des Magiers. Gelähmt vor Angst, sah er zu, wie die verdrehte Gestalt langsam an ihm vorbeizog.
prologue_text_KnightParty0 = Der Ritter war ein respektierter Anführer des heiligen Ordens, der den König beschützte. Eines Tages, bei einem königlichen Festmahl, sah er eine Vision eines Engels, der dem König ein Amulett überreichte. Die Vision verschwand, aber jeder, der bei dem Festmahl anwesend war, sah dieselbe Vision, und deutete sie als ein Zeichen, dass das Amulett Frieden und Wohlstand ins Königreich bringen würde. Mit fester Überzeugung machte sich der Ritter auf, um diese heilige Mission zu erfüllen.
good_ending_text_KnightParty0 = Der Ritter brachte das Amulet von Ecillif ins Königreich. Als er die gefährliche Macht erkannte, überzeugte er den König, es in einem versteckten Tempel im Königreich zu lagern, um sicherzustellen, dass es niemand missbrauchen konnte. Der Ritter wurde ein legendäres Symbol von Ehre und Glauben, und seine Legende wurde über Generationen hinweg gepriesen.
bad_ending_text_KnightParty0 = Der Ritter brachte das Amulet von Ecillif ins Königreich, aber er war bereits von seiner Macht korrumpiert worden. In dem Moment, als er es dem König präsentierte, tötete er den König und nutzte die Kraft des Amuletts, um über das Königreich zu herrschen. Sein Name wurde lange Zeit mit Tyrannei und Verrat in Verbindung gebracht.
prologue_text_RangerParty0 = Der Ranger schützt den Wald und seine Leute, nachdem er aufgrund von Amnesie alle Erinnerungen verloren hat. Er wirkt nach außen kalt, hat jedoch ein gutes Herz. Eines Nachts hatte er einen Traum, in dem ihm eine mysteriöse Stimme sagte, er solle das Amulet von Ecillif finden. Er glaubte, dass das Amulett ihm helfen könnte, seine verlorene Vergangenheit wiederzuerlangen und machte sich auf die Reise, um sein wahres Ich zu entdecken.
good_ending_text_RangerParty0 = Der Ranger erkannte, dass das Amulett mehr Schaden als Nutzen bringen würde und versteckte es, um zu verhindern, dass jemand es missbraucht. Er klammerte sich nicht mehr an seine Vergangenheit und setzte seine Reise fort, um Menschen zu leiten und zu beschützen. Seine Weisheit und Güte inspirierten viele.

prologue_text_NecromancerPlayerParty0 = Der Nekromant ist eine rätselhafte Figur, die im Geheimnis der dunklen Magie gehüllt ist. Er hatte lange nach verbotenem Wissen gesucht. Kürzlich erfuhr er von einem alten Ritual, das das Amulet von Ecillif beinhaltete. Durch dieses Ritual konnte er Leben und Tod selbst kontrollieren. Auf der Suche nach ultimativer Macht begab er sich auf seine dunkle Pilgerfahrt.
good_ending_text_NecromancerPlayerParty0 = Durch seine Reisen erkannte der Nekromant die Bedeutung von Balance zwischen Leben und Tod und beschloss, das Amulett zu zerstören. Die böse Kraft des Amuletts entleerte alle seine magischen Fähigkeiten, aber seine selbstlose Tat rettete seine Seele, und er wurde ein Weiser, der sich dafür einsetzte, Harmonie zwischen Leben und Tod zu erreichen. Er wurde für sein tiefes Verständnis der natürlichen Ordnung respektiert.
bad_ending_text_NecromancerPlayerParty0 = Durch die Anwendung dunkler Magie fusionierte er das Amulett mit seiner Brust, indem er es mit seinem Körper vereinigte. Er wurde zu einem unsterblichen Wesen, weder tot noch lebendig. Während sein Bewusstsein schwand, glaubte er, dass es das wert war. Seinen Sinn für Identität verlierend, erweckte er eine unaufhaltsame Armee von Untoten und eroberte das Königreich, wodurch er die Welt ins Dunkel stürzte.
prologue_text_RogueParty0 = Der Räuber, ein Meister der Heimlichkeit und Täuschung, lebt im Schatten und arbeitet immer allein ohne Verbündete. Durch eine entschlüsselte geheime Nachricht, die während einer Verfolgung erlangt wurde, erfuhr er von dem Amulet von Ecillif. Er glaubte, dass es ihn von seiner Vergangenheit, seinen Feinden und seinem Schicksal befreien könnte. Angetrieben von dem Wunsch nach Befreiung begab er sich auf eine gefährliche Suche.
good_ending_text_RogueParty0 = Der Räuber erlangte das Amulett, erkannte aber, dass wahre Freiheit nur durch eigene Stärke erreicht werden kann, also versteckte er das Amulett. Er hörte auf, allein zu arbeiten, und wurde zu einem Helden, der die Unterdrückten befreite und ein Netzwerk von Rebellen führte, die für Freiheit kämpften. Seine List und Fähigkeiten machten ihn zur letzten Hoffnung der Widerstandsbewegung.
bad_ending_text_RogueParty0 = Er verwendete das Amulett, um andere zu manipulieren und zu kontrollieren, dominierte die Unterwelt und wurde ein gefürchteter Verbrecherboss. Obwohl er Freiheit suchte, endete er damit, von seinem eigenen Schicksal gefangen zu sein.
prologue_text_CustomParty0 = Unter den vielen Gruppen, die nach dem Amulett suchten, machte sich eine Gruppe von Abenteurern auf. Sie suchten das Amulet von Ecillif, um ihr Schicksal zu bestimmen.
good_ending_text_CustomParty0 = Die Gruppe von {0} erlangte das Amulet von Ecillif. Das immense und gefährliche Macht des Amuletts erkannte {0} und entschied sich, es nicht zu verwenden. Sie versteckten das Amulett, wo es niemand finden konnte. Ihre Taten brachten Stabilität in die Welt. Sie lebten ruhige Leben und ihre Namen blieben unbekannt.
bad_ending_text_CustomParty0 = {0} trug das Amulett um seinen Hals. Er fühlte einen Anstieg immensen Powers. In diesem Moment erschien ein unheilvolles Licht in seinen Augen. Mit der Macht des Amuletts tötete er viele Gegner und eroberte das Königreich. Als niemand mehr übrig war, um gegen ihn zu stehen, fürchtete {0} Verrat. Er beseitigte sogar seine Kameraden und die Familie, die lange bei ihm gewesen waren. Die Stimmen derer, die er getötet hatte, hallten ständig in seinem Kopf wider.
prologue_text_DebugParty0 = Unter den vielen Gruppen, die nach dem Amulett suchten, machte sich eine Gruppe von Abenteurern auf. Sie suchten das Amulet von Ecillif, um ihr Schicksal zu bestimmen.
good_ending_text_DebugParty0 = Die Gruppe von {0} erlangte das Amulet von Ecillif. Das immense und gefährliche Macht des Amuletts erkannte {0} und entschied sich, es nicht zu verwenden. Sie versteckten das Amulett, wo es niemand finden konnte. Ihre Taten brachten Stabilität in die Welt. Sie lebten ruhige Leben und ihre Namen blieben unbekannt.
bad_ending_text_DebugParty0 = {0} trug das Amulett um seinen Hals. Er fühlte einen Anstieg immensen Powers. In diesem Moment erschien ein unheilvolles Licht in seinen Augen. Mit der Macht des Amuletts tötete er viele Gegner und eroberte das Königreich. Als niemand mehr übrig war, um gegen ihn zu stehen, fürchtete {0} Verrat. Er beseitigte sogar seine Kameraden und die Familie, die lange bei ihm gewesen waren. Die Stimmen derer, die er getötet hatte, hallten ständig in seinem Kopf wider.
prologue_text_SergeantParty0 = Unter den vielen Gruppen, die nach dem Amulett suchten, machte sich eine Gruppe von Abenteurern auf. Sie suchten das Amulet von Ecillif, um ihr Schicksal zu bestimmen.
good_ending_text_SergeantParty0 = Die Gruppe von {0} erlangte das Amulet von Ecillif. Das immense und gefährliche Macht des Amuletts erkannte {0} und entschied sich, es nicht zu verwenden. Sie versteckten das Amulett, wo es niemand finden konnte. Ihre Taten brachten Stabilität in die Welt. Sie lebten ruhige Leben und ihre Namen blieben unbekannt.
bad_ending_text_SergeantParty0 = {0} trug das Amulett um seinen Hals. Er fühlte einen Anstieg immensen Powers. In diesem Moment erschien ein unheilvolles Licht in seinen Augen. Mit der Macht des Amuletts tötete er viele Gegner und eroberte das Königreich. Als niemand mehr übrig war, um gegen ihn zu stehen, fürchtete {0} Verrat. Er beseitigte sogar seine Kameraden und die Familie, die lange bei ihm gewesen waren. Die Stimmen derer, die er getötet hatte, hallten ständig in seinem Kopf wider.

prologue_text_NobleParty0 = Der Adelige war einst der letzte Nachfahre einer wohlhabenden Familie. Er ererbte das Land seiner Vorfahren, das jetzt verwüstet ist. Er sah die Realität des Falls seiner Familie und den Ruin des Anwesens, und er beschloss, ein neues Leben zu beginnen. Die Hoffnung, den Ruhm seiner Familie durch den Erwerb eines legendären Amuletts wiederherzustellen, ließ ihn nie los. Er stand allein im leeren Dorf und begann seine Reise, um das Amulett zu finden und sein Anwesen wieder aufzubauen.
good_ending_text_NobleParty0 = {0} erlangte das Amulett, verspürte jedoch plötzlich eine Vorsicht gegenüber der mysteriösen Macht darin. Er erkannte, dass das Amulet zwar alles wiederherstellen konnte, die Kosten jedoch ebenso hoch waren. Letztendlich entschied er sich, die Macht des Amuletts nicht zu nutzen und stattdessen das Anwesen mit der Hilfe seiner Verbündeten wieder aufzubauen, wodurch die Ehre seiner Familie erneut wiederhergestellt wurde.
bad_ending_text_NobleParty0 = {0} versuchte, das Anwesen mit der Macht des Amuletts wiederzubeleben, aber bald tauchte eine dunkle Aura auf und nahm das Leben der Menschen im Anwesen eines nach dem anderen. Ihre Seelen wurden in das Amulett aufgenommen und das Land verwandelte sich in ein Reich der Dunkelheit, das des Lebens entblößt ist. Jetzt wandeln nur seelenlose Untote umher, mit dem Adligen, der allein über sein verwüstetes Land als dunkler Herrscher herrscht. Sein Ehrgeiz blieb als Fluch mit dem Amulett, der eine ewige Dunkelheit hinterließ, die niemals verblassen würde.

quest_ending_text_general0 = Du hast endlich alle sieben Siegel gebrochen, den wiederbelebten Dämon besiegt und das Dorf wiederhergestellt, indem du den Willen des ehemaligen Lords weitergeführt und alle bösen Kräfte besiegt hast. Gerade als du dich zurücklehnen wolltest, hallt der albtraumhafte Schrei des besiegten Dämons wider, und eine unheilvolle Aura hängt in der Luft. Aus irgendeinem Grund ist die böse Präsenz zurückgekehrt, und du und deine Söldner müsst bereit sein, das Dorf zu verteidigen und dich ohne einen Moment der Ruhe dem letzten Kampf zu stellen!

