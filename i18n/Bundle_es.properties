FEAR_desc = Indica cuán fácilmente se asusta una unidad.\nSi los HP de una unidad son menos que [GREEN]Miedo(%) de su HP máximo[], la unidad se vuelve [GREEN]en pánico[].
Hire_desc = Número de miembros actuales del grupo.
MaxHire_desc = Número de unidades máximas reclutables.

Mana_desc = Energía mágica cristalizada.\n Aumenta en cada turno y desaparece después de la batalla.\n Usado para lanzar magia.
Mana_arg_desc = Energía mágica cristalizada.\n Aumenta en [GREEN]{0}[] por cada turno y desaparece después de la batalla.\n Usado para lanzar magia.
MaxMana_desc = Cantidad máxima de maná que se puede cargar.
ManaCharge_desc = Cantidad de maná cargado por turno.
Rage_desc = Usado para lanzar habilidades de ira.\n cargado cuando los aliados son golpeados por un ataque.
MaxRage_desc = Usado para lanzar habilidades de ira.\n cargado cuando los aliados son golpeados por un ataque.
Gold_desc = Usado para comerciar algo.
Soul_desc = Alma cristalizada.\nUsado para mejorar habilidades, edificios.\nPuedes desbloquear nuevas clases o grupos iniciales al reunir este recurso.
Food_desc = Esto se consumirá automáticamente.\nLa falta de comida disminuirá HP.\nSe reabastece al limpiar un nivel.
Alignment_desc = La moralidad del grupo varía de -4 a 4\n +12.5% de cantidad de curación y -6.25% de daño de magia oscura por punto.
Portal_desc = Especifica el número máximo de unidades que se pueden transportar a través del portal para participar en cada batalla.

Resource = Recurso
Resource_desc = Estos son recursos compartidos por el grupo.
Gold_long_desc = El oro es un recurso básico utilizado para comprar, vender objetos o comerciar durante eventos. Es menos raro que las Piedras de Alma.
Soul_long_desc = Las piedras de alma se utilizan para mejorar habilidades o construir edificios en ciudades. Dado que la cantidad que puedes obtener es limitada, úsalo sabiamente. El número total de piedras de alma recolectadas durante el juego también se utiliza para desbloquear nuevas unidades.
MaxHire_long_desc = Cada vez que contratas una unidad, tu conteo de contratación aumenta en uno y no puedes contratar más unidades que tu límite máximo de contratación. Los convocados, familiares y unidades invitadas no se incluyen en este límite.\n*Nota: El número de enemigos de la mazmorras aumenta con el tamaño actual de tu grupo.
MaxMana_long_desc = El maná es necesario para que las unidades tipo mago lancen hechizos. Comienza en 0 al inicio de la batalla y aumenta cada turno dependiendo del grupo. Algunas unidades pueden usar AP para cargar maná. Cada grupo tiene una capacidad máxima de maná, que puede aumentarse a través de puntos de nivel de líder o eventos especiales.
MaxRage_long_desc = La ira es un recurso utilizado para habilidades de ira y generalmente aumenta cuando los aliados reciben daño. Un medidor equivale a 100 y usar una habilidad de desesperación consume un medidor. La ira máxima puede aumentarse a través de puntos de nivel de líder o eventos especiales.
Portal_long_desc = Un recurso exclusivo del Modo Misión. Puede aumentarse en el portal utilizando piedras de alma.
Security_long_desc = Un recurso exclusivo del Modo Misión. Disminuye si pasas un turno sin seleccionar ninguna misión, y puede aumentarse a través de Misiones de Caza.
Alignment_long_desc = La alineación aumenta la curación de la magia sagrada y reduce el daño oscuro. Una mayor alineación también potencia la eficacia de los hechizos de curación sagrada. Algunos eventos especiales cambian según la alineación. La alineación generalmente puede cambiarse a través de estatuas de ángeles en mazmorras o edificios de la ciudad. Atacar primero a grupos neutrales disminuye la alineación, y ciertos resultados de eventos también afectan a esto.

BaseStat = Estadística Base
BaseStat_desc = Indica los atributos fundamentales del personaje.
BaseStat_long_desc = Al subir de nivel, puedes elegir aumentar estas estadísticas en lugar de aprender una habilidad. Las estadísticas disponibles para aumentar dependen de la clase. Incluyen Fuerza, Destreza, Inteligencia, Agilidad y Carisma.

Mastery = Maestría
Mastery_desc = Estadísticas que representan cuán eficientemente un personaje puede usar armas o magia elemental.
Mastery_long_desc = Las maestrías de armas y magia aumentan el daño y la precisión al atacar con esa arma o al causar daño de magia elemental. La maestría de escudos aumenta la estadística de bloqueo, mientras que la maestría de armaduras aumenta la defensa de la armadura y reduce penalizaciones al usar armadura. En general, tener al menos nivel 1 es necesario para causar un daño adecuado y cualquier cosa menor puede resultar en penalizaciones.

Knowledge = Conocimiento
Knowledge_desc = Requerido al aprender habilidades a través de libros.
Knowledge_long_desc = *Nota: Esto es diferente de la maestría. La maestría se aplica durante el uso de armas, mientras que el conocimiento es requerido para aprender nuevas habilidades.\n\nLas habilidades pertenecen a una de diez disciplinas de conocimiento y tienen niveles de conocimiento de 1 a 3. Si tu nivel de conocimiento cumple o supera el requisito de la habilidad, puedes aprender o mejorar la habilidad a través de libros. Cada nivel de conocimiento está generalmente relacionado con una clase específica.\n*Sin embargo, las habilidades que se pueden aprender con puntos de habilidad por una clase no requieren conocimiento.

DefensiveStat = Estadística Defensiva
DefensiveStat_desc = Estadísticas que representan la capacidad de un personaje para reducir o evitar daño entrante.
DefensiveStat_long_desc = Las estadísticas defensivas incluyen las físicas como Bloqueo, Esquivar y Defensa, y las mágicas como Resistencia al Fuego, Frío y Rayo. Bloqueo es una estadística obtenida a través de escudos e indica la posibilidad (%) de bloquear ataques físicos. Esquivar representa la posibilidad (%) de evitar ataques. Defensa y resistencias elementales reducen el daño entrante de cada elemento respectivo (%). Las estadísticas defensivas de los enemigos tienen límites dependiendo de la dificultad, y las estadísticas defensivas de los aliados generalmente están limitadas a 75.

