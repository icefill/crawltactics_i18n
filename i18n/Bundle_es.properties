tut_intro2_t = Presiona el botón [GREEN]engranaje[] para abrir el menú.\n Aquí puedes seleccionar opciones de [GREEN]Tutorial[], cambiar [GREEN]Configuraciones[], y [GREEN]Salir del juego[].\n Si sales fuera del tutorial, el juego se [GREEN]guardará automáticamente[].
tut_input3_t= Usa un gesto de [GREEN]rotación con dos dedos[] para rotar la pantalla\n\n Usa un gesto de [GREEN]pellizcar[] para hacer zoom in y out.\n\n [GREEN]Arrastra la pantalla[] para mover la vista.\n\n [YELLOW]¡Intenta rotar la pantalla![]
tut_input5_t = Si la altura del terreno hace que las unidades sean difíciles de ver, [GREEN]desliza hacia abajo con dos dedos[] para ver un mapa [GREEN]aplanado[] y desliza [GREEN]hacia arriba[] para volver.\n\n[YELLOW]¡Intenta aplanar y restaurar el mapa![]
tut_move1_t = Toca un destino [GREEN]una vez[] para mostrar el [GREEN]camino[].\n Toca el mismo tile [GREEN]otra vez[] para [GREEN]moverte[].\n\n Toca otro tile o presiona el botón [GREEN]Cancelar[] para cancelar el camino.
tut_move1'_t = Bien hecho.\n\n [YELLOW]Toca el mismo tile nuevamente para mover la unidad.[]

tut_inven18_t = Presiona el botón [GREEN]x[] en la esquina superior derecha de la ventana para cerrarla.
tut_map0_t = Las mazmorras en Crawl Tactics constan de múltiples 'habitaciones'.\n  El [GREEN]minimapa[] se encuentra en la [GREEN]esquina inferior derecha[].\n  Presiona el botón [GREEN]mapa[] en la pantalla para abrir la ventana del mapa.
tut_prepare6_t = Presiona el botón [YELLOW]tarjeta[] indicado por el marcador para abrir la ventana de cartas.[]
tut_battle8_t = Toca un objetivo [GREEN]una vez[] para ver [GREEN]información[], y [GREEN]toca nuevamente[] para realizar un [GREEN]ataque[].\n\n  [YELLOW]¡Ahora intenta atacar al enemigo indicado por la flecha![]
tut_battle8_1_t = Bien hecho.\n\n  [YELLOW]Toca el mismo tile una vez más.[]
tut_magic5_t = Abre el [GREEN]menú circular[] para usar la habilidad deseada.\n\n[YELLOW]Selecciona la magia de Quemar e intenta atacar el cañón.[]
tut_trap2_0_t = [YELLOW]Toca el tile indicado por la flecha.[]
tut_trap2_t = Cuando [GREEN]toques[] un tile movible, aparece los enemigos atacables, trampas y [GREEN]trayectorias[] si los enemigos pueden atacar esa unidad.\n\n [YELLOW]Mueve al arquero al tile indicado por la flecha.[]
tut_after0_1_t = Cuando el [GREEN]nivel aumenta[], la unidad gana [GREEN]puntos de habilidad[].\n\n[YELLOW]Ahora selecciona al mago indicado por la flecha y abre la ventana de equipo.[]

tut_use0_t = Cuando recoges un objeto, se puede usar desde los [GREEN]slots rápidos[] en el [GREEN]menú circular[]. Presiona el [GREEN]botón circular[] indicado por el marcador o toca la unidad seleccionada nuevamente para abrir el [GREEN]menú circular[].\n\n  [YELLOW]Abre el menú circular.[]
tut_use0_1_t = Presiona un botón en el menú circular y mantén tu dedo [GREEN]sostenido[] mientras te mueves entre botones para mostrar [GREEN]información[]. [GREEN]Soltar tu dedo en el botón deseado lo [GREEN]seleccionará[].\n\n  [YELLOW]Toca el botón de slot rápido indicado por el marcador y selecciona una poción.[]
tut_use1_t = Toca el tile deseado [GREEN]una vez[] para mostrar [GREEN]información[], y toca [GREEN]nuevamente[] para [GREEN]usar[]lo.\n\n [YELLOW]Toca una unidad e intenta usar un objeto.[]

tip_Inspection_text3_t = Si tu vista está obstruida y resulta inconveniente, usa un gesto de [GREEN]dos dedos[] [GREEN]para rotar[] la pantalla, o [GREEN]desliza hacia abajo[] para [GREEN]aplanar[] el terreno y desliza hacia arriba para restaurarlo.
tip_Battle_text2_t = Mientras los aliados o enemigos están actuando, presionar el botón [GREEN]de avanzar rápido[] permite que las acciones procedan en [GREEN]avanzar rápido[], y si no se recibió daño u otros efectos después de moverse, [GREEN]deshacer[] está disponible.
tip_SpecialEnemy_text1_t = Tocar estas unidades una vez mostrará [GREEN]información[] sobre sus características.
tip_SpecialEnemy_text2_t = Si hay múltiples características, presionar el botón [GREEN]->[] debajo de la información moverá a [GREEN]la siguiente característica[].

need_reload_asset_title = Recargar Activos
need_reload_asset_desc = Para aplicar la configuración cambiante, los activos deben ser [GREEN]recargados[].
need_reload_asset_default_desc = Para volver a la configuración predeterminada, necesitarás recargar los activos.\n[YELLOW]¿Te gustaría recargar los activos?[]
hud_width_problem = ¡La resolución de pantalla es demasiado pequeña en comparación con el HUD!

start_battle_title = Comenzar Batalla
start_battle_desc = ¿Terminar preparativos y comenzar la batalla?

move_room_title = Mover Habitación
move_room_text = ¿Quieres moverte a la habitación seleccionada?

menu_crash_log = Registro de Fallos
menu_crash_log_desc = Muestra el registro de fallos más reciente.

hold_skill_wheel = Arrastra Selecc. Hab.
hold_skill_wheel_desc = Cuando esta opción está habilitada, mantén presionado el botón de la rueda de habilidades en la esquina inferior izquierda y mueve tu dedo para seleccionar una habilidad. Cuando está deshabilitada, toca directamente el botón de habilidad deseado para seleccionarlo.

melee_basic_zoc = Ventaja de Arma Melé
melee_basic_zoc_desc = Solo funciona cuando se equipa un arma cuerpo a cuerpo.
ranged_basic_zoc = Ventaja de Arma a Distancia
ranged_basic_zoc_desc = Solo funciona cuando se equipa un arma a distancia.

export_save = Exportar Archivos Guardados
export_save_desc = Si hay un problema con los archivos guardados y deseas enviarlos al desarrollador, por favor exporta los archivos guardados.

BossInvasionDelayingBonus = Retraso en la Invasión por Derrota de Jefe
BossInvasionDelayingBonus_simple_desc = Derrotar a un jefe aumenta el retraso de invasión en +{0}
BossInvasionDelayingBonus_desc = Cantidad en que se retrasa la invasión cuando se derrota a un jefe

ExplorationInvasionDelayingBonus = Retraso en la Invasión por Éxito en Exploración
ExplorationInvasionDelayingBonus_simple_desc = Completar una misión de exploración aumenta el retraso de invasión en +{0}
ExplorationInvasionDelayingBonus_desc = Cantidad en que se retrasa la invasión cuando se completa una misión de exploración

per_unit_ach_desc = Algunos logros utilizan conteos por unidad, por lo que los conteos mostrados pueden variar según la partida.

disable_swipe_to_flatten = Desact. Aplanar Deslizar
disable_swipe_to_flatten_desc = Cuando está habilitado, el aplanamiento del terreno no se activará al deslizar hacia arriba o hacia abajo con dos dedos.

EUnitCategory_Human_desc = Humanos ordinarios. Solo los humanos pueden avanzar a una subclase.
EUnitCategory_Beast_desc = Animales, bestias, insectos y unidades similares. Pueden ser domesticados con habilidades de domesticación.
EUnitCategory_Plant_desc = Débil contra el fuego y resistente a la electricidad.
EUnitCategory_Machinary_desc = Tiene armadura e inmune a los debuffs y miedo, pero el movimiento se reduce en agua.
EUnitCategory_StoneWork_desc = Estructuras hechas de piedra. El daño por colisión es alto.
EUnitCategory_Magical_desc = Seres creados a través de magia.
EUnitCategory_Celestial_desc = Unidades como ángeles o demonios.

need_potion_desc = [GREEN]Se requiere poción[]: Lanzar esta habilidad requiere {0} poción(es) de curación.

class_change = Cambio de Clase
class_change_desc = Cuando el nivel de clase de la unidad actual alcanza un cierto umbral, puede avanzar a una clase superior. Después de cambiar de clase, se retienen las estadísticas y habilidades de la clase anterior, pero [PINK]el conocimiento y la maestría no se retienen[]. Además, si una [GREEN]habilidad de clase[] está en [GREEN]nivel 4[] o superior durante el cambio de clase, se convierte en una [GREEN]habilidad pasiva[].

select_item = Seleccionar Ítem
select_core = Seleccionar Núcleo

show_skills = Mostrar Barra Hab.
show_skills_desc = Cuando está habilitado, las habilidades se muestran en la esquina inferior izquierda al seleccionar una unidad, y seleccionar la unidad de nuevo abre la ventana de equipo en lugar de la rueda de habilidades. Cuando está deshabilitado, se utiliza la rueda de habilidades.

tut_use0_t' = Cuando recoges un ítem, puedes usarlo desde el [GREEN]Slot Rápido[].\n\n  [YELLOW]Presiona el botón del slot rápido indicado por el marcador.[]
tut_inven1_t' = [YELLOW]Abre el inventario indicado por el marcador.[]

tut_portal8' = Para cambiar de clase, debes usar el [GREEN]altar de cambio de clase[] en la mazmorras o construir un altar de cambio de clase en la aldea.\n\n[YELLOW]Activa el altar de cambio de clase que construiste.[]
tut_portal9' = Para cambiar de clase, tu [GREEN]nivel de clase[] debe estar por encima de un cierto umbral.\n\n[YELLOW]Selecciona el botón de Mago Elemental y luego presiona el botón de cambiar clase.[]

tut_town7' = [YELLOW]Ahora construye el altar de cambio de clase indicado por el marcador.[]

ESkillStrategy.MeleeOnly = Solo Habilidades de Ataque Melé
ESkillStrategy.RangedOnly = Solo Habilidades de Ataque a Distancia
ESkillStrategy.MeleeOnly_desc = Utiliza solo habilidades de ataque cuerpo a cuerpo.
ESkillStrategy.RangedOnly_desc = Utiliza solo habilidades de ataque a distancia.

