tut_input3_c=[GREEN]{0}[] y [GREEN]{1}[] son para [GREEN]rotar la pantalla[] y\n\n[GREEN]{2}[] y [GREEN]{3}[] son para [GREEN]Acercar[] y alejar.\n\n[YELLOW]¡Intenta rotar la pantalla![]
