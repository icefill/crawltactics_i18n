EnemyPlayerBoundDiff = Límite de Diferencia de Nivel Enemigo-Jugador
EnemyPlayerBoundDiff_simple_desc = Valor de diferencia aplicado al establecer el nivel mínimo del enemigo
EnemyPlayerBoundDiff_desc = Cuando se habilita la opción de límite inferior de nivel del enemigo, limita la diferencia máxima de nivel entre los enemigos y el promedio del grupo. Cuanto mayor sea el valor, mayor será el nivel del enemigo.\n\
ej) Si este valor es 2, el nivel mínimo del enemigo es promedio del grupo +2

