tut_input_title = Entrada General
tut_input0= Presiona la tecla [GREEN]{0}[] para activar y desactivar los atajos.\n\nMuchos botones y elementos de la interfaz mostrarán información sobre herramientas cuando pases el cursor sobre ellos.
