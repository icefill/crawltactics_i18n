tut_prepare7 = ¡Buen trabajo!
tut_prepare8 = Algunas cartas requieren un input para ser aplicadas y otras cartas se aplican instantáneamente después de su uso.
tut_prepare9 = [YELLOW]Intenta usar la carta 'Sanar'[]
tut_prepare10 = ¡Bien hecho!. Cada carta solo puede usarse una vez por mazmorras.
tut_prepare11 = Puedes [GREEN]Cambiar equipo[] o [GREEN]habilidades[] en este estado sin consumir PA.
tut_prepare12 = Ahora, si presionas [GREEN]{0}[], la batalla comenzará.
tut_prepare13 = [YELLOW]¡Comencemos la batalla![]

tut_battle = Batalla
tut_battle_title= Fase de batalla
tut_battle0 =  En la fase de batalla,\n Los turnos del jugador y los turnos del enemigo se alternan.
tut_battle1 = Cada unidad tiene [GREEN]puntos de PA[].\n Cada acción consume un PA.
tut_battle2 = [GREEN]Barras verdes[] (aliados) y [RED]Barras rojas[] (enemigos) muestran [GREEN]HP[]. [YELLOW]Puntos[] amarillos junto a ellos muestran [YELLOW]PA[].
tut_battle2_c = [GREEN]Pasar[] el cursor sobre un personaje mostrará la información.

tut_battle3 = [YELLOW]Intenta seleccionar la unidad a la que apunta la flecha[]
tut_battle4 = [YELLOW]Los puntos amarillos[] junto a la barra de HP son [YELLOW]puntos de PA[]\n\n  Losetas sombreadas de [SKY]azul[] son el [SKY]Área Movible[] y\n\n  Losetas contorneadas en [RED]rojo[] representan objetos [RED]Atacables[].
tut_battle5 = [YELLOW]Intenta mover al personaje seleccionando la loseta sombreadas de azul a la que apunta el marcador[]
tut_battle6 = Puedes ver que [GREEN]PA[] se ha disminuido en uno.
tut_battle7 = [GREEN]Flanquear[] y [GREEN]Apuñalar por la espalda[] proporcionan bonificaciones de ataque. Además,\n\n  [GREEN]La altura[] da bonificaciones de ataque mientras que [GREEN]El nivel bajo[] da penalizaciones.
tut_battle8 = [YELLOW]¡Ahora intenta atacar al enemigo señalado por la flecha![]
tut_battle9 = ¡Bien hecho! Ten en cuenta que el enemigo [GREEN]apuñalado por la espalda con un ataque físico[] recibe [GREEN]Golpe crítico[]!

tut_trap = Trampas
tut_trap_title = Fase de batalla : Ataques a distancia
tut_trap0 = Puedes [GREEN]activar[] una trampa atacándola.
tut_trap1 = [YELLOW]Selecciona la unidad arquera a la que apunta la flecha.[]
tut_trap2_0 = [YELLOW]Mueve el cursor a la loseta indicada por la flecha.[]
tut_trap2 = Cuando [GREEN]pases[] sobre una loseta a la que puedes moverte, muestra la [GREEN]trayectoria[] para enemigos atacables, trampas, y si los enemigos pueden atacar a la unidad.\n\n[YELLOW]Mueve al arquero a la loseta a la que apunta la flecha.[]
tut_trap3 = [YELLOW]Ahora ataca el tarro al que apunta la flecha.[]
##Para usar ataques con flechas, necesitas [GREEN]flechas[]. Las flechas se reponen [GREEN]cada turno[].\n\n
tut_trap4 = ¡Bien hecho!\n\n  Ten en cuenta que [GREEN]Rayo[] causa [GREEN]daño por salpicadura[] cerca de losetas de [GREEN]agua[]\n\n  Cuando llueve, cada loseta actúa como una loseta de agua.

##Puedes ver que la [GREEN]flecha[] dibujada se usa en la esquina inferior izquierda de la pantalla.\n\n

tut_magic = Magia
tut_magic_title = Fase de batalla : Magia
tut_magic0 = Algunas habilidades necesitan [GREEN]Mana[] para usar.
tut_magic1 = Este es el punto de mana del grupo del jugador.\n  Es [GREEN]Compartido[] por todos los miembros del grupo y aumenta en cada turno.
tut_magic2 = [YELLOW]Selecciona la unidad aventurera a la que apunta la flecha.[]
tut_magic3 = [YELLOW]Mueve la unidad a la loseta a la que apunta la flecha.[]
tut_magic4 = Los números en el botón de habilidad brindan información sobre la habilidad.\n\n  [SKY]Número azul   :  Uso de mana\n  [RED]Número rojo    :  Tiempo de enfriamiento\n  [GREEN]Número verde :  Cantidad por nivel de mazmorras.
tut_magic5 = [YELLOW]Ataca el cañón con magia de Quemar.[]
tut_magic5_c = Puedes abrir el menú circular cuando [GREEN]presiones {0}[] y luego selecciona la habilidad que deseas\n\n[YELLOW]Ataca el cañón con magia de Quemar.[]
tut_magic6 = ¡Bien hecho!\n  Ten en cuenta que la hierba se incendia con la llama mágica.\n  El [GREEN]Fuego se propaga[] a losas de [GREEN]hierba[] cercanas en cada turno.

tut_delayed = Magia Retrasada
tut_delayed_title = Fase de batalla : Magia Retrasada
tut_delayed0 = Algunos hechizos mágicos se lanzan al final del turno pero son muy poderosos.
tut_delayed1 = Esta habilidad es una magia retrasada. Puedes ver el icono de [YELLOW]D[] en el botón de habilidad.
tut_delayed' = Habilidad de Desesperación
tut_delayed_title' = Habilidad de Desesperación
tut_delayed0' = Algunas habilidades necesitan [YELLOW]Medidor de furia[] para usar, pero son muy poderosas. El medidor de furia se llena cuando [YELLOW]las unidades aliadas son dañadas o asesinadas[].
tut_delayed1' = Esta habilidad es una [YELLOW]Habilidad de Desesperación[]. Puedes ver el icono de [YELLOW]D[] en el botón de habilidad.
tut_delayed2' = [YELLOW]Intenta lanzar la Habilidad de Desesperación en la loseta que está dirigiendo el marcador.[]
tut_delayed2 = [YELLOW]Intenta lanzar la Habilidad de Desesperación en la loseta que está dirigiendo el marcador.[]
tut_delayed3 = Hemos gastado todos los PA de los aliados.\n  Es hora de terminar este turno.
tut_delayed4 = [YELLOW]Presiona el botón de Terminar Turno.[]
tut_delayed5 = Ahora es el turno del enemigo...

tut_charged = Magia Cargada
tut_charged_title = Fase de batalla : Magia Cargada
tut_charged0_0 = Ahora selecciona al líder indicado por la flecha.
tut_charged0 = Algunas habilidades tienen un [GREEN]número limitado[] de usos por [GREEN]nivel de mazmorras[]. Esto generalmente se aplica a habilidades de [GREEN]sanación[], y el [GREEN]número verde[] en la [GREEN]parte superior derecha[] del botón de [GREEN]habilidad[] indica el número de cargas.
tut_charged1 = [YELLOW]Ahora usa la habilidad {0} en el Novato Arquero.[]
tut_charged2 = Bien hecho. Ahora puedes ver que el [GREEN]número de cargas[] para la habilidad {0} se ha [GREEN]disminuido[] en uno.

tut_fight = Batalla
tut_fight_title = Fase de batalla
tut_fight0 = A menudo, [GREEN]Fragmentos de alma[] aparecen en el campo de batalla.\n  Desaparecen después de unos turnos, pero se recogerán automáticamente cuando la batalla haya terminado si esta termina antes de que desaparezcan.\n  Las almas se pueden usar para mejorar conjuros mágicos, construir o mejorar edificios.
tut_fight1 = [GREEN]¡Derrota a los enemigos![]
tut_fight2 = ¡Bien!

tut_after = Subir de nivel
tut_after_title = Después de la batalla : Subir de nivel
tut_after0 = ¡Bien! Después de que la batalla haya terminado, los aliados obtienen XPs y pueden subir de nivel.
tut_after0_1 = Cuando una unidad [GREEN]sube de nivel[], gana un [GREEN]punto de habilidad[]. Cuando hay puntos de habilidad disponibles, un [RED]^[] icono aparece en el panel de la unidad.\n\n[YELLOW]Haz clic en el botón de mejora de habilidades indicado por el marcador.[]
tut_after0_1_c = Cuando una unidad [GREEN]sube de nivel[], gana un [GREEN]punto de habilidad[]. Cuando hay puntos de habilidad disponibles, un [RED]^[] icono aparece en el panel de la unidad.\n\n[YELLOW]Ahora selecciona al Aprendiz y abre la ventana de equipo.[]
tut_after0_1_2_c = [YELLOW]Ahora selecciona el nuevo botón de habilidad indicado por la flecha.[]
tut_after0_2 = Subir de nivel otorga un [GREEN]punto de habilidad[], que se puede usar para aprender nuevas habilidades. Hay dos tipos de niveles: el [GREEN]nivel[] básico de la unidad y el [GREEN]nivel de clase[]. Ambos tipos aumentan al subir de nivel, pero el [GREEN]cambio de clases reinicia[] el nivel de clase a 1.
tut_after0_3 = 1. [GREEN]Estadísticas[] aumentan los atributos básicos de la unidad y se pueden aumentar independientemente de los niveles.\n\n2. [GREEN]Habilidades básicas[] pueden ser aprendidas una vez que se cumplen los requisitos de nivel de la unidad.
tut_after0_4 = 3. Las habilidades debajo de las habilidades básicas pueden ser aprendidas cuando se cumplen los requisitos de [GREEN]nivel de clase[].\n\nSeleccionar los íconos de habilidades mostrará la información de la habilidad en la ventana de la derecha.
tut_after0_5 = Las habilidades que no puedes aprender se muestran en oscuro.\n\n[YELLOW]Selecciona la habilidad deseada y selecciona el botón de aprender indicado por la flecha.[]

tut_after1 = [YELLOW]Ahora muévete a la siguiente habitación.[]
tut_after2 = "¡Bien!"

tut_portal = Portal
tut_portal_title = El Fin de la Mazmora
tut_portal0 = Hemos llegado a la sala del objetivo.
tut_portal1 = Hay un tesoro en la sala del objetivo.
tut_portal2 = [YELLOW]¡Recoge el tesoro![]
tut_portal3 = Normalmente, te moverías a la siguiente mazmora a través de esta puerta, pero para la conveniencia del tutorial, te moverás a la sala de portales. \n\n[YELLOW]¡Ahora, muévete a la sala de portales![]
tut_portal4 = Al final de la mazmora, hay un portal que lleva al pueblo. \n\n[YELLOW] ¡Muévete al portal![]
tut_portal5 = Bien hecho. ¡Este es tu pueblo!
tut_portal6 = Al final de la mazmora, hay estatuas donde puedes [GREEN]Curar[] a tus aliados y [GREEN]Cambiar clases[]. Para proceder a la siguiente mazmora, debes usar la estatua de curación.
tut_portal7 = Si no deseas curar, puedes obtener una piedra de alma de la estatua en su lugar.\n\n[YELLOW]Selecciona y activa la estatua a la que apunta la flecha.[]

tut_portal8 = Para cambiar de clases, usa el [GREEN]altar de cambio de clase[] en la mazmora o construye uno en el pueblo.\n\n[YELLOW]Selecciona al Aprendiz indicado por la flecha y activa el altar de cambio de clase.[]
tut_portal9 = Para cambiar de clases, el [GREEN]nivel de clase[] debe estar por encima de un umbral específico.\n[RED]Nota[]: Para cambiar de clases, no debes tener puntos de habilidad restantes.\n\n[YELLOW]Selecciona el botón de Mago Elemental y luego selecciona el botón de cambiar clase.[]

tut_town = Pueblo
tut_town_title = Estado del Pueblo
tut_town0 = Esta es la fase del pueblo. Puedes construir o mejorar edificios aquí.
tut_town1 = Puedes abrir la ventana de información seleccionando este edificio.
tut_town2 = [YELLOW]¡Intenta seleccionar el edificio![]
