ARMOR_MASTERY_long_desc = *Penalización de Armadura: La armadura pesada con estadísticas de defensa por lo general lleva penalizaciones como reducción de Inteligencia o Agilidad. Un mayor dominio en armaduras reduce estas penalizaciones. Algunas armaduras tienen una propiedad de “Sin Penalización”, permitiendo que sean equipadas incluso con bajo dominio, pero el multiplicador de defensa de dominio de armaduras aún se aplica, resultando en una defensa efectiva menor.\n\nCantidad: Multiplicador de Defensa (%): Multiplicado por la estadística de defensa de la armadura.\nReducción: Multiplicador de Penalización (%): Multiplicado por el valor de penalización de la armadura.
