quest_mode_introduction = Introducción
# Features and introduction
quest_mode_intro1=Eres el descendiente de un pequeño señor de pueblo que ha escuchado la historia de un demonio sellado que amenaza al mundo. Al llegar al pueblo, debes desarrollar el pueblo, contratar mercenarios para encontrar y desbloquear el sello, y derrotar al demonio desatado.\n\nCaracterísticas del Modo Misión:\n\n1. A diferencia del Modo Mazmorras, no hay líder, y aunque todos los compañeros mueran durante la batalla, el juego no termina.\n2. Las mazmorras en este modo vienen en dos tipos:\n   - Mazmorras de exploración\n   - Mazmorras de caza\n\n   Completar mazmorras de exploración aumentará la dificultad del mundo (dificultad del juego), y debes derrotar al jefe en la región para desbloquear el sello eventualmente.\n\n   Las mazmorras de caza se pueden usar para fomentar a tus mercenarios.
# Gameplay and objective
quest_mode_intro2=Jugabilidad:\n\n1. Construcción de la Aldea: Puedes construir edificios en el pueblo.\n2. Contratar Compañeros: Contrata compañeros en la taberna.\n3. Selección de Misiones: Elige misiones de la guilda.\n4. Mover a las Ubicaciones de Batalla: Muévete a las ubicaciones de batalla a través del portal.\n\nObjetivo del Juego:\n- El objetivo del juego es limpiar todas las mazmorras de exploración, desbloquear los sellos y derrotar al demonio desatado.\n\n¡Te deseamos una aventura exitosa!

fix_head: Bloquear la Cabeza
fix_head_desc: Mantiene la cabeza y las partes del accesorio de la cabeza sin cambios al promover.

fix_upper: Bloquear Cuerpo Superior
fix_upper_desc: Mantiene la parte superior del cuerpo sin cambios al promover.

fix_lower: Bloquear Cuerpo Inferior
fix_lower_desc: Mantiene la parte inferior del cuerpo sin cambios al promover.

