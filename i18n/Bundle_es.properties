# Ranger bad ending
bad_ending_text_RangerParty0 = Mientras el ranger obtenía el amuleto, su pasado parpadeó por su mente. Una vez había sido el príncipe heredero del imperio, pero tras la muerte del emperador, al tratar de estabilizar la caótica situación política, fue gravemente herido por la traición de un asistente cercano y perdió sus recuerdos. Regresó al imperio y se convirtió en emperador, unificando finalmente el mundo, pero fue una historia escrita en sangre. A pesar de tener el poder supremo, todo lo que quedaba en su corazón era el constante miedo de que pudiera ser traicionado una vez más y perderlo todo.

# Added (251226)

ATTACK_STAT = Estadística de Ataque
ATTACK_STAT_desc = Estadísticas relacionadas con los ataques.
ATTACK_STAT_long_desc = \
* Ataques de Armas y Ataques de Habilidades\n\
\ - [Ataque de Arma]: Un ataque cuyo daño y precisión escalan con las estadísticas base del arma.\n\
\ - [Ataque de Habilidad]: Un ataque que no utiliza un arma y tiene su propio daño y precisión base para cada habilidad.\n\n\
* Ataques Mágicos y Ataques Físicos\n\
\ - [Ataque Mágico]: Un ataque que inflige daño mágico y no se ve afectado por diferencias de altura o dirección.\n\
\ - [Ataque Físico]: Un ataque que inflige daño físico y se ve afectado por diferencias de altura y dirección. Se divide en [Ataques Físicos Melé] y [Ataques Físicos a Distancia].

DAMAGE = Daño
DAMAGE_desc = El valor numérico del daño infligido por cada ataque.
DAMAGE_formula = \
[GREEN]*[] Ataque Físico -> [Daño Base] x (100 - [Defensa]) / 100\n\
[GREEN]*[] Ataque Mágico -> [Daño Base] x [Maestría Mágica] / 100 x (1 + [INT] x 0.04) x (1 - [Protección Mágica] / 100) x [Mod. Ambiental %] / 100 x [Mod. de Alineación]

BASE_DAMAGE = Daño Base
BASE_DAMAGE_formula = \
[GREEN]*[] Ataque de Arma Melé -> [Daño de Arma] x [Porcentaje de Daño de Habilidad] / 100 x [Mod. de Maestría de Arma] / 100 x (1 + [STR] x 0.04)\n\
[GREEN]*[] Ataque de Arma a Distancia -> [Daño de Arma] x [Porcentaje de Daño de Habilidad] / 100 x [Mod. de Maestría de Arma] / 100 x (1 + [DEX] x 0.04)\n\
[GREEN]*[] Ataque de Habilidad Física Melé -> [Daño de Habilidad] x (1 + [STR] x 0.04)\n\
[GREEN]*[] Ataque de Habilidad Física a Distancia -> [Daño de Habilidad] x (1 + [DEX] x 0.04)\n\
[GREEN]*[] Ataque de Habilidad Mágica -> [Daño de Habilidad]

WEAPON_DAMAGE = Daño de Arma
WEAPON_DAMAGE_desc = El valor base de daño que figura en cada arma.
SKILL_DAMAGE = Daño de Habilidad
SKILL_DAMAGE_desc = El valor de daño indicado en la descripción de cada habilidad.
SKILL_DAMAGE_PERCENT = Porcentaje de Daño de Habilidad
SKILL_DAMAGE_PERCENT_desc = El porcentaje de daño que figura en la descripción de cada habilidad.

WEAPON_MASTERY = Maestría de Arma
WEAPON_MASTERY_desc = Representa la competencia con cada arma y afecta el daño y la precisión del ataque con armas.
MAGIC_MASTERY = Maestría Mágica
MAGIC_MASTERY_desc = Un valor de maestría basado en el atributo de cada ataque mágico y afecta el daño y la precisión de ataques mágicos.
MAGIC_PROTECTION = Protección Mágica
MAGIC_PROTECTION_desc = Un valor de defensa que varía según el tipo de daño mágico. Reduce el daño mágico en el porcentaje indicado.
ENV_DAM_MODIFIER = Mod. Ambiental
WEAPON_MASTERY_short = Maest Arm
MAGIC_MASTERY_short = Maest Mág
MAGIC_PROTECTION_short = Prot Mág
ENV_DAM_MODIFIER_short = Mod Amb
ENV_DAM_MODIFIER_formula =\
Magia de Fuego: En agua -> 0.5, Clima cálido -> 1.25, Clima frío -> 0.75\n\
Magia de Hielo: Clima cálido -> 0.75, Clima frío -> 1.25
ALIGN_MODIFIER = Mod. de Alineación
ALIGN_MODIFIER_formula = Magia Oscura -> 1 - 0.0625 x [Alineación]\nMagia Sagrada -> 1 + 0.0625 x [Alineación]
HEIGHT_DAM_MODIFIER = Mod. de Altura
HEIGHT_DAM_formula = 1 - 0.25 x [Diferencia de Altura]

HIT_RATE = Precisión
HIT_RATE_desc = La probabilidad por ciento de que cada ataque acierte.

PHY_ACC = Precisión Física
PHY_ACC_formula = [Precisión Base] x [Mod. Ambiental] x [Mod. de Altura] x [Mod. de Dirección]

BASE_ACC = Precisión Base
BASE_ACC_formula =\
[GREEN]*[] Ataque de Arma Física -> [Precisión de Arma] x [Porcentaje de Precisión de Habilidad] x (1 + [DEX] x 0.04) x [Mod. de Maestría de Arma] / 100\n\
[GREEN]*[] Ataque de Habilidad Física -> [Precisión de Habilidad] x (1 + [DEX] x 0.04)\n\
[GREEN]*[] Ataque de Arma Mágica -> [Precisión de Arma] x [Porcentaje de Precisión de Habilidad] x [Mod. de Maestría de Arma] / 100\n\
[GREEN]*[] Ataque de Habilidad Mágica -> [Precisión de Habilidad]

WPN_ACC = Precisión de Arma
WPN_ACC_desc = El valor de precisión inherente al arma.

SKILL_ACC = Precisión de Habilidad
SKILL_ACC_desc = La precisión base del ataque de una habilidad.

SKILL_ACC_PERCENT = Porcentaje de Precisión de Habilidad
SKILL_ACC_PERCENT_desc = Un multiplicador de precisión aplicado a la precisión del arma por el ataque de una habilidad.

ENV_ACC_MODIFIER = Mod. Ambiental
ENV_ACC_MODIFIER_formula = \
Cuando llueve, los ataques físicos a distancia -> 0.75\n\
De lo contrario -> 1

HEIGHT_ACC_MODIFIER = Mod. de Altura
HEIGHT_ACC_formula = 1 - [Diferencia de Altura] x 0.1

FACING_ACC_MODIFIER = Mod. de Dirección
FACING_ACC_MODIFIER_formula = \
[GREEN]*[] Ataque Melé -> Lateral -> 1.15\n\
[GREEN]*[] Parte Posterior -> 1.30\n\
[GREEN]*[] Ataque a Distancia -> Parte Posterior -> 1.25

CRIT = Tasa Crítica
CRIT_short = Crít
CRIT_desc = La probabilidad de que ocurra un golpe crítico cuando un ataque acierta.
CRIT_long_desc = Los golpes críticos solo se aplican a ataques físicos. Cuando ocurre un golpe crítico, generalmente inflige el 150% del daño final, pero este valor puede aumentar dependiendo de las habilidades o rasgos de la unidad.
CRIT_formula =\
[GREEN]*[] Ataque de Arma -> [Crítico de Arma] x [Porcentaje de Crítico de Habilidad] / 100 x [Mod. de Altura] x [Mod. de Dirección]\n\
[GREEN]*[] Ataque de Habilidad -> [Crítico de Habilidad] x [Mod. de Altura] x [Mod. de Dirección]

