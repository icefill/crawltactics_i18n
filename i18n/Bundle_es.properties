continue_or_restart_battle_quest_message = ¿Deseas usar vidas para continuar o reiniciar la batalla?\n\nContinuar: Resucitar aliados y continuar la batalla.\nReiniciar: Volver al inicio de la batalla y reiniciar.\nDeclinar: Abandonar la batalla actual y volver al pueblo.
restart_battle_message = ¿Deseas reiniciar la batalla?\n\nReiniciar: Volver al inicio de la batalla y reiniciar.\nAbandonar: Abandonar el juego actual y fin del juego.
