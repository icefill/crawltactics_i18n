HIT_RATE_long_desc =\
Si un ataque acierta se determina por la precisión, y el resultado varía según el tipo de ataque.\n\
Los ataques físicos pueden seguir siendo [Bloqueados] después de que un chequeo de acierto tenga éxito.\n\
Si un ataque físico falla en dar, será Esquivado según la chance de [Esquivar].\n\
Si no se esquiva, los ataques cuerpo a cuerpo se convierten en [Rozados], y los ataques a distancia se convierten en [Fallidos].\n\
Si un ataque mágico acierta, inmediatamente causa daño.\n\
Si un ataque mágico falla en dar, el objetivo [Resiste].\n\n\
[GREEN][Rozar][]: Causa 1/2 del daño original\n\
[GREEN][Fallido][]: No causa daño\n\
[GREEN][Resistir][]: Causa 1/3 del daño original

HIT_RATE_formula =\
[GREEN]*[] Ataque Mágico -> [Precisión Base]\n\
[GREEN]*[] Ataque Físico -> [Precisión Física] x (1 - [Esquivar] / 100) x (1 - [Bloquear] / 100)

