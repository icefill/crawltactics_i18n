new_class_type = Nuevo Enemigo de Clase

tip_fire_title = Nuevo Efecto de Terreno: Fuego
tip_fire_text0 = El tile indicado por el marcador está en llamas. Si se aplica daño de fuego a un tile con hierba, se incendia. Sin embargo, el fuego no se propaga a tiles con charcos.
tip_fire_text1 = Una vez que un tile se incendia, se propagará a tiles adyacentes con hierba y una diferencia de altura de 1 o menos en el siguiente turno, mientras que el fuego en el tile original se extinguirá.

tip_soul_crystal_text0 = Un [GREEN]fragmento de alma[] ha aparecido. Los fragmentos de alma [GREEN]aparecen aleatoriamente[] en el campo de batalla y otorgan [GREEN]2 almas[] como recursos cuando son recogidos. Los fragmentos de alma son [GREEN]obtenidos automáticamente[] al [GREEN]final de combate[], pero de lo contrario, [GREEN]desaparecerán después de unos turnos[].

tip_SpecialEnemy_title = Enemigos Especiales
tip_SpecialEnemy_text0 = Algunos enemigos tienen [GREEN]iconos especiales[] sobre sus barras de HP. Estos enemigos tienen [GREEN]rasgos notables[], como contraatacar, bonos de terreno, o beneficios de zona de control.
tip_SpecialEnemy_text1 = [GREEN]Hovering over[] estas unidades mostrará [GREEN]información[] sobre sus rasgos.
tip_SpecialEnemy_text2 = Si tienen múltiples rasgos, presiona el botón [GREEN]{0}[] mientras pasas el ratón para [GREEN]cambiar entre[] la información de los rasgos.

tip_elemental_jar_title = Tarro Elemental
tip_elemental_jar_text0 = Los objetos indicados por el marcador son tarros elementales. Los tarros elementales rompen y causan [GREEN]daño[] del [GREEN]tipo elemental[] correspondiente cuando son [GREEN]dañados[] o activados con habilidades como Telequinesis.
tip_elemental_jar_text1 = Cada tarro elemental tiene un [GREEN]rango de daño diferente[] y [GREEN]patrón[] dependiendo de su elemento, así que ten cuidado.
tip_elemental_jar_text2 = Los tarros de [PINK]Fuego[] causan daño por fuego a los [PINK]8 tiles circundantes[], mientras que los tarros de [YELLOW]rayos[] liberan rayos encadenados que [YELLOW]siguen un camino[].
tip_elemental_jar_text3 = Los tarros de [SKY]Hielo[] causan daño por hielo a los 8 tiles circundantes e infligen [SKY]congelamiento[], mientras que los tarros de [GREEN]veneno[] causan daño por veneno y crean una [GREEN]nube de veneno[] en los 8 tiles circundantes.
tip_elemental_jar_text4 = Los tarros de [GRAY]Oscuridad[] crean [GRAY]Manos de la Muerte[] en los 8 tiles circundantes, impidiendo que los enemigos se muevan.

tip_ArmorCrushed_text0 = La unidad indicada por el marcador está actualmente en un estado de [GREEN]Armadura Destrozada[]. En este estado, la estadística de [GREEN]defensa[] de la [GREEN]armadura[] está temporalmente reducida. Esta condición ocurre al recibir un golpe de un arma contundente.\n Las armas cuerpo a cuerpo tienen diferentes características.
  #[GREEN]Las Espadas[] tienen [GREEN]alta precisión[], los [GREEN]hachas[] tienen una alta tasa de [GREEN]golpe crítico[], y los [GREEN]garrotes[] pueden causar [GREEN]Armadura Destrozada[].

tip_trap_obj_general_text0 = El marcador actualmente apunta a un nuevo objeto trampa [GREEN]{0}[]
tip_floor_trap_general_text0 = El marcador actualmente apunta a una nueva trampa de suelo [GREEN]{0}[]

prologue_text_amulet0 = El Amuleto de Ecillif, una reliquia con inmenso poder, ha estado envuelto en misterio por siglos. Según la leyenda, este amuleto puede otorgar a su portador un poder inmenso, riqueza enorme, o incluso la habilidad de resucitar a los muertos. Un día, comenzaron a circular rumores de que este artefacto, una vez desestimado como mera superstición, realmente existía. Varios aventureros emprendieron viajes para encontrar este artefacto, motivados por sus propios deseos y anhelos.
ending_text_general0 = Finalmente, {0} derrotó al dios maligno Nog. Sus esbirros desaparecieron en ese momento. Nog escupió sangre negra y dejó caer su cabeza, y los alrededores se cubrieron de un humo inquietante y lamentos extraños. Cuando el humo se disipó, un tentáculo rojo brotó de donde había estado la cabeza de Nog, emitiendo un brillo dorado, pero en el centro había un amuleto con una gema roja y amarilla que parecía un ojo que brilla, flotando en el aire. {0} sostuvo el Amuleto de Ecillif.
prologue_text_AdventurerParty0 = El aventurero es alguien que disfruta de nuevos mundos y libertad en lugar de riqueza o fama. Durante un viaje anterior, se quedó atrapado en una mazmorras profunda, pero después de derrotar a un demonio resucitado al fondo, escapó y encontró un mapa desconocido. Más tarde, tuvo un sueño donde vio un ejército de los muertos invadiendo el mundo humano desde el norte, y recibió una revelación de que solo la reliquia indicada por el mapa podría detenerlo.
good_ending_text_AdventurerParty0 = El aventurero, sintiendo una aura siniestra del amuleto, decidió ocultarlo después de mucha contemplación. Gracias a sus acciones, el mundo disfrutó de paz y prosperidad, pero regresó silenciosamente de su viaje, soñando con nuevos mundos.
bad_ending_text_AdventurerParty0 = El aventurero fue tentado por el inmenso poder del amuleto y buscó obtener gran fuerza usándolo. Un humo siniestro envolvió el amuleto, y mientras ganaba poder más allá del tiempo, su mente y cuerpo se deterioraron. Se convirtió en el líder de la pesadilla que había tratado de prevenir, destruyendo el mundo humano con su ejército.
prologue_text_MageParty0 = El mago es un joven prodigio experto en magia antigua. Después de perder a su amada, perdió todas las emociones y voluntad, retirándose del mundo a la soledad. Un día, mientras leía textos antiguos, aprendió sobre el Amuleto de Ecillif y llegó a creer que podría revivir a su difunta amante. Obteniendo un atisbo de esperanza, se embarcó en un viaje para encontrar el amuleto.
good_ending_text_MageParty0 = Justo cuando el mago estaba a punto de usar el amuleto para revivir a su amante, escuchó su voz en su mente. Recordó la advertencia de su maestro de que desafiar el orden natural traería grandes consecuencias. Sintiendo la aura siniestra, decidió buscar a su maestro para encontrar una manera de destruir el amuleto.
bad_ending_text_MageParty0 = Consumido por su deseo de revivir a su amante, el mago conjuró un hechizo mientras sostenía el amuleto. Las tinieblas envolvieron los alrededores, y la imagen de su amante apareció del amuleto, pero pronto se distorsionó. Tentáculos afilados cortaron las manos del mago. Paralizado por el miedo, vio cómo la forma retorcida pasaba lentamente junto a él.
prologue_text_KnightParty0 = El caballero era un líder respetado de la orden sagrada que protegía al rey. Un día, en un banquete real, vio una visión de un ángel presentando un amuleto al rey. La visión desapareció, pero todos en el banquete vieron la misma visión, interpretándola como una señal de que el amuleto traería paz y prosperidad al reino. Con firme convicción, el caballero emprendió esta misión sagrada.
good_ending_text_KnightParty0 = El caballero trajo el Amuleto de Ecillif al reino. Al darse cuenta de su peligroso poder, persuadió al rey de guardarlo en un templo oculto dentro del reino, asegurando que nadie pudiera abusar de él. El caballero se convirtió en un símbolo legendario de honor y fe, y su leyenda fue alabada durante generaciones.
bad_ending_text_KnightParty0 = El caballero trajo el Amuleto de Ecillif al reino, pero ya había sido corrompido por su poder. En el momento en que lo presentó al rey, mató al rey y usó el poder del amuleto para gobernar el reino. Su nombre se volvió sinónimo de tiranía y traición durante mucho tiempo.
prologue_text_RangerParty0 = El explorador protege el bosque y su pueblo, habiendo perdido todos sus recuerdos debido a la amnesia. Aparenta ser frío por fuera pero tiene un corazón amable. Una noche, tuvo un sueño donde una voz misteriosa le dijo que encontrara el Amuleto de Ecillif. Creyendo que el amuleto podría ayudarle a recuperar su pasado perdido, se embarcó en un viaje para descubrir su verdadero ser.
good_ending_text_RangerParty0 = El explorador se dio cuenta de que el amuleto traería más daño que bien y lo ocultó para evitar que alguien lo usara mal. Ya no se aferró a su pasado y continuó guiando y protegiendo a la gente. Su sabiduría y amabilidad inspiraron a muchos.

prologue_text_NecromancerPlayerParty0 = El nigromante es una figura enigmática envuelta en los misterios de la magia oscura. Desde hace tiempo buscaba conocimiento prohibido. Recientemente, se enteró de un antiguo ritual que involucra el Amuleto de Ecillif. A través de este ritual, podría controlar la vida y la muerte misma. En busca del poder supremo, emprendió su peregrinación oscura.
good_ending_text_NecromancerPlayerParty0 = A través de sus viajes, el nigromante se dio cuenta de la importancia del equilibrio entre la vida y la muerte y eligió destruir el amuleto. El poder maligno del amuleto drenó todas sus habilidades mágicas, pero su acto desinteresado salvó su alma, y se convirtió en un sabio dedicado a lograr la armonía entre la vida y la muerte. Fue respetado por su profunda comprensión del orden natural.
bad_ending_text_NecromancerPlayerParty0 = Usando magia oscura, fusionó el amuleto en su pecho, fusionándolo con su cuerpo. Se convirtió en un ser inmortal, ni muerto ni vivo. A medida que su conciencia se desvanecía, creyó que valía la pena. Al perder su sentido de sí mismo, levantó un ejército imparable de no-muertos y conquistó el reino, sumergiendo al mundo en la oscuridad.
prologue_text_RogueParty0 = El pícaro, un maestro del sigilo y el engaño, vive en las sombras, siempre trabajando solo sin aliados. A través de un mensaje secreto decodificado obtenido durante una persecución, se enteró del Amuleto de Ecillif. Creyó que podría liberarlo de su pasado, sus enemigos y su destino. Impulsado por el deseo de liberación, emprendió una misión peligrosa.
good_ending_text_RogueParty0 = El pícaro obtuvo el amuleto pero se dio cuenta de que la verdadera libertad solo podía lograrse a través de su propia fuerza, así que ocultó el amuleto. Dejó de trabajar solo y se convirtió en un héroe que liberó a los oprimidos, liderando una red de rebeldes que luchan por la libertad. Su astucia y habilidades lo convirtieron en la última esperanza de la resistencia.
bad_ending_text_RogueParty0 = Usó el amuleto para manipular y controlar a otros, dominando el inframundo y convirtiéndose en un temido jefe criminal. Aunque buscaba libertad, terminó atrapado por su propio destino.
prologue_text_CustomParty0 = Entre los muchos grupos que buscan el amuleto, un grupo de aventureros se embarcó. Buscaban el Amuleto de Ecillif para determinar su destino.
good_ending_text_CustomParty0 = El grupo de {0} obtuvo el Amuleto de Ecillif. Reconociendo el inmenso y peligroso poder del amuleto, {0} decidió no usarlo. Ocultaron el amuleto donde nadie pudiera encontrarlo. Sus acciones trajeron estabilidad al mundo. Vivieron vidas tranquilas y sus nombres permanecieron desconocidos.
bad_ending_text_CustomParty0 = {0} llevó el amuleto alrededor de su cuello. Sintió una oleada de inmenso poder. En ese momento, una luz siniestra apareció en sus ojos. Usando el poder del amuleto, mató a muchos adversarios y conquistó el reino. Sin nadie que se oponga a él, {0} temía la traición. Eliminó incluso a sus compañeros y familiares que habían estado con él durante mucho tiempo. Las voces de aquellos que había matado resonaban constantemente en su mente.
prologue_text_DebugParty0 = Entre los muchos grupos que buscan el amuleto, un grupo de aventureros se embarcó. Buscaban el Amuleto de Ecillif para determinar su destino.
good_ending_text_DebugParty0 = El grupo de {0} obtuvo el Amuleto de Ecillif. Reconociendo el inmenso y peligroso poder del amuleto, {0} decidió no usarlo. Ocultaron el amuleto donde nadie pudiera encontrarlo. Sus acciones trajeron estabilidad al mundo. Vivieron vidas tranquilas y sus nombres permanecieron desconocidos.
bad_ending_text_DebugParty0 = {0} llevó el amuleto alrededor de su cuello. Sintió una oleada de inmenso poder. En ese momento, una luz siniestra apareció en sus ojos. Usando el poder del amuleto, mató a muchos adversarios y conquistó el reino. Sin nadie que se oponga a él, {0} temía la traición. Eliminó incluso a sus compañeros y familiares que habían estado con él durante mucho tiempo. Las voces de aquellos que había matado resonaban constantemente en su mente.
prologue_text_SergeantParty0 = Entre los muchos grupos que buscan el amuleto, un grupo de aventureros se embarcó. Buscaban el Amuleto de Ecillif para determinar su destino.
good_ending_text_SergeantParty0 = El grupo de {0} obtuvo el Amuleto de Ecillif. Reconociendo el inmenso y peligroso poder del amuleto, {0} decidió no usarlo. Ocultaron el amuleto donde nadie pudiera encontrarlo. Sus acciones trajeron estabilidad al mundo. Vivieron vidas tranquilas y sus nombres permanecieron desconocidos.
bad_ending_text_SergeantParty0 = {0} llevó el amuleto alrededor de su cuello. Sintió una oleada de inmenso poder. En ese momento, una luz siniestra apareció en sus ojos. Usando el poder del amuleto, mató a muchos adversarios y conquistó el reino. Sin nadie que se oponga a él, {0} temía la traición. Eliminó incluso a sus compañeros y familiares que habían estado con él durante mucho tiempo. Las voces de aquellos que había matado resonaban constantemente en su mente.

prologue_text_NobleParty0 = El noble fue una vez el último descendiente de una familia próspera. Heredó las tierras de sus antepasados, ahora desoladas. Vio la realidad de la caída de su familia y la ruina de la hacienda, y resolvió comenzar una nueva vida. La esperanza de restaurar la gloria de su familia al obtener un amuleto legendario nunca lo abandonó. Se encontró solo en el vacío pueblo y comenzó su viaje para encontrar el amuleto y reconstruir su hacienda.
good_ending_text_NobleParty0 = {0} obtuvo el amuleto pero sintió una repentina desconfianza hacia el poder misterioso que contenía. Se dio cuenta de que aunque el amuleto podría restaurarlo todo, el costo sería igualmente grande. Finalmente decidió no usar el poder del amuleto y en su lugar reconstruir la hacienda con la ayuda de sus aliados, restaurando el honor de su familia una vez más.
bad_ending_text_NobleParty0 = {0} intentó revivir la hacienda usando el poder del amuleto, pero pronto emergió un aura oscura, llevando las vidas de los habitantes de la hacienda uno por uno. Sus almas fueron absorbidas por el amuleto y la tierra se transformó en un reino de oscuridad desprovisto de vida. Ahora solo no-muertos sin alma vagan, con el noble reinando solo sobre su tierra arruinada como un oscuro señor. Su ambición permaneció como una maldición con el amuleto, dejando una oscuridad eterna que nunca se desvanecería.

quest_ending_text_general0 = Finalmente has roto todos los siete sellos, derrotado al demonio resucitado y restaurado el pueblo al llevar a cabo la voluntad del antiguo señor y vanquiendo todas las fuerzas del mal. Justo cuando estabas a punto de encontrar alivio, el lamento pesadilla del demonio derrotado resuena, y una aura siniestra se cierne. Por alguna razón, la presencia del mal ha regresado, y tú y tus mercenarios deben prepararse para defender el pueblo y enfrentar la batalla final sin un momento de descanso.

