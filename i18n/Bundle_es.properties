tut_intro = Introducción
tut_intro_title = Introducción
tut_intro0 = ¡Bienvenido!\n\n  Esta es una explicación de los elementos básicos de Crawl Tactics.\n\n  Presiona el botón [GREEN]Continuar[] para continuar
tut_intro1 = Presiona [GREEN]Reintentar[] si deseas intentar de nuevo o si algo salió mal.\n\n Presiona el botón [GREEN]Omitir[] si deseas omitir el contenido actual.\n\n Presiona el botón [GREEN]Siguiente[] para pasar a la siguiente sección.
tut_intro2 = Presiona [GREEN]{0}[] o el [GREEN]icono de engranaje[] para abrir el menú.\n Desde allí, puedes seleccionar [GREEN]Entradas del Tutorial[], cambiar [GREEN]Configuraciones[], o [GREEN]Salir del Juego[].\n Fuera del tutorial, salir del juego resultará en un [GREEN]guardado automático[].
tut_intro1_c = Presiona [GREEN]{0}[] o el botón de cancelar ([GREEN]{1}[]) cuando no hay nada que cancelar para abrir el menú.\n Desde aquí, puedes seleccionar la opción [GREEN]Tutorial[], cambiar la [GREEN]Configuración[], o [GREEN]Salir del juego[].\n Al salir fuera del tutorial, el juego se [GREEN]guardará automáticamente[].

tut_intro1_c' = Cuando no se selecciona nada, presionar [GREEN]{0}[] abrirá el menú.\n Desde aquí, puedes seleccionar la opción [GREEN]Tutorial[], cambiar la [GREEN]Configuración[], o [GREEN]Salir del juego[].\n\n Al salir fuera del tutorial, el juego se [GREEN]guardará automáticamente[].

tut_intro2_t = Presiona el [GREEN]icono de engranaje[] para abrir el menú.\n Desde allí, puedes seleccionar [GREEN]Entradas del Tutorial[], cambiar [GREEN]Configuraciones[], o [GREEN]Salir del Juego[].\n Fuera del tutorial, salir del juego resultará en un [GREEN]guardado automático[].

