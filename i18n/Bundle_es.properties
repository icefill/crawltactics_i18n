# In Game Tips

tip_BasicWeather_title = Clima/Temperatura
tip_BasicWeather_text0 = La temperatura y el clima varían de acuerdo con el ecosistema de cada mazmorras.\n La temperatura se clasifica como [GREEN]caliente/normal/fría[] y permanece constante para cada mazmorras, mientras que la probabilidad de lluvia se determina y cambia al moverte de habitación a habitación.
tip_BasicWeather_text1_c = Puedes comprobar el clima y la temperatura actuales a través del [GREEN]icono[] indicado por el marcador en la esquina [GREEN]superior derecha[].
tip_BasicWeather_text1 = Puedes comprobar el clima y la temperatura actuales a través del [GREEN]icono[] indicado por el marcador en la esquina [GREEN]superior derecha[]. Pasa el cursor sobre el icono para ver más información.

tip_Rain_title = Clima: Lluvia
tip_Rain_text0 = A menos que sea un ecosistema de lluvia constante, la lluvia ocurre con cierta probabilidad [GREEN]al entrar en una nueva habitación[] y se detiene al salir de la habitación.
tip_Rain_text1 = Cuando llueve, la [GREEN]precisión de las flechas/balas[] disminuye. Además, los [GREEN]fuegos[] en el campo de batalla son [GREEN]apagados[] y [GREEN]las nubes de veneno desaparecen[].
tip_Rain_text2 = Además, se forman charcos en el campo de batalla, causando el estado de [GREEN]pies congelados[] (inmovilizado) cuando se golpea con [GREEN]magia de hielo[] y recibiendo [GREEN]daño extra[] y [GREEN]daño por salpicadura[] al ser golpeado por [GREEN]magia de rayo[].
tip_Snow_title = Clima: Nieve
tip_Snow_text0 = Al igual que la lluvia, la nieve ocurre con una cierta probabilidad al entrar en una nueva habitación y se detiene al salir de la habitación a menos que sea un ecosistema constantemente nevado.
tip_Snow_text1 = Cuando nieva, la [GREEN]precisión de las flechas[] disminuye. Además, los [GREEN]fuegos[] en el campo de batalla son [GREEN]apagados[] y los [GREEN]nubes de veneno desaparecen[].
tip_Snow_text2 = Cuando el clima se calienta, la nieve se convierte en lluvia.

tip_Hot_title = Temperatura: Calor
tip_Hot_text0 = La temperatura se mantiene constante a lo largo de la mazmorras de acuerdo al ecosistema.
tip_Hot_text1 = En clima [GREEN]caliente[], la [GREEN]magia de fuego[] causa [GREEN]más[] daño, y la [GREEN]magia de hielo[] causa [GREEN]menos[] daño.
tip_Hot_text2 = Además, cualquier [GREEN]charcos[] que se formen [GREEN]desaparecen[] en el siguiente turno.

tip_Cold_title = Temperatura: Frío
tip_Cold_text0 = La temperatura se mantiene constante a lo largo de la mazmorras de acuerdo al ecosistema.
tip_Cold_text1 = En clima [GREEN]frío[], la [GREEN]magia de hielo[] causa [GREEN]más[] daño, y la [GREEN]magia de fuego[] causa [GREEN]menos[] daño.
tip_Cold_text2 = Además, al ser golpeado por [GREEN]magia de hielo[], hay un 100% de probabilidad de ser afectado por [GREEN]congelado[].

new_trap = Nueva Trampa

tip_trap_title = Objetos de Trampa
tip_trap_text0 = Los objetos trampa son ítems colocados aleatoriamente en el campo de batalla que causan daño o activan acciones como explosiones o disparar proyectiles cuando se activan. Una vez activados, se destruyen y pueden ser empujados o lanzados como otros objetos.
tip_trap_text1 = Cuando son dañados, necesariamente se destruyen, pero trampas como cañones o torretas de perno disparan proyectiles hasta tres veces antes de desaparecer.

tip_device_title = Trampas de Suelo
tip_device_text0 = Las trampas de suelo, como trampas de pinchos o trampas de hierba, se colocan en el suelo y son [GREEN]activadas[] solo cuando una unidad se mueve y [GREEN]se detiene sobre[] ellas. Una vez [GREEN]activadas[], son [GREEN]destruidas[].
tip_device_text1 = Puedes [GREEN]empujar[] enemigos cercanos sobre ellas para infligir daño.\n También hay dispositivos como Fuentes de Maná y Fuentes de Rabia que brindan beneficios a las unidades cuando se mueven sobre ellas.

tip_corpse_title = Cadáveres
tip_corpse_text0 = El marcador actualmente apunta a un cadáver. Cuando una unidad muere, se deja un cadáver en su lugar. Si se inflige [GREEN]daño oscuro[] al cadáver, causa [GREEN]daño de salpicadura oscura[] a los [GREEN]4 tiles[] circundantes.
tip_corpse_text1 = Ten cuidado con unidades de tipo [GREEN]no-muerto[] ya que pueden [GREEN]resucitar[] después de un cierto número de turnos si su cadáver permanece. Puedes [GREEN]eliminar[] un cadáver usando una [GREEN]poción de curación[] o [GREEN]magia de curación[] o [GREEN]magia de fuego[] en el tile donde está el cadáver.
tip_corpse_text2 = Lo mismo se aplica a las unidades aliadas; sus cadáveres permanecen si mueren. Puedes revivir a un aliado muerto usando una [GREEN]poción de resurrección[], y algunos hechizos también pueden hacerlo.
tip_corpse_text3 = Si muere el [GREEN]líder[] de un aliado y su [GREEN]cadáver no puede ser resucitado[], resulta en [GREEN]game over[].

tip_SPECIAL_EVENT_title = Tipo de Sala: Misión
tip_SPECIAL_EVENT_text0 = Esta sala contiene una misión. A diferencia de los eventos regulares, las misiones tienen [GREEN]unidades especiales[] o [GREEN]objetos[], y puedes lograr resultados a través de [GREEN]elecciones[].

tip_CREEP_title = Tipo de Sala: Criaturas
tip_CREEP_text0 = Has llegado a la sala de criaturas. Las criaturas son monstruos sin inteligencia que [GREEN]siempre lucharán[] cuando vean al grupo del jugador.

tip_HOSTILE_EVENT_title = Tipo de Sala: Grupo Hostil
tip_HOSTILE_EVENT_text0 = Has llegado a la sala de [GREEN]grupo hostil[]. Ellos comercian [GREEN]bienes a precios más altos[] o [GREEN]exigen tributos[] para evitar el combate. No [GREEN]puedes pasar[] sin tomar una decisión.

tip_NEUTRAL_EVENT_title = Tipo de Sala: Grupo Neutral
tip_NEUTRAL_EVENT_text0 = Has llegado a la sala de [GREEN]grupo neutral[]. Puedes [GREEN]comerciar bienes[] con ellos. Puedes [GREEN]atacar primero para iniciar combate[], pero tu []puntuación de alineación[] [GREEN]disminuirá[].

tip_HIRE_EVENT_title = Tipo de Sala: Contratación de Mercenarios
tip_HIRE_EVENT_text0 = Esta unidad es un mercenario. En la mazmorras, puedes [GREEN]contratar[] mercenarios por una tarifa. Los [GREEN]mercenarios de la mazmorras[] tienen [GREEN]ventajas[] y [GREEN]desventajas[] únicas en comparación con los contratados en el pueblo.\nPara contratar mercenarios, debes tener [GREEN]puntos de contratación[] restantes indicados por el marcador.
tip_HIRE_EVENT_text1 = Si te faltan los [GREEN]puntos de contratación requeridos[], puedes [GREEN]despedir mercenarios existentes[] usando el botón indicado por el marcador. Sin embargo, los mercenarios [GREEN]contratados para la primera mazmorras no pueden ser despedidos[].

tip_BOSS_title = Tipo de Sala: Jefe
tip_BOSS_text0 = Esta sala tiene el [GREEN]jefe[] de la mazmorras. Típicamente, las mazmorras constan de 2-3 pisos, siendo la última sala la sala del jefe. Los jefes son [GREEN]mucho más fuertes que los enemigos regulares[], así que ten cuidado.\
Derrotar al jefe te permite regresar al pueblo.

tip_END_room_title = Sala Final
tip_END_room_text0 = Esta sala está disponible si no es el nivel final de una mazmorras. Aquí, puedes [GREEN]curar[] o [GREEN]cambiar clases[]. Si no deseas curar, puedes obtener [GREEN]almas[].

tip_LevelUp_title = Subir de Nivel
tip_LevelUp_text0 = La unidad indicada por el marcador ha subido de nivel.
tip_LevelUp_text1 =  Cuando un [GREEN]nivel aumenta[], la unidad gana [GREEN]puntos de habilidad[]. Cuando hay puntos de habilidad disponibles, aparecerá un símbolo [RED]^[] en el panel de la unidad.\n\nPresiona el botón para subir de habilidad indicado por el marcador para elegir una habilidad que aprender.
tip_LevelUp_text1_c = Cuando un [GREEN]nivel aumenta[], la unidad gana [GREEN]puntos de habilidad[]. Cuando hay puntos de habilidad disponibles, aparecerá un símbolo [RED]^[] en el panel de la unidad.\n\nAbre la ventana de equipo presionando nuevamente el personaje seleccionado y presiona el botón de nueva habilidad para elegir una habilidad que aprender.
tip_LevelUp_text1_t = Cuando un [GREEN]nivel aumenta[], la unidad gana [GREEN]puntos de habilidad[].\n\nAbre la ventana de equipo presionando nuevamente el personaje seleccionado y presiona el botón de nueva habilidad para elegir una habilidad que aprender.
tip_LevelUp_text2 = Subir de nivel otorga un [GREEN]punto de habilidad[], que puede ser usado para aprender nuevas habilidades. Hay dos tipos de niveles: el [GREEN]nivel[] básico de la unidad y el [GREEN]nivel de clase[]. Ambos tipos aumentan al subir de nivel, pero [GREEN]cambiar de clases resetea[] el nivel de clase a 1.
tip_LevelUp_text3 = 1. [GREEN]Estadísticas[] aumentan los atributos básicos de la unidad y pueden ser elevadas independientemente de los niveles.\n\n2. [GREEN]Habilidades básicas[] pueden ser aprendidas una vez que se cumplen los requisitos de nivel de la unidad.
tip_LevelUp_text4 = 3. Las habilidades por debajo de las habilidades básicas pueden ser aprendidas cuando se cumplen los requisitos de [GREEN]nivel de clase[].\n\nSeleccionar en los íconos de habilidades mostrará la información de la habilidad en la ventana derecha.

tip_Panicked_title = Efecto de Estado: Pánico
tip_Panicked_text0 = Las unidades indicadas por el marcador están en un estado de pánico. Cuando están en estado de pánico, las unidades [GREEN]pierden control[] y [GREEN]se mueven erráticamente[], tratando de [GREEN]huir[] de los enemigos.
tip_Panicked_text1 = Las unidades tienen un valor de [GREEN]miedo[]. Este valor está [GREEN]indicado por una marca roja (o verde)[] en la barra de HP. Si el [GREEN]HP cae por debajo de esta marca[], la unidad entrará en un estado de pánico. Específicamente, se cumple la condición\n[GREEN](HP actual/máx) < (miedo/100)[]\n.
tip_Panicked_text2 = Los aliados típicamente tienen un valor de miedo de 0, pero unidades como [GREEN]Kronasle[] tienen [GREEN]altos valores de miedo[] y son fácilmente aterrorizadas. Las unidades [GREEN]no-muertas[] tienen valores de miedo negativos y son [GREEN]menos propensas a entrar en pánico[].
tip_Panicked_text3 = Las unidades golpeadas por [GREEN]ataques de atributo oscuro[] verán [GREEN]aumentar su valor de miedo[].

tip_DeathsDoor_title = Efecto de Estado: Puerta de la Muerte
tip_DeathsDoor_text0 = Las unidades indicadas por el marcador están en la [GREEN]Puerta de la Muerte[]. Cuando están en este estado, aparece una [GREEN]marca de calavera[] junto a la barra de HP.
tip_DeathsDoor_text1 = La Puerta de la Muerte generalmente ocurre para los aliados cuyo [GREEN]HP está en 0[]. Las unidades en este estado [GREEN]no mueren inmediatamente[], pero si reciben [GREEN]daño adicional[], hay un [GREEN]66% de probabilidad[] de que mueran.
tip_DeathsDoor_text2 = El estado de Puerta de la Muerte puede ser [GREEN]eliminado mediante curación[]. Algunos enemigos tienen habilidades o rasgos que les permiten ignorar el estado de la Puerta de la Muerte y matar a los aliados de inmediato.

tip_init_title = Consejo In-Game
tip_init_text0 = Bienvenido al mundo de Crawl Tactics. El mensaje que ves es un consejo dentro del juego que aparece cada vez que se introduce un nuevo elemento en el juego. Cuando la [GREEN]ventana de consejos está abierta[], algunos [GREEN]botones no funcionarán[]. Si ya no [GREEN]deseas[] ver consejos, por favor [GREEN]desmarca la casilla[] a continuación.
tip_init_text1 = Para [GREEN]terminar[] o [GREEN]rendirse[] en el juego, presiona el botón [GREEN]engranaje[] ({0}) indicado por el marcador para abrir el [GREEN]menú[]. El juego se guardará automáticamente incluso si sales en este punto.
tip_init_text1_t = Para [GREEN]terminar[] o [GREEN]rendirse[] en el juego, presiona el botón [GREEN]engranaje[] indicado por el marcador para abrir el [GREEN]menú[]. El juego se guardará automáticamente incluso si sales en este punto.

tip_Inspection_title = Estado: Exploración
tip_Inspection_text0 = El juego consiste en los estados de [GREEN]Exploración, Preparación para Batalla, Batalla, y Pueblo[]. Actualmente, está en el estado de [GREEN]Exploración[]. Puedes identificarlo por el ícono en la parte superior izquierda indicado por el marcador.
tip_Inspection_text1 = El estado de Exploración te permite [GREEN]moverte[] y [GREEN]interactuar[] con objetos [GREEN]sin[] estar [GREEN]limitado[] por el [GREEN]rango de movimiento[] o [GREEN]AP[].
tip_Inspection_text2 = Si mueves una unidad al [GREEN]tile de paso[] indicado por el marcador, puedes [GREEN]moverte[] a la [GREEN]siguiente sala[]. Cuando una unidad se mueve a través del paso hacia otra sala, todo el grupo la seguirá.
tip_Inspection_text3 = Si tu vista está obstruida, presiona el [GREEN]brújula[] o el [GREEN]botón de la rueda del mouse[] indicado por el marcador para [GREEN]rotar la pantalla[], o mantén [GREEN]{0}[] para aplanar el terreno y mejorar la visibilidad.
tip_Inspection_text3' = Si tu vista está obstruida, presiona [GREEN]{0}[] o [GREEN]{1}[] para rotar la pantalla.
tip_Inspection_text4 = Puedes conocer la mazmorras actual a través del [GREEN]minimapa[] indicado por el marcador, y también puedes moverte seleccionando la sala deseada en el minimapa.
tip_Inspection_text5 = Para ver información detallada del mapa, presiona el botón de mapa indicado por el marcador.

tip_PrePareBattle_title = Estado: Preparación para Batalla
tip_PrePareBattle_text0 = El estado actual es Preparación para Batalla. Durante este tiempo, puedes [GREEN]reorganizar[] tus unidades, [GREEN]usar ítems[], y [GREEN]equipar o cambiar habilidades[]. Esto permite que el jugador prepare el grupo según la situación del campo de batalla.
tip_PrePareBattle_text1 = En el estado de Preparación para Batalla, puedes usar cartas. [GREEN]Las cartas[] pueden curar aliados, cambiar el terreno y alterar posiciones, entre otros efectos. El botón al que apunta el marcador es el botón de usar carta.
tip_PrePareBattle_text2 = Las cartas se vuelven [GREEN]no disponibles[] hasta la siguiente mazmorras [GREEN]después de ser usadas[].
tip_PrePareBattle_text3 = [GREEN]Selecciona el tile de paso[] por el que entró tu grupo para [GREEN]retirarte[], o
tip_PrePareBattle_text4 = Presiona el botón [GREEN]Iniciar Batalla[] en la parte inferior derecha para comenzar la batalla.

tip_Battle_title = Estado del Juego: Batalla
tip_Battle_text0 = En estado de batalla, aliados y enemigos toman turnos [GREEN]alternadamente[]. Las unidades pueden usar habilidades como moverse o atacar consumiendo [GREEN]AP[].
tip_Battle_text00 = AP está representado por los [YELLOW]puntos amarillos[] sobre la barra de HP en el panel de la unidad indicado por el marcador o junto a la barra de HP sobre los personajes.
tip_Battle_text1 = Las unidades que pueden actuar con [GREEN]AP[] restantes están indicadas por un [GREEN]contorno[] parpadeante. Si no hay aliados que puedan actuar, el botón [GREEN]Fin de Turno[] parpadeará.
#tip_Battle_text2 = Algunas habilidades requieren [SKY]maná[] para usarse. El maná aumenta [SKY]cada turno[] hasta una cierta cantidad y también puede ser llenado usando habilidades específicas. El [SKY]número azul claro[] en la [SKY]parte superior derecha[] del botón de la habilidad muestra la cantidad de maná requerida.
#tip_Battle_text3 = Algunas habilidades solo pueden ser reutilizadas después de un cierto número de turnos. El [PINK]número rojo[] en la [PINK]parte inferior derecha[] del botón de la habilidad indica el [PINK]tiempo de espera[].
#tip_Battle_text4 = También hay habilidades que requieren el [YELLOW]medidor de rabia[]. Estos movimientos desesperados, marcados con una D en el botón de habilidad, son [YELLOW]movimientos definitivos[], y la rabia se acumula cuando los aliados reciben [YELLOW]daño[].
tip_Battle_text2 = Durante las acciones de aliados o enemigos, presionar [GREEN]{0}[] permite [GREEN]avanzar rápidamente[], y si no ocurre daño u otros efectos después de moverse, es posible [GREEN]rebobinar[].
tip_Battle_text2' = Durante las acciones de aliados o enemigos, presionar [GREEN]Botón izquierdo del mouse[] permite [GREEN]avanzar rápidamente[], y si no ocurre daño u otros efectos después de moverse, es posible [GREEN]rebobinar[].

tip_Town_title = Estado: Pueblo
tip_Town_text0 = En el [GREEN]estado de Pueblo[], puedes reorganizar el grupo después de una batalla. Para verificar el [GREEN]estado y equipo de los aliados[], selecciona el [GREEN]Salón del Pueblo[] en el centro del pueblo. También puedes construir otras estructuras para comprar o mejorar ítems y habilidades.
tip_Town_text1 = Durante el turno del pueblo, el [GREEN]primer edificio[] puede ser construido [GREEN]gratis[], y a partir del segundo, cuesta Almas. Construir una Taberna te permite reclutar nuevos mercenarios, y la Tienda te permite comprar ítems.
tip_Town_text2 = Después de terminar los preparativos, puedes usar el [GREEN]Portal[] para elegir una [GREEN]Carta[] y la [GREEN]siguiente mazmorras[], luego salir nuevamente en tu aventura.

tip_Bomberman_text0 = Las unidades indicadas por el marcador son unidades de la clase Bomberman. Las unidades de la clase [GREEN]Bomberman[] se [GREEN]autodestruyen[] si hay aliados cerca. Ten cuidado ya que la autodestrucción causa daño de fuego en un área amplia. Además, se [GREEN]explotarán[] si reciben [GREEN]daño por fuego[], pero no explotarán si mueren por otros tipos de daño.

tip_AmphibianSkin_text0 = Las unidades indicadas por el marcador tienen el rasgo [GREEN]Anfibio[]. Las unidades anfibias [GREEN]recuperan salud cada turno[] y [GREEN]no sufren penalizaciones de movimiento[] mientras están en [GREEN]agua[].

tip_Unholy_text0 = Las unidades indicadas por el marcador pertenecen a la categoría de [GREEN]No-muertos[]. Las unidades no-muertas [GREEN]resucitarán unas vueltas después de la muerte[], así que es mejor usar [GREEN]pociones[] o [GREEN]magia de fuego/curación[] sobre el [GREEN]cadáver para eliminarlo[]. Además, las unidades No-muertas reciben [GREEN]daño[] de [GREEN]magia de curación[] excepto la curación de atributo oscuro.

