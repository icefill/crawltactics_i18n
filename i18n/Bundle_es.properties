tut_move = Mover Unidad
tut_move_title = Fase de Exploración: Mover unidad
tut_move0=  En modo de exploración, la unidad líder se selecciona automáticamente.\n\n\
  El juego terminará [GREEN]si muere la unidad líder[] y su cadáver desaparece.
tut_move1=El personaje seleccionado puede [GREEN]moverse libremente[] haciendo [GREEN]clic izquierdo[] en el espacio al que deseas ir.\n\n  Si mueves el cursor al espacio al que deseas ir, aparecerá el camino hacia ese espacio.
tut_move1_c=El personaje seleccionado puede [GREEN]moverse libremente[] moviendo el cursor al espacio usando [GREEN]{0}[] y luego presionando [GREEN]{1}[].\n\n  Si mueves el cursor al espacio al que deseas moverte, aparecerá el camino hacia ese espacio.
tut_move1_c'=El personaje seleccionado puede [GREEN]moverse libremente[] moviendo el cursor al espacio usando [GREEN]Dpad[] y luego presionando [GREEN]{0}[].\n\n  Si mueves el cursor al espacio al que deseas moverte, aparecerá el camino hacia ese espacio.

tut_move2=Los turnos no aumentarán en la fase de exploración\n\n  [YELLOW]¡Intenta seleccionar el espacio apuntado por la flecha![]
tut_move3 = ¡Bien hecho! Cada unidad tiene su propia tasa de salto hacia arriba y hacia abajo.\n\n  Generalmente, una unidad puede [GREEN]saltar 2 espacios[] y [GREEN]saltar hacia abajo 3 espacios[]\n\n
tut_move4 =  Tenga en cuenta que [GREEN]la trampa de espinas[] cerca de la unidad del jugador no lastimó al jugador.\n\n  Las trampas en los espacios se [GREEN]activan[] solo cuando una [GREEN]unidad se detiene sobre ella[].
tut_move5 = ¡Oh no! Un rayo repentino del cielo...\n  No te preocupes, las unidades del jugador [GREEN]no morirán[] inmediatamente incluso si su [GREEN]HP baja a cero[].
tut_move6 = La unidad del jugador estará en estado de [RED]Puerta de Muerte[] cuando su HP baje a cero.\n  En estado de puerta de muerte:\n\n\
  - La unidad [RED]dañada[] tiene un 66% de probabilidad de [RED]morir[]\n\n\
  - La unidad [GREEN]sanada[] ya [GREEN]no estará[] en el estado
