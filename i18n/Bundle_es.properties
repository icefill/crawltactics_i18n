game_controller_mapping = Mapeo de Botones del Juego

dungeon_mode_upgrade_limit_message = [GREEN]En Modo Mazmorras, el nivel máximo de mejora está limitado a 4.[]

language_notice_title = Aviso de Idioma
language_notice_text = Este juego cuenta con traducción automática para el idioma actual. Si encuentras alguna traducción extraña, puedes cambiar al inglés en cualquier momento desde el menú de Ajustes.\n\nTambién puedes ayudarnos a mejorar la traducción reportando problemas o colaborando en nuestra página de GitHub. ¡Gracias por tu apoyo!
