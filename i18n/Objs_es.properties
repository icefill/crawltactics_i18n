holy_avenger_desc = El Vengador Sagrado es una espada larga de una mano que brilla con luz divina. Otorga a su portador daño sagrado y la capacidad de disipar el miedo.
holy_avenger_lore = El Vengador Sagrado, una espada de una mano sagrada, se dice que ha sido bendecida por fuerzas celestiales. Su hoja brilla con la radiancia de la pureza, y aquellos que sostienen su empuñadura encuentran su coraje reforzado. Con el poder de empuñar energía sagrada y desterrar el miedo, el Vengador Sagrado es a menudo elegido por campeones que se enfrentan a la oscuridad.
glacial_edge_desc = El Edge Glacial es un hacha temible de dos manos que emana un frío helador. Sus golpes desatan una línea de tormentas heladas, congelando a los enemigos en su camino.
glacial_edge_lore = Las leyendas hablan del Edge Glacial, un poderoso hacha de dos manos forjada en el corazón de una tormenta eterna. Su toque helado transforma cada golpe en una cascada de tormentas de hielo, dejando un camino helado de destrucción a su paso. Se dice que es el arma de un legendario guerrero del hielo, el Edge Glacial aprovecha el poder del invierno mismo.
gungnir_desc = Esta lanza legendaria, cuando es empuñada, se dice que emite rayos de relámpago crepitantes que golpean con un poder impresionante.
gungnir_lore = Según la antigua tradición, Gungnir fue forjada por los divinos herreros de antaño, imbuida con la furia de las tormentas y la fuerza del relámpago. Se dice que la esencia misma de los cielos fluye por sus venas, otorgando a su portador el control sobre las fuerzas primordiales de la naturaleza. Se susurra que los guerreros que blanden Gungnir se convierten en avatares del trueno, comandando rayos de electricidad para aplastar a sus enemigos en la batalla.
phoenix_rod_desc = La Vara de Fénix es un bastón dorado con una punta en forma de halcón adornada con un rubí. Mejora la inteligencia y el dominio del fuego.
phoenix_rod_lore = La Vara de Fénix, un bastón de antiguo misticismo, es venerada por su belleza dorada y su diseño inspirado en halcones. Susurra secretos olvidados y fuegos antiguos. A medida que los portadores canalizan su energía, encuentran su intelecto elevado y su maestría sobre el fuego se profundiza, permitiéndoles dominar las llamas con una habilidad sin igual por la mayoría.
