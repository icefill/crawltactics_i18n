EDungeonType.Ruin_desc =  Los restos de la arquitectura de una civilización perdida.\n  Ruinas, hierba y estanques.
EDungeonType.Forest_desc = Un área de tierra dominada por árboles y hierba. \n  Taves y bestias salvajes aparecen a menudo.
EDungeonType.Desert_desc = La temperatura es alta, y no hay lluvia. Muchos enemigos son inmunes a la magia de fuego.
EDungeonType.Catacomb_desc = Pasajes subterráneos hechos por el hombre para prácticas religiosas. Sin hierba ni agua, pero con muchas trampas, cadáveres.\n  Monstruos no muertos florecen.
EDungeonType.Cavern_desc =  Un vacío natural en el suelo. Los terrenos son rocosos sin hierba, pero a veces tienen agua subterránea.\n  Monstruos demoníacos aparecen a menudo.
EDungeonType.RiverSide_desc = Tierras bajas con aguas fluidas.\n  Monstruos anfibios aparecen a menudo.
EDungeonType.SnowMt_desc = Una región montañosa cubierta de nieve. La temperatura es baja, y hay muchos enemigos resistentes a la magia de hielo.

