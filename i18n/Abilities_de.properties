# Hinzugefügt(251228)

open_ai_strategy = KI-Strategie
open_ai_strategy_desc = Wählen Sie die KI-Strategie.



return_thrown_weapon = Geworfenes Werkzeug zurückholen
return_thrown_weapon_desc = Holen Sie das geworfene Werkzeug zurück.

lucky_strike = Glückstreffer
lucky_strike_desc = Ein Nahkampf-Angriff, der Schaden proportional zum Ergebnis eines Würfelwurfs verursacht.

sword_wave = Schwertwelle
sword_wave_desc = Schwinge das Schwert, um einen kraftvollen Luftstoß auszulösen, der gerade Linie Schaden verursacht.

dive = Sprung
dive_desc = Springt in den Himmel und taucht dann hinunter, um einem Feind Schaden zuzufügen und zur ursprünglichen Position zurückzukehren.
dragon_dive = Drachen-Sprung
dragon_dive_desc = Springt in den Himmel und taucht dann hinunter, um das Ziel und nahe Feinde zu beschädigen, bevor es zur Position zurückkehrt.

playing_card = Karte ziehen
playing_card_desc = Ziehe Karten aus dem Deck, wähle eine aus und werfe sie.

turning_luck_around = Glück wandeln
turning_luck_around_desc = Wenn die vorherige Aktion fehlschlägt, erhöht sich das Glück.

winning_streak = Gewinnsträhne
winning_streak_desc = Glück erhöht sich, wenn ein Angriff trifft. Glück erhöht sich weiter bei einem kritischen Treffer.

lucky_charm = Glücksbringer
lucky_charm_desc = Erhöht das Glück.

cheating = Betrügen
cheating_desc = Die Genauigkeit aller Aktionen beträgt 100 % und alle Wetten gelingen.

head_or_tail = Kopf oder Zahl
head_or_tail_desc = Nach dem Schießen mit einer Waffe, wirf eine Münze. Wenn sie auf Kopf landet, schieße erneut.

lightning_explosion = Blitzexplosion
lightning_explosion_desc = Erzeuge eine Explosion um den Zaubernden, die Blitzmagieschaden verursacht.

knowledge_is_power = Wissen ist Macht
knowledge_is_power_desc = Physische Nahkampfwaffenangriffe verursachen zusätzlichen Schaden basierend auf Intelligenz.

tornado = Tornado
tornado_desc = Beschwöre einen Tornado, der zufälligen Feinden in einem weiten Bereich Schaden zufügt.

nature_attack = Angriff der Natur
nature_attack_desc = Füge dem Zielfeld und benachbarten Feldern des gleichen Terrain-Typs Schaden zu. Der Schadens Typ variiert je nach Terrain.

adapt_nature = Anpassung an die Natur
adapt_nature_desc = Angriffe der Naturschule verursachen keine Schäden mehr bei Verbündeten.

harshness_of_nature = Härte der Natur
harshness_of_nature_desc = Erhöht den Schaden offensiver Zauber der Naturschule.

shield_of_blood = Blutschild
shield_of_blood_desc = Konsumiere die HP des Zaubernden, um die Verteidigung der beschworenen Einheiten zu erhöhen.

blood_overdrive = Blutüberlastung
blood_overdrive_desc = Konsumiere die HP des Zaubernden, um die Stärke und Intelligenz der beschworenen Einheiten zu erhöhen.

curse_and_poison_amplifier = Fluch- und Giftsverstärker
curse_and_poison_amplifier_desc = Erhöht die Angriffsreichweite von Debuffs und Giftfähigkeiten.

curse_is_poison = Fluch ist Gift
curse_is_poison_desc = Ziele, die von einem Debuff betroffen sind, erleiden auch zusätzlichen Giftschaden.

curse_spreader = Fluchverbreiter
curse_spreader_desc = Wenn du einen Debuff-Effekt zugefügt hast, verbreitet er sich auf alle Gruppenmitglieder des debuffierten Ziels.

summon_demon_lord = Dämonenlord beschwören
summon_demon_lord_desc = Beschwöre einen Dämonenlord.

waterproof_coating = Wasserfeste Beschichtung
waterproof_coating_desc = Mechanische Feinde rosten nicht, wenn sie auf Wasserfelder ziehen.

summon_mecharonasle = Mechanasle beschwören
summon_mecharonasle_desc = Beschwöre eine Mechanasle.

construct_robot = Roboter konstruieren
construct_robot_desc = Konstruiere einen Roboterschild.

auto_mecharonasle = Auto Mechanasle
auto_mecharonasle_desc = Konstruiere automatisch eine Mechanasle zu Beginn des Kampfes.

install_electric_coil = Elektrische Spule installieren
install_electric_coil_desc = Installiere eine elektrische Spule.

transmute_attack_potion = Angriffszaubertrank umwandeln
transmute_attack_potion_desc = Wähle einen Angriffszaubertrank und wandeln ihn um.
transmute_support_potion = Unterstützungszaubertrank umwandeln
transmute_support_potion_desc = Wähle einen Unterstützungszaubertrank und wandeln ihn um.

install_fire_jar = Feuergefäß installieren
install_fire_jar_desc = Installiere ein Feuergefäß.

install_ice_jar = Eisgefäß installieren
install_ice_jar_desc = Installiere ein Eisgefäß.

potionology_master = Meister der Trankkunde
potionology_master_desc = Erhöht die Dauer von Trank-Effekten.

kill_switch = Notaus-Schalter
kill_switch_desc = Detoniere eine von dir geschaffene mechanische Einheit, die umliegenden Einheiten Schaden zufügt.

soul_synthesis = Seelenstein-Synthese
soul_synthesis_desc = Konsumiere die Wut-Leiste, um einen Seelenstein zu synthetisieren.

trap_expert = Falle-Experte
trap_expert_desc = Erhöht die Schadensfläche beim Aktivieren von Kanonen, Gefäßen und ähnlichen Geräten.

install_cannon = Kanone installieren
install_cannon_desc = Installiere eine Kanone.

install_auto_turret = Automatische Türme installieren
install_auto_turret_desc = Installiere einen automatisch feuernden Armbrustturm.

install_magic_jar = Magisches Gefäß installieren
install_magic_jar_desc = Wähle ein magisches Gefäß und installiere es.

throw_glacial_spear = Gletscherspeer werfen
throw_glacial_spear_desc = Wirf den ausgerüsteten Speer, der den Gegnern auf seinem Weg Eisschaden zufügt.

dual_wielder = Doppel-Waffenmeister
dual_wielder_desc = Wenn du mit dualen Waffen kämpfst, löst die Benutzung einer einhändigen Nahkampffähigkeit einen zusätzlichen Angriff mit der anderen Waffe aus.

leap_attack = Sprungangriff
leap_attack_desc = Springe, um dich zu bewegen und ein einzelnes Ziel anzugreifen.

blade_and_gun_mastery = Klingen- und Schusswaffenmeisterschaft
blade_and_gun_mastery_desc = Wenn du sowohl eine Waffe als auch eine Nahkampfwaffe führst, schieße mit der Waffe nach einem normalen Nahkampfangriff. Bei Verwendung einer Nahkampfwaffenfähigkeit, führe einen zusätzlichen Angriff mit der anderen Waffe aus.

heavy_dual_wield = Schwere Doppel-Waffenführung
heavy_dual_wield_desc = Erlaubt das Ausrüsten von zwei zweihändigen Waffen, die keine Speere sind, eine in jeder Hand.

blood_pact_aura = Blutpakt
blood_pact_aura_desc = Fügt beschworenen Kreaturen einen Lebensraubs-Vorteil hinzu, und der Beschwörer erhält ebenso viel zurück, wie die beschworenen Kreaturen rauben. Wenn du einen Segen erhältst, breitet er sich auch auf deine Beschwörungen aus.

toxicology_master = Toxikologie Meister
toxicology_master_desc = Erhöht die Dauer von Gift-Effekten. Giftschaden kann das Ziel töten.

fire_and_lightning_spreader_aura = Feuer- und Blitzverbreiter-Aura
fire_and_lightning_spreader_aura_desc = Erhöht die Verbreitungsreichweite von Feuer, das von Verbündeten entzündet wurde, und die Verbreitungsreichweite von Elektrizität über Wasser.

amplifying_dice = Verstärkende Würfel
amplifying_dice_desc = Würfle einen Würfel, um den Schaden, die Heilung usw. des Ziels proportional zum Ergebnis zu erhöhen.

summon_balrog = Balrog beschwören
summon_balrog_desc = Beschwört einen Balrog.
