shrine_quest_summary= Heiligtum
shrine_quest_text = Eine geheimnisvolle Statue steht hier. Wenn sie aktiviert wird, können folgende Ergebnisse erzielt werden.

#### QUEST 1 #######################

a_small_frog_title = Ein kleiner Frosch
a_small_frog_summary = Ein winziger Frosch auf der Suche nach einem Kuss
a_small_frog_text = Ein kleiner Frosch steht hier. Er scheint auf der Suche nach einem Kuss von einer schönen Frau zu sein. Was möchtest du mit ihm tun?

choice_kiss_the_frog_title = Küsse den Frosch
choice_kiss_the_frog_summary = Erfülle den Wunsch des Frosches
choice_kiss_the_frog_text = Einer deiner Gruppenmitglieder gibt dem Frosch einen Kuss. Nicht überraschend passiert nichts, und deine Einheit fühlt sich schlecht. Der Frosch bietet als Entschuldigung ein Amulett an.

choice_kiss_female_title = Küsse den Frosch
choice_kiss_female_text = Groffs Aussehen hat sich verändert!
choice_kiss_female_summary = Gewähre dem Wunsch des Frosches.
choice_kiss_male_title = Küsse den Frosch
choice_kiss_male_text = Einer deiner Gruppenmitglieder küsst den Frosch. Überraschenderweise passiert nichts, und dein Gruppenmitglied fühlt Schmerzen. Als Entschuldigung bietet der Frosch einen Talisman an.
choice_kiss_male_summary = Gewähre dem Wunsch des Frosches.
finmuck_title = Finmuck
finmuck_text = Groffkan stellte sich als Finmuck vor. Als Belohnung dafür, dass du ihn in seine ursprüngliche Form zurückgebracht hast, bietet Finmuck an, deiner Gruppe im Kampf zu helfen, bis ihr euer Ziel erreicht.
hire_finmuck_title = Finmuck einstellen
hire_finmuck_text = Du hast Finmuck als deinen Gast eingestellt.
hire_finmuck_summary = Stelle Finmuck ein.

frozen_tolbok_title = Gefrorener Tolbok
frozen_tolbok_summary = Ein gefrorener Tolbok sucht Hilfe.
frozen_tolbok_text = Ein Tolbok ist hier gefroren. Er sagt, er wurde durch einen Streich eines Zauberers eingefroren. Er erklärte, dass dieses magische Eis nur durch das legendäre Artefakt, den Schneeflocken-Anhänger, geschmolzen werden kann. Er markierte dann den Standort des Schneeflocken-Anhängers auf deiner Karte.
choice_give_item_ruknash_summary = Gib den Gegenstand an Ruknash.
choice_give_item_ruknash_text = Du hast den Schneeflocken-Anhänger an Ruknash gegeben.
ruknash_title = Ruknash
ruknash_text = Im Gegenzug für seine Rettung bot er an, dir zu helfen, bis du dein Ziel erreichst.
hire_ruknash_summary = Stelle Ruknash als Gast ein.

kronasle_escort_title = Kronasles Anfrage nach Eskorte
kronasle_escort_summary = Du hast einen einsamen Kronasle-Schamanen gefunden. Er möchte diesen Ort verlassen und sucht deine Eskorte.
kronasle_escort_text = Du hast einen einsamen Kronasle-Schamanen gefunden. Er möchte dieses Verlies verlassen, benötigt aber deine Hilfe, da alle seine Begleiter tot sind. Er verspricht, dir einen Seelenstein zu geben, wenn du ihn bis zum Ende des Verlieses begleitest.
escort_grik_summary = Begleite Grik
escort_grik_text = …
fight_grik_summary = Kämpfen.

kronasle_escort_reward_title = Kronasles Belohnung für die Eskorte
kronasle_escort_reward_text = Grik hat dir gedankt.
griks_reward_summary = Nimm Seelensteine von Grik.
griks_reward_text = ...

druz_the_warrior_title = Druz der Krieger
druz_the_warrior_summary = Der kriegerische Druz sucht einen Kampf eins gegen eins.
druz_the_warrior_text = Du triffst auf einen Vashi-Krieger, der eine verfluchte Waffe führt. Wenn du ihn im Kampf besiegst, sagt er, dass er dir entweder im Kampf in diesem Verlies helfen oder dir die Waffe geben wird.

druz_after_surrender_title = Druz nach der Kapitulation
druz_after_surrender_text = Druz hat die Niederlage eingeräumt.

hire_druz_summary = Stelle Druz als Questbegleiter ein
hire_druz_text = Druz hat zugestimmt, dir im Verlies zu helfen.

receive_icycle_summary = Erhalte eine Waffe
receive_icycle_text = Druz gab dir eine Waffe, die seiner eigenen ähnelt.

rescue_tolbok_title = Tolbok in Gefahr
rescue_tolbok_summary = Tolbok ist von Grofkhans umgeben. Er sucht Rettung.
rescue_tolbok_text = Du findest einen Tolbok, der von Grofhkans umgeben ist. Er ist in Gefahr! Die Grofkhans sagen, dass sie dir Seelensteine geben werden, wenn du die Situation ignorierst und weitermachst. Was wirst du tun?
fight_against_grofkans_to_rescue_tolbok_summary = Kämpfe gegen die Grofkhans, um den Tolbok zu retten.
ignore_grofkans_summary = Ignoriere und ziehe weiter.
ignore_grofkans_text = Du hast die Situation ignoriert und bist weitergezogen. Die Grofkans haben dir eine Tasche mit Seelensteinen zugeworfen.
tolbok_rescue_reward_title = Tolboks Belohnung
tolbok_rescue_reward_text = Tolbok möchte eine Belohnung im Gegenzug anbieten.
choice_rescued_tolbok_summary = Erhalte eine Karte von Tolbok.
choice_rescued_tolbok_text = Tolbok drückte seine Dankbarkeit aus.
choice_rescued_tolbok_item_summary = Erhalte einen Gegenstand von Tolbok.
choice_rescued_tolbok_item_text = Tolbok drückte seine Dankbarkeit aus.

tolboks_and_vashies_title = Tolboks und Vashies
tolboks_and_vashies_summary = Eine Gruppe von Tolboks und eine Gruppe von Vashies starren sich hier an. Sie schauen beide zu dir und bitten um deine Unterstützung.
tolboks_and_vashies_text = Eine Gruppe von Tolboks und eine Gruppe von Vashies starren sich hier an. Bei deiner Ankunft schauen sie beide zu dir und bitten um deine Unterstützung. Was wirst du tun?
fight_with_tolboks_summary = Stehe auf der Seite der Tolboks und kämpfe.
fight_with_vashies_summary = Stehe auf der Seite der Vashies und kämpfe.
tolbok_party_prize_title = Tolbok-Parteibelohn
tolbok_party_prize_text = Die Tolboks haben dir ein Geschenk als Belohnung für den Kampf an ihrer Seite angeboten.
tolbok_prize_item_summary = Erhalte einen Gegenstand.
tolbok_prize_item_text = ..
vashi_party_prize_title = Vashi-Parteibelohn
vashi_party_prize_text = Die Vashies haben dir ein Geschenk als Belohnung für den Kampf an ihrer Seite angeboten.
vashi_prize_item_summary = Erhalte einen Gegenstand.
vashi_prize_item_text = ..


kronasle_revenge_request_title = Racheantrag eines Kronasle
kronasle_revenge_request_summary = Kronasle sucht Rache
kronasle_revenge_request_text = Ein Kronasle steht hier mit müdem Gesicht. Er stellt sich als ehemaliger Anführer des Clan der Unstillbaren Flamme vor, der von seinem rechten Mann verraten wurde. Er möchte seine gestohlene Waffe zurück.

choice_give_item_title = Gib ihm seine Waffe zurück
choice_give_item_summary = Stelle die gestohlene Waffe wieder her
choice_give_item_text = Er erhält seine Waffe mit einem bitteren Gesicht. Als Zeichen der Dankbarkeit lehrt er der ausgewählten Einheit einen seiner Feuerzauber.

kronasle_unquenchable_flame_clan_title = Der Clan der Unstillbaren Flamme
kronasle_unquenchable_flame_clan_summary = Begegne dem Clan der Unstillbaren Flamme
kronasle_unquenchable_flame_clan_text = Ein Rudel von Kronasles steht hier. Der Anführer führt ein ungewöhnliches feuriges Schwert. Er behauptet, der Anführer des unstillbaren Clans zu sein und erklärt, dass er den ehemaligen tyrannischen Anführer gestürzt hat.

wolf_companion_title = Ein Wolf wartet auf seinen Meister
wolf_companion_summary = Ein Wolf sucht nach seinem Meister
wolf_companion_text = Ein einsamer Wolf steht hier. Er sagt, er warte auf seinen Meister, und es sind über 3 Tage vergangen, seitdem er zu warten begonnen hat.

wolf_after_visit_master_title = Die Wahrheit entdecken
wolf_after_visit_master_summary = Enthülle das Schicksal des Wolfmeisters
wolf_after_visit_master_text = Du weißt jetzt, dass sein Meister bereits tot ist. Was möchtest du jetzt tun?

tell_the_wolf_the_truth_summary = Sage dem Wolf die Wahrheit
tell_the_wolf_the_truth_text = Du sagst dem Wolf, dass sein Meister tot ist, und zeigst ihm die Überreste. Der Wolf dankt dir für deine Hilfe und beschließt, dir zu folgen.

tell_a_lie_to_the_wolf_summary = Lüge den Wolf an
tell_a_lie_to_the_wolf_text = Du sagst dem Wolf, dass du seinen Meister getroffen hast, aber der Meister wollte ihn nicht mehr. Der Wolf glaubt dir nicht ganz, aber lehrt dich, wie du seinen Freund beschwören kannst, um dir als Zeichen seiner Dankbarkeit zu helfen.

injured_hawk_title = Verletzter Falke
injured_hawk_summary = Ein verletzter Falke sucht Hilfe.
injured_hawk_text = Du hast einen verletzten Falken gefunden. Der Falke scheint Hilfe zu suchen. Was wirst du tun?
hawk_after_healed_text = Dank dir ist der Falke vollständig geheilt. Es sieht so aus, als würde er dir folgen, wenn du gestikulierst.
learn_hawk_familiar_summary = Begleite den Falken.
give_hawk_potion_summary = Gib dem Falken einen Heiltrank.
give_hawk_potion_text = Du hast dem Falken einen Heiltrank gegeben.

blood_pact_with_imp_title = Blutpakt
blood_pact_with_imp_summary = Ein Imp sucht seinen neuen Meister.
blood_pact_with_imp_text = Du bist einem Imp begegnet. Der Imp möchte, dass du sein neuer Vertragspartner wirst, da sein vorheriger gestorben ist. Was wirst du wählen?
choice_blood_pact_summary = Schließe einen Blutpakt mit dem Imp.
choice_blood_pact_text = Du hast dem Wunsch des Imp zugestimmt.

a_corpse_of_human_text = Eine Leiche eines Jägers liegt hier.
wolf_master_corpse_text = Der Körper eines Jägers liegt hier. Es sieht so aus, als wäre die Leiche der des Wolfmeisters.

injured_tolbok_party_title = Eine Gruppe vergifteter Tolboks
injured_tolbok_party_summary = Eine Gruppe vergifteter Tolboks sucht Hilfe.
injured_tolbok_party_text = Eine Gruppe von Tolboks steht hier. Sie scheinen nicht feindlich wie gewöhnliche Monster zu sein. Der Anführer sagt, sie sind vergiftet durch den Verzehr bestimmter Früchte und benötigen ein Antidot aus dem Elixier der Intelligenz.

tolbok_asking_antidote_title = Tolbok fragt nach einem Antidot
tolbok_asking_antidote_summary = Tolbok sucht ein Antidot
tolbok_asking_antidote_text = Der Anführer der Tolboks bemerkt, dass du das Elixier hast. Er bittet dich, es ihm zu geben, andernfalls lässt er dich nicht passieren.

antidote_quest_title = Elixier der Intelligenz
antidote_quest_summary = Suche nach dem Elixier der Intelligenz
antidote_quest_text = Hier gibt es ein mysteriöses Heiligtum.

give_antidote_summary = Gib das Elixier den Tolboks
give_antidote_result = Die Tolboks verwenden das Elixier, um ein Antidot zu erstellen und heilen sich. Aus Dankbarkeit geben sie dir eine Karte.

fight_injured_tolbok_party_title = Kampf
fight_injured_tolbok_party_summary = Schlacht

examine_the_shrine_summary = Untersuche das Heiligtum
examine_the_shrine_result = ...

old_warrior_title = Die Bitte eines alten Kriegers
old_warrior_summary = Ein alter Krieger wurde von Monstern seiner Waffe beraubt.
old_warrior_text = Ein alter Krieger steht hier. Er sagt, Monster hätten ihm seine Waffe gestohlen, während er schlief. Er weiß, wo sie sind, kann sie aber nicht selbst zurückholen. Er bietet an, dir über den Nahkampf zu lehren, wenn du ihm hilfst.

give_his_weapon_back_summary = Gib ihm seine Waffe zurück
give_his_weapon_back_text = Er drückt seine Dankbarkeit aus und gibt dir ein mysteriöses Elixier.

kronasle_thieves_title = Kronasle Diebe
kronasle_thieves_summary = Begegne den Kronasle Dieben
kronasle_thieves_text = Eine Gruppe von Kronasles ist hier. Sie haben eine seltene Waffe, die anscheinend nicht ihnen gehört.

choice_fight_thieves_summary = Bekämpfe die Diebe

bram_1on1_title = Bram der Schildträger
bram_1on1_summary = Ein Speerträger sucht jemanden, der stärker ist als er selbst, um ihm zu folgen.
bram_1on1_text = Du begegnest hier einem Speerträger, der einen Schild trägt. Er stellt sich als Bram vor. Er sagt, er sei bereit, dir bei deinem Abenteuer zu helfen, folgt aber nur jemanden, der stärker ist als er selbst.
bram_fight_1on1_summary = 1v1-Kampf gegen Bram
bram_after_surrender_text = Bram ist beeindruckt von deiner Stärke und möchte dir folgen.
hire_bram_summary = Stelle Bram ein

renee_the_jealous_title = Renee die Eifersüchtige
renee_the_jealous_summary = Es gibt eine schöne Bogenschützin, die sich weigert, anderen Frauen zu folgen.
renee_the_jealous_text = Eine schöne Bogenschützin steht hier. Sie sagt, sie werde einer Frau nicht folgen.

renee_condition_leader_is_male_title = Renee die Eifersüchtige
renee_condition_leader_is_male_text = Eine erfahrene Bogenschützin nähert sich und spricht mit dir. Sie stellt sich als Renee vor und ist von dir fasziniert. Sie wird dir folgen, wenn du es ihr erlaubst, aber sie könnte Schwierigkeiten mit anderen Frauen haben.

skeleton_with_a_heart_title = Skelett mit einem Herzen
skeleton_with_a_heart_summary = Ein sprechendes Skelett möchte über seine wahre Identität lernen.
skeleton_with_a_heart_text = ...
before_visit_skeleton_friend_title = Skelett mit einem Herzen
before_visit_skeleton_friend_text = Du hast einen Skelettsoldaten gefunden. Im Gegensatz zu typischen Skeletten scheint er in der Lage zu sein zu denken und zu sprechen. Er erwähnt, dass er zwar sein Gedächtnis verloren hat, aber vage eine Priesterin erinnert und glaubt, dass er die Wahrheit über seine Identität herausfinden kann, wenn er sie findet.
say_a_lie_to_skeleton_summary = Sage eine Lüge und schlage vor, dass er dir folgt
say_a_lie_to_skeleton_text = Du hast ihm gesagt, dass du die Priesterin gefunden hast, aber sie bereits gestorben ist, und stattdessen vorgeschlagen, dass er dir folgt.
after_visit_skeletons_friend_text = Du weißt jetzt, wer das Skelett ist und über seinen Freund. Wirst du ohne zu zögern handeln?
hire_skeleton_summary = Stelle das Skelett ein
hire_skeleton_text = Dankbar für deine Hilfe hat das Skelett beschlossen, dir zu folgen.
resurrect_skeleton_summary = Erwecke das Skelett
resurrect_skeleton_text = Du hast die von der Priesterin gegebene Schriftrolle verwendet, um das Skelett zu erwecken.
skeletons_friend_title = Der Freund des Skeletts
skeletons_friend_text = ...
after_visit_skeleton_title = Der Freund des Skeletts
after_visit_skeleton_text = Du hast die Priesterin gefunden, die der Beschreibung des Skeletts entspricht. Sie bestätigte, dass das Skelett tatsächlich ihr Gefährte war und aus einer Schlacht mit einem Nekromanten geflohen ist. Sie gab dir eine Schriftrolle und bat dich, sie auf das Skelett zu verwenden, um ihm seine menschliche Form zurückzugeben. Im Gegenzug versprach sie, dir die Exorzismus-Fähigkeit beizubringen, die großen Schaden bei Untoten verursacht, wenn du es schaffst, ihn wiederherzustellen.
after_resurrect_skeleton_text = Die Priesterin möchte dir die Exorzismus-Fähigkeit als Belohnung für deine Hilfe beibringen.
learn_exorcism_summary = Lerne die Exorzismus-Fähigkeit
learn_exorcism_text = ...

hire_renee_summary = Stelle Renee ein
hire_renee_text = Sie ist deiner Gruppe beigetreten.

john_the_virtuous_title = John der Tugendhafte
john_the_virtuous_summary = Ein verletzter Ritter benötigt einen Heiltrank.
john_the_virtuous_text = Ein verletzter Ritter spricht mit dir und keucht nach Luft. Er sagt, Monster hätten ihn verletzt und er brauche Heilung. Er wird dir folgen, wenn du ihm hilfst.

after_healed_title = Nach der Heilung
after_healed_text = Er wird dir folgen, wenn du es ihm erlaubst, aber er wird gehen, wenn du etwas Schlechtes tust.

give_john_potion_summary = Gib John einen Heiltrank
give_john_potion_text = Du gibst ihm einen Heiltrank und er fühlt sich besser. Er wird dir folgen, wenn du es ihm erlaubst, aber er wird gehen, wenn du etwas Schlechtes tust.

hire_john_summary = Stelle John ein

awakener_of_rage_title = Der Erwecker der Wut
awakener_of_rage_summary = Ein Dämonenkrieger bietet an, Wut um den Preis der Gesundheit zu erwecken.
awakener_of_rage_text = Du bist einem Dämonenkrieger begegnet. Er nennt sich der Erwecker der Wut und bietet an, die Kraft der Wut im Austausch für deine Gesundheit zu erwecken. Was wirst du tun?
leader_health_to_rage_summary = Opfere die Gesundheit des Anführers, um Wut zu erwecken
leader_health_to_rage_text = Du hast das Angebot des Dämons angenommen und die Kraft der Wut erlangt.

the_weapon_collector_title = Der Waffensammler
the_weapon_collector_summary = Ein Dämonenmagier bietet an, das maximale Mana im Austausch für eine wertvolle Waffe zu erhöhen.
the_weapon_collector_text = Du bist einem dämonischen Zauberer begegnet, der mächtige magische Energie ausstrahlt. Er stellte sich als der Waffensammler vor und bot an, das maximale Mana deiner Gruppe im Austausch für eine wertvolle Waffe zu erhöhen. Was wirst du wählen?
give_a_weapon_and_increase_mana_summary = Nimm das Angebot des Dämons an.
give_a_weapon_and_increase_mana_text = Du hast ihm deine Waffe übergeben. Im Gegenzug hat der Dämon dein maximales Mana erhöht.

frost_fall_title = Frostfall
frost_fall_summary = Ein Adliger möchte seine Geliebte vor Monstern retten.
frost_fall_text = Ein zerbrechlich aussehender Adliger namens Frostfall steht hier. Er spricht mit dir über eine Gruppe von Monstern, die seine Geliebte entführt haben, und er sucht nach ihnen, um sie zu retten. Er bittet um deine Hilfe, um sie zurückzubringen.

after_killing_lujath_title = Nach dem Töten von Lujath
after_killing_lujath_text = Du hast Lujath getötet, aber Frost weiß es nicht. Was möchtest du Frost sagen?

give_lujath_corpse_and_tell_a_lie_summary = Sage ihm eine Lüge, dass Grug sie getötet hat
give_lujath_corpse_and_tell_a_lie_text = Du konntest die Wahrheit nicht gestehen, dass du sie zusammen mit Grug getötet hast. Stattdessen hast du gelogen, dass Grug verantwortlich war. Frost erschien traurig, aber dankbar für die Vergeltung. Er belohnte dich mit einer Waffe. Trotz des Schuldgefühls hast du die Wahrheit verborgen gehalten.

after_hearing_the_truth_title = Nach dem Erfahren der Wahrheit über Lujath
after_hearing_the_truth_text = Du hast erfahren, dass Lujath Frost nicht einmal kannte. Was planst du, Frost jetzt zu sagen?

tell_the_truth_to_frost_title = Sage ihm, dass sie Grug liebt
tell_the_truth_to_frost_summary = Sage ihm, dass sie Grug liebt
tell_the_truth_to_frost_text = Du hast ihm gesagt, dass Lujath Grug gefolgt ist wegen ihrer Zuneigung zu ihm und sich nicht um Frost gekümmert hat. Wütend stößt Frost einen plötzlichen Schwall Flammen aus, der deiner Gruppe Schaden zufügt. Dann entschuldigt er sich und bietet dir eine schicke Waffe als Entschädigung an.

after_visit_title = Nach dem Besuch bei Grug
after_visit_summary = Nach dem Besuch bei Grug
after_visit_text = Was möchtest du Grug sagen?

the_beauty_and_beasts_title = Die Schöne und die Biester
the_beauty_and_beasts_text = Eine Gruppe von Monstern wird von einem seltsam platzierten schönen Mädchen begleitet. Welche Aktion wirst du ergreifen?

fight_with_grug_title = Kampf
fight_with_grug_summary = Kampf

after_visit_frost_fall_title = Nach dem Besuch bei Frost
after_visit_frost_fall_text = Du begegnest einer Gruppe von Monstern und einem schönen Mädchen. Sie scheinen der Beschreibung von Frostfalls Suche zu entsprechen. Allerdings erscheinen die Monster nicht bedrohlich, noch sieht das Mädchen ängstlich aus. Was wirst du tun?

fight_with_grug2_title = Kampf
fight_with_grug2_summary = Engagiere dich in einen Kampf

persuade_the_girl_title = Versuch, sie zu überzeugen
persuade_the_girl_summary = Versuch, sie zu überzeugen
persuade_the_girl_text = Du versuchst, die Monster und das Mädchen zu überzeugen, zu Frost zurückzukehren. Sie betont, dass sie Zuneigung für den Monsterführer aufgrund seiner Stärke hat und offenbart, dass sie kaum etwas über Frost weiß. Leider weigert sie sich, die Monster zu verlassen.

fel_party_title = Fel-Partei
fel_party_summary = Es gibt eine Gruppe von Fel, die nur Frauen folgen und Feindseligkeiten gegenüber Männern zeigen.
fel_party_text = Eine Gruppe von Fels hat sich hier versammelt. Sie äußern starken Groll gegen männliche Führung, und ihre extremen Ansichten führen dazu, dass sie deine Gruppe angreifen.

fight_with_fel_party_title = Beginne die Schlacht
fight_with_fel_party_summary = Beginne die Schlacht

fel_party_when_our_leader_is_female_title = Fel-Truppe
fel_party_when_our_leader_is_female_text = Eine Gruppe von Fels ist anwesend, und ihre weibliche Anführerin scheint in dich verliebt zu sein. Sie ist bereit, deiner Gruppe beizutreten, aber nur, wenn keine weiteren Frauen folgen dürfen.

hire_olases_summary = Olases einstellen
hire_olases_title = Olases einstellen
hire_olases_text = Olases wird dir jetzt folgen. Sie wird jedoch keine weiteren Frauen in der Gruppe akzeptieren.

karas_the_charismatic_title = Karas die Charismatische
karas_the_charismatic_summary = Eine Frau bietet an, die Führung zu verbessern im Austausch für Mana und Seelensteine.
karas_the_charismatic_text = Eine Frau namens Karas die Charismatische steht vor dir. Sie bietet an, deine Führungs- und Überzeugungsfähigkeiten im Austausch für dein Mana und ein kleines Stück deiner Seele zu verbessern.

karas_add_charisma_lose_mana_summary = Gib Karas die Ressourcen und lerne von ihr
karas_add_charisma_lose_mana_text = Karas vermittelt die versprochenen Lektionen, was dich charismatischer fühlen lässt.

kain_the_dark_warrior_title = Kain der Dunkle Krieger
kain_the_dark_warrior_summary = Ein Terrorritter möchte einer bösen Gruppe folgen.
kain_the_dark_warrior_text = Ein mysteriöser Terrorritter wird gefunden. Dein Versuch, mit ihm zu sprechen, zeigt wenig Interesse, und er hört auf zu reden.

kain_when_player_evil_title = Kain der Dunkle Krieger
kain_when_player_evil_text = Der dunkle Krieger spürt eine bösartige Aura von dir und beschließt, deiner Gruppe beizutreten. Was ist dein nächster Schritt?

hire_kain_summary = Kain einstellen
hire_kain_title = Kain einstellen
hire_kain_text = ...

dark_smith_title = Dunkler Schmied
dark_smith_summary = Es gibt einen Schmied, der Waffen auf Kosten der Gesundheit eines Wesens schmiedet.
dark_smith_text = Ein Teufel mit einem riesigen Hammer steht hier und präsentiert sich als Schmied, der Waffen aus Seelen schmiedet. Er bietet an, eine Waffe für dich zu schmieden und verlangt dafür die Gesundheit und Seele eines Mannes.

receive_item_lose_health_summary = Opfere die Gesundheit eines Wesens für eine Waffe
receive_item_lose_health_text =...

luna_the_witch_title = Luna die Hexe
luna_the_witch_summary = Eine schelmische Hexe sucht schreckliche Zutaten.
luna_the_witch_text = Eine außergewöhnlich aussehende Hexe namens Luna sucht die Augen von amphibischen Kreaturen für einen Trank. Sie verspricht als Belohnung einen nützlichen Gegenstand aus den Augen.

give_frog_eyes_title = Übergib der Hexe die Augen
give_frog_eyes_summary = Übergebe die Augen an die Hexe
give_frog_eyes_text = Du gibst ihr die Augen, und sie weist sie prompt als widerlich zurück. Wahrhaftig zu ihrem Wort, bietet sie dir als Gegenleistung ein Elixier an.

say_it_is_gross_title = Sag, dass die Augen widerlich sind
say_it_is_gross_summary = Sag, dass sie widerlich sind und lehne die Bitte ab
say_it_is_gross_text = Sie stimmt zu und bemerkt, dass sie vielleicht wirklich widerlich sind. Ihr Gesichtsausdruck nimmt eine rätselhafte Wendung an, was auf ein verborgenes Motiv hindeutet. Mit einem beunruhigenden Grinsen reicht sie dir ein Elixier. In einem sanften Monolog hörst du Flüstern über ihr neu gefundenes Interesse an dir und ihre Absicht, Einfluss auf dich zu nehmen. Sie schlägt vor, dass sie dir folgen wird, vorausgesetzt, du lässt es zu.

luna_after_saying_gross_title = Luna die Hexe
luna_after_saying_gross_text = Jetzt wird sie dir folgen, wenn du zustimmst.

hire_luna_summary = Luna einstellen
hire_luna_text = ...

frogman_title = Die Amphibien
frogman_text = Eine Versammlung von amphibischen Monstern wird präsentiert.

ray_the_deceiver_title = Ray der Betrüger
ray_the_deceiver_summary = Ein ominöser Nekromant sucht nach verbotenen Forschungen.
ray_the_deceiver_text = ...

ray_first_visit_title = Ray der Betrüger
ray_first_visit_text = Ein ominöser Nekromant stellt sich als Ray der Betrüger vor. Er sucht nach seltsamen Objekten und informiert dich über die benötigte Leiche einer Person namens Alicia. Welche Aktion wirst du ergreifen?

choice_fight_ray_summary = Besiege Ray

ray_after_visit_alisia = Ray der Betrüger
ray_after_visit_alicia_text = Ein ominöser Nekromant, möglicherweise der Verbrecher, den Alicia verfolgt, steht vor dir. Was ist deine Entscheidung?

listen_ray_summary = Versuch, mit Ray zu sprechen
listen_ray_text = Ray gibt offen seine Identität und Interessen zu. Er gibt an, ein Künstler zu sein, der von der Menschheit fasziniert ist, anstatt sich mit finsteren Machenschaften zu beschäftigen. Er macht einen Vorschlag: Bringe Alicias Körper, und er belohnt dich mit einem Relikt, um den Tod zu betrügen.

ray_visit_again_title = Nach dem Hören von Ray und Alicia
ray_visit_again_text = Du konfrontierst Ray erneut, jetzt dir seiner Interesse an Alicias Leichnam bewusst. Was wirst du bezüglich Ray tun?

give_the_corpse_of_alicia_summary = Übergebe Alicias Leiche
give_the_corpse_of_alicia_text = Du gibst Ray Alicias Leiche, und er hält sein Wort.

after_giving_the_corpse_of_alicia_text = Ray spricht. Du kannst eine dieser Optionen wählen.

receive_ring_of_nec_summary = Erhalte den Ring der Nekromantie
receive_ring_of_nec_text = Ray schenkt dir einen Ring, der dich in ein untotes Wesen verwandeln kann. Er verschwindet in einer Wolke aus lila Rauch.

receive_book_of_dark_summary = Erhalte das Buch des Wissens über dunkle Magie
receive_book_of_dark_text = Als Belohnung gibt Ray dir ein Buch mit Wissen über dunkle Magie. Er verschwindet nach dem Austausch.

fight_ray_summary = Kampf

alicia_party_after_visit_ray_title = Alicias Truppe
alicia_party_after_visit_ray_text = Du erreichst den Standort, den Ray erwähnt hat, und triffst auf eine Gruppe von Rittern und Schützen, die von Alicia angeführt werden. Was ist dein nächster Schritt?

choice_fight_alicia_summary = Begebe dich in den Kampf gegen Alicia
listen_alicia_summary = Versuch, mit Alicia zu sprechen
listen_alicia_text = Du sprichst mit Alicia über Ray. Sie identifiziert sich als Teil der königlichen Armee, die mit der Festnahme schwerer Verbrecher beauftragt ist. Sie bietet eine Belohnung an, wenn du Rays Leichnam bringst.

alicia_first_visit_title = Alicias Truppe
alicia_first_visit_text = Eine Gruppe von Rittern und Schützen steht vor dir. Die Anführerin, Alicia, und ihr Team sind auf einer Mission, einen Verbrecher, der abscheuliche Taten begangen hat, festzunehmen. Sie bietet eine Belohnung im Austausch dafür, dass der Verbrecher, Ray, gefunden und zu ihr gebracht wird.

alicia_visit_again_title = Alicias Truppe
alicia_visit_again_text = Du triffst Alicia erneut. Sie sucht Rays Festnahme, da er eine ernste Bedrohung darstellt. Wie wirst du mit dieser Situation umgehen?

give_rays_corpse_summary = Übergebe Rays Leiche
give_rays_corpse_text = Du gibst Alicia Rays Leiche, und sie erfüllt ihr Versprechen, dir eine Belohnung anzubieten.

dogs_and_lizards_title = Hunde und Echsen
dogs_and_lizards_summary = Sardils und Taves stehen kurz davor, in den Kampf zu ziehen. Beide Parteien könnten dich für deine Unterstützung belohnen.
dogs_and_lizards_text = Sardils und Taves, bekannt für ihre gegenseitige Feindseligkeit, stehen kurz davor, in den Kampf zu ziehen. Beide Parteien könnten dich für deine Unterstützung belohnen.

fight_both_summary = Kämpfe gegen beide Parteien.
fight_with_lizards_summary = Kämpfe an der Seite der Echsen
fight_with_dogs_summary = Kämpfe an der Seite der Taves
pass_by_silently_summary = Ignoriere und gehe still vorbei

dogs_prize_title = Taves' Belohnung
//dogs_prize_text = Da du den Taves geholfen hast, beschließt ihr Anführer, einen Diener zu senden, um dir zu helfen.

dogs_prize_text = Du hast das Vertrauen der Taves gewonnen. Ihr Anführer gestattet dir, ihre Soldaten zu nutzen, wenn du möchtest.
unlock_taves_merc_camp_summary = Entsperre das Taves-Merk-Camp.
unlock_taves_merc_camp_text = Du kannst jetzt das Taves-Merk-Camp in der Stadt bauen.

hire_dog_minion_summary = Stelle einen Taves-Diener ein

lizards_prize_title = Sardils' Belohnung
lizards_prize_text = Indem du den Sardils hilfst, bietet ihr Anführer dir einen Diener an, der deiner Gruppe beitreten soll.

hire_lizard_minion_summary = Stelle einen Sardil-Diener ein

mummified_frogs_title = Mumifizierte Frösche
mummified_frogs_summary = Eine Gruppe von Groffins, erschöpft von der Hitze, bittet um Hilfe.
mummified_frogs_text = Du findest eine erschöpfte Gruppe von Groffins. Der Bereich ist extrem heiß und trocken. Die erschöpften Groffins erklären, dass sie von der Hitze verflucht wurden und sich nur erholen können, wenn sie die Flutkarte erhalten. Sie erwähnen, dass die Flutkarte versteckt ist und sie ihren Standort auf deiner Karte markiert haben.
give_flood_card_summary = Gib die Flutkarte den Groffins.
fight_injured_groffin_party_summary = Kämpfe gegen die verletzten Groffin-Truppe.
flood_card_quest_title = Flutkarte
flood_card_quest_text = Ein Altar, an dem etwas verborgen ist, steht hier.
examine_the_flood_shrine_summary = Untersuche den Altar.
groffin_asking_flood_card_text = Die Groffin-Truppe fragt dich nach der Flutkarte. Was wirst du entscheiden?
give_flood_card_text = Du hast der Groffin-Truppe die Flutkarte gegeben. Die Groffins haben sich erholt und du kannst nun Groffin-Söldner einstellen.

dark_sacrifice_title = Dunkles Opfer
dark_sacrifice_summary = Eine Gruppe dunkler Priester sucht, um einen Paladin der Dunkelheit zu opfern.
dark_sacrifice_text = Eine Gruppe dunkler Priester und ein Paladin stehen sich hier gegenüber. Die dunklen Priester sagten, dass wenn der Paladin als Opfer angeboten wird, der dunkle Gott zufrieden sein wird und eine Belohnung gewährt. Was ist deine Wahl?
fight_against_dark_priests_summary = Kämpfe gegen die dunklen Priester.
fight_with_dark_priests_summary = Hilf den dunklen Priestern im Kampf.
jeanne_reward_title = Jeanne die Heilige
jeanne_reward_text = Sie stellte sich als Jeanne vor. Sie erwähnte, dass sie während eines Kampfes nach einer göttlichen Offenbarung von Dämonenpriestern angegriffen wurde, aber dank dir konnte sie der Gefahr entkommen. Jeanne möchte dir den legendären Schild geben.
choice_holy_defender_summary = Erhalte einen Schild von Jeanne.
dark_priests_reward_title = Belohnung von den Dunklen Priestern
dark_priests_reward_text = Die bösen Priester sagten, dass der Paladin ein Opfer war, das vom bösen Gott gewählt wurde, und jetzt können sie einen Tempel für die Toten mit diesem Opfer bauen. Sie sagten auch, dass sie in deiner Gegend einen Tempel des Todes bauen können, wenn du es erlaubst.
choice_temple_of_the_dead_summary = Erlaube den Bau eines Tempels für die Toten im Dorf.

vulcan_the_blacksmith_title = Schmied Vulkan
vulcan_the_blacksmith_summary = Der Schmied bittet um einen Schutz, um diesen Ort zu verlassen.
vulcan_the_blacksmith_text = Du triffst hier auf einen Schmied. Er stellt sich als Vulkan vor und sagt, dass er sich beim Suchen nach Erzen verirrt hat. Er erwähnte, dass wenn du ihm hilfst, den Ausgang dieses Dungeons zu erreichen, er dir eine Belohnung anbieten kann. Was wirst du tun?
escort_vulcan_summary = Begleite Vulkan
vulcan_escort_reward_title = Die Belohnung des Schmieds
vulcan_escort_reward_text = Vulkan sagte, dass er dir als Belohnung für deine Hilfe entweder erlauben kann, eine Schmiede im Dorf zu bauen oder dir eine legendäre Rüstung zu geben. Was ist deine Wahl?
choice_vulcan_reward_blacksmith_summary = Entsperre die Schmiede
choice_vulcan_reward_armor_summary = Rüstungsbelohnung

philosophers_stone_title = Stein der Weisen
philosophers_stone_summary = Der Alchemist möchte seine Kreation stoppen und den Stein der Weisen zurückholen.
philosophers_stone_text = Hier triffst du einen Alchemisten. Er behauptet, den Stein der Weisen erfolgreich erschaffen zu haben, aber nachdem er einen menschlichen Transmutation versucht hat, weigerte sich das vollendete Konstrukt, ihm zu gehorchen und ist weggegangen. Er verspricht, dass wenn du den Stein der Weisen von dem Konstrukt zurückbringen kannst, er dir ein Alchemielabor bauen wird.
albertus_asking_the_stone_text = Albertus bittet dich, den Stein der Weisen zurückzubringen. Was ist deine Entscheidung?
give_philosophers_stone_summary = Übergebe den Stein der Weisen an Albertus.
homunculus_title = Homunkulus
homunculus_text = Du begegnest einem Wesen, das einem Menschen ähnelt, aber seltsam unnatürlich ist. Was wirst du tun?
after_meeting_albertus_text = Du entdeckst einen Riesen, der vor dir steht. Es scheint der künstliche Mensch zu sein, den der Alchemist erwähnt hat. Der Riese bietet dir Seelensteine an, wenn du ihn in Ruhe lässt. Was ist deine Entscheidung?
fight_with_homunculus_summary = Bekämpfe den Homunkulus
receive_soul_crystals_from_homunculus_summary = Nimm die Seelensteine an

trapped_soul_title = Gefangene Seele
trapped_soul_summary = Ein Geist mit einer gefangenen Seele möchte sich vom Vertrag befreien und Freiheit erlangen.
trapped_soul_text = Als du an diesem Ort eintrittst, entdeckst du einen Geist. Es scheint etwas zu sagen zu haben.
choice_listen_to_soul_summary = Höre dem Geist zu.
choice_listen_to_soul_text = Der Geist erklärt, dass seine Seele von einem bösen Zauberer gefangen gehalten wird und es deine Hilfe benötigt. Wenn du den Zauberer beseitigst, werden seine Handlanger den Kampf abbrechen. Nachdem es gesprochen hat, verschwindet der Geist plötzlich in einer Wolke aus lila Rauch.
soul_manipulator_title = Seelenmanipulator
soul_manipulator_text = Du begegnest einem Zauberer, der eine Gruppe von Untoten befehligt. Was wirst du tun?
after_meeting_ghost_title = Faust
after_meeting_ghost_text = Du begegnest einem Zauberer mit einer Gruppe von untoten Dienern. Unter ihnen ist der Geist, den du zuvor gesehen hast, und es scheint, als würde der Zauberer sie kontrollieren.
fight_with_faust_summary = Kämpfe im Kampf
ghost_after_free_title = Befreiter Geist
ghost_after_free_text = Die Untoten stehen regungslos da und reagieren nicht mehr.
child_ghost_is_alive_title = Befreite Seele
child_ghost_is_alive_text = Der Geist dankt dir dafür, dass du ihm geholfen hast, Freiheit zu finden. Es bietet an, dir zu folgen, wenn du es erlaubst. Was wirst du entscheiden?
choice_hire_ghost_summary = Stelle Eliza ein

harpione_title = Harpione
harpione_summary = Eine Hawkfrau möchte einem weisen Menschen folgen.
harpione_text = Hier findest du eine weibliche Hawkfrau. Sie stellt sich als Harpione vor und behauptet, ihre Flügel wären nützlich für dein Abenteuer. Harpione möchte jedoch nur einem weisen Mann folgen; andernfalls verlangt sie eine angemessene Belohnung, um dir beizutreten. Was wirst du wählen?

hire_harpione1_summary = Überzeuge sie, deinem Glanz zu folgen.
hire_harpione1_text = Du führst ein kurzes Gespräch mit Harpione. Von deinem Intellekt fasziniert, stimmt sie zu, dir zu folgen.

hire_harpione2_summary = Stelle Harpione mit Seelensteinen ein.
hire_harpione2_text = Von den Seelensteinen verführt, beschließt sie, dir zu folgen.

rescue_beatrix_title = Beatrix in Gefahr
rescue_beatrix_summary = Ein Priester ist von Monstern umgeben und sucht Hilfe.
rescue_beatrix_text = Eine Acolyte, die von teuflischen Monstern umgeben ist, scheint in großer Gefahr zu sein. Ihr Überleben könnte von deinem Eingreifen abhängen. Was wirst du tun?

fight_against_kronasles_to_rescue_beatrix_summary = Kämpfe gegen die Ungeheuer, um sie zu retten!
ignore_fiends_summary = Ignorieren und still vorbeigehen
ignore_fiends_text = Du entscheidest dich, nicht zu helfen und lässt die Acolyte ihrem Schicksal überlassen.

beatrix_hire_title = Beatrix
beatrix_hire_text = Dankbar für deine Hilfe stellt sich die Acolyte als Beatrix vor. Ironischerweise ist sie durch das Verlies gewandert, um anderen in Gefahr zu helfen. Sie schlägt vor, sich dir anzuschließen, um deine Freundlichkeit zu vergelten.

choice_hire_beatrix_summary = Beatrix anheuern.

kalodor_the_aggressive_title = Kalodor der Aggressive
kalodor_the_aggressive_summary = Ein schwer gepanzerter Sardil fordert einen Einzelkampf.
kalodor_the_aggressive_text = Ein schwer gepanzerter Sardil namens Kalodor stellt sich vor, begierig auf den Kampf. Er fordert deine Gruppe zu einem Einzelkampf heraus und verspricht, sich anzuschließen, wenn er besiegt wird. Was ist deine Antwort?

fight_1on1_summary = In einen 1-gegen-1-Duell eintreten

kalodor_after_surrender_title = Kalodor der Aggressive
kalodor_after_surrender_text = Besiegt, gibt Kalodor nach und erkennt deine Stärke an. Er bekundet Interesse, sich deiner Gruppe für spannendere Kämpfe anzuschließen. Du kannst jetzt wählen, ihn anzuheuern.

hire_kalodor_summary = Kalodor anheuern
hire_kalodor_text = Kalodor ist jetzt Teil deiner Gruppe.

padna_the_greedy_title = Padna der Gierige
padna_the_greedy_summary = Padna ist ein talentierter, aber geldgieriger Magier. Bei Anheuerung verlangt er nach jeder Schlacht Bezahlung.
padna_the_greedy_text = Padna, ein selbstbewusster Magier, verlangt 75 Gold für jeden Kampf, an dem sie teilnimmt. Sie bietet ihre magischen Fähigkeiten an, aber nur gegen Entgelt. Was entscheidest du?

hire_padna_summary = Sie anheuern

devil_party_request_title = Teufelsanfrage
devil_party_request_summary = Die Dämonen suchen einen Schatz, den nur gute Menschen erhalten können.
devil_party_request_text = Bei einer Begegnung mit Teufeln bitten sie um das Elixier der Gesundheit. Dieses Elixier wird tugendhaften Individuen vom Schrein gewährt, der gute Herzen belohnt. Da die Teufel aufgrund ihrer bösen Natur das Elixier nicht bekommen konnten, bitten sie um deine Hilfe und zeigen dir den Standort des Schreins. Was ist deine Entscheidung?

give_elixir_of_hp_summary = Gib das Elixier
give_elixir_of_hp_text = Die Teufel erhalten das Elixier und belohnen dich mit einem Relikt, das eine dunkle Aura ausstrahlt.

fight_devil_summary = Kämpfe gegen die Teufel

elixir_of_con_quest_title = Elixier des Gesundheitschreins
elixir_of_con_quest_text = Ein Schrein steht vor dir, geschützt von einer Aura, die das Böse abwehrt. Drinnen liegt ein unbekränktes Elixier. Wie wirst du vorgehen?

examine_the_elixir_shrine_summary = Untersuche den Schrein
examine_the_elixir_shrine_text = Bei der Untersuchung findest du nichts, obwohl du zuvor eindeutig eine glänzende Flasche gesehen hast.

examine_the_elixir_shrine_positive_text = Die Untersuchung zeigt ein Elixier!

examine_the_elixir_shrine_negative_text = Während du überprüfst, greift die schützende Aura die ausgewählte Einheit an!

hire_ray_summary = Opfere die ausgewählte Einheit, stelle Ray ein.
hire_ray_text = Du stimmst dem Vorschlag zu und deutest auf einen Gefährten, ohne etwas zu sagen.\
   Der Gefährte ist über deinen Verrat erschrocken und versucht, etwas zu sagen, aber du kannst nichts hören. Plötzlich verdunkelt sich der Himmel wie in einer mondlosen Nacht und du hörst einen Schrei...

mana_horse_title = Eohippus
mana_horse_summary = Ein Magier in Gestalt eines Pferdes möchte deinen Verbündeten als Opfer für seine Forschung nutzen.
mana_horse_text = Du begegnest einem Magier in Form eines Pferdes. Er sagt, er benötige einen Menschen für seine Forschung und bittet um den erfahrensten deiner Verbündeten. Wenn du zustimmst, wird er deine Mana-Ladefähigkeit im Austausch für ein Opfer verbessern. Was wirst du tun?

kill_highest_level_ally_summary = Opfere den höchststufigen Verbündeten.
kill_highest_level_ally_text = Während Eohippus einen Zauber chantet, umgibt dich Dunkelheit, gefolgt vom Schrei deines Verbündeten. Als der Himmel wieder aufhellt, ist dein Verbündeter spurlos verschwunden.

angel_ring_quest_title = Ring des Engels
angel_ring_quest_summary = Ein Engel senkt sich herab und möchte dir ein Geschenk machen.
angel_ring_quest_text = Du begegnest hier einem Engel. Sie erzählt dir, dass das Göttliche von deinen heroischen Abenteuern und deinem gütigen Herzen bewegt wurde und dir ein Zeichen des Engels gewährt hat. Es wird gesagt, dass dieser Ring den Träger nach dem Tod als himmlisches Wesen wiederbeleben kann. Was wirst du tun?

receive_angel_ring_summary = Nimm den Ring des Engels entgegen.

undead_ray_quest_title = Der, Der die Menschheit Verließ
undead_ray_quest_summary = Ein bösartiger Magier möchte dir ein Geschenk im Austausch für das Opfer deines Verbündeten machen.
undead_ray_quest_text = Hier fühlst du eine sinistere Präsenz. Bald entdeckst du einen Zauberer in Form eines Gespenstes. Zu deiner Überraschung behauptet er, dich schon einmal getroffen zu haben. Er erwähnt, dass er Alicias Leiche, die du ihm gegeben hast, gut verwertet hat. Er zeigt Respekt für deine Taten und sagt, er habe auf dich gewartet. Für seine letzte Forschung benötigt er einen deiner Gefährten, und im Gegenzug bietet er ein kleines Geschenk an. Was wählst du?

receive_ring_of_the_dead_summary = Nimm sein Angebot an.
receive_ring_of_the_dead_text = Du bist seinem Angebot zustimmt und deutest still auf einen deiner Gefährten. Der Gefährte, enttäuscht von dir, versucht, etwas zu sagen, aber du hörst nichts. Plötzlich verdunkelt sich der Himmel wie in einer mondlosen Nacht, und du hörst Schreie...

fight_with_ray_summary = Kämpfe gegen ihn.

tyrus_the_fierce_title = Tyrus der Teuflische
tyrus_the_fierce_summary = Der Minotauren-Krieger sucht einen Einzelkampf.
tyrus_the_fierce_text = Du begegnest einem Minotauren-Krieger. Er stellt sich als Tyrus vor und sagt, dass er glaubt, dass nur körperliche Stärke wahre Macht ist und diejenigen, die Magie nutzen, Feiglinge sind. Wenn einer deiner Gefährten ihn nur mit körperlicher Stärke besiegt, wird er sich unterwerfen. Was möchtest du tun?

fight_1on1_with_tyrus_summary = Kämpfe 1-gegen-1 gegen Tyrus.

tyrus_after_surrender_title = Tyruss Niederlage
tyrus_after_surrender_text = Tyrus erkennt seine Niederlage an und stimmt zu, dir zu folgen, wenn du es wünschst.
hire_tyrus_summary = Tyrus anheuern

killorin_the_man_eater_title = Killorin der Menschenfresser
killorin_the_man_eater_summary = Ein Riese, bekannt unter dem Namen "Menschenfresser", steht vor dir.
killorin_the_man_eater_text = Hier steht ein Riese mit einem Auge und riesigen Stoßzähnen. Er stellt sich als Killorin der Menschenfresser vor, sagen die Leute, nennen ihn so. Er drückt dann den Wunsch aus, einen deiner Gefährten zu probieren, und bietet an, dich auf deiner Reise zu unterstützen, wenn du seinem Vorschlag zustimmst. Was ist deine Entscheidung?
sacrifice_your_ally_summary = Opfere deinen Gefährten.
sacrifice_your_ally_text = Du deutest auf einen deiner Gefährten. Killorin lacht jedoch und sagt, es sei alles ein Scherz, und dass er kein Interesse an jemandem habe, der so schnell bereit ist, seine eigenen zu opfern. In diesem Moment rennt dein Gefährte, enttäuscht von dir, weg. Um sich zu entschuldigen, gibt dir Killorin eine Waffe, die er hatte, aber die er immer wegen ihrer unheilvollen Natur zögerte zu benutzen.
fight_with_killorin_summary = Kämpfe gegen Killorin.
fight_with_killorin_text = Killorin entschuldigt sich und sagt, es sei nur ein Scherz.
killorin_hire_title = Killorin
killorin_hire_text = Killorin mochte dein Handeln und äußerte den Wunsch, dir zu folgen.
choice_hire_killorin_summary = Killorin anheuern.

ancient_giant_general_title = Antiker Riesen-General
ancient_giant_general_summary = Es sind die Überreste eines Riesen mit einem Loch in der Brust vorhanden.
ancient_giant_general_text = Du entdeckst ein riesiges Skelett. Das Skelett steht jedoch nur da, zeigt keine Reaktion. In seiner Brust ist ein leeres Loch.
give_frozen_heart_summary = Lege das gefrorene Herz in die Brust des Skeletts.
give_frozen_heart_text = Du legst das gefrorene Herz in die Brust des Skeletts. Ein Licht leuchtet in den Augen des Skeletts, und es scheint, als hätte es etwas zu dir zu sagen.

hire_gendric_quest_title = Skelett-Riese
hire_gendric_quest_text = Das Skelett übermittelt seine Gedanken in deinem Geist. Es sagt, dass es ein antiker General ist, der dank deiner Hilfe das Bewusstsein zurückerlangt hat. Obwohl sein Körper lange verwest ist und nur Knochen übrig sind, wünscht es sich, dir auf deiner Reise zu folgen.
choice_hire_gendric_summary = Akzeptiere Gendrics Angebot.

frozen_heart_quest_title = Gefrorenes Herz
frozen_heart_quest_text = Du entdeckst einen Altar. Auf dem Altar funkelt ein blauer, herzförmiger Edelstein, der eine kalte Aura ausstrahlt.

sauril_escort_title = Sardil Ältester
sauril_escort_summary = Ältester Sadil sucht einen Begleiter.
sauril_escort_text = Hier begegnest du einem alten Sardil. Er stellt sich als einer der Sardil-Ältesten vor und erklärt, dass er alle seine Untergebenen in einem Hinterhalt verloren hat. Er bittet dich, ihm zu helfen, aus dem Verlies zu entkommen. Wenn du ihm hilfst, sagte er, wirst du das Vertrauen der Sardil gewinnen. Was entscheidest du?
choice_escort_sauril_summary = Begleite Sauril
sauril_escort_reward_title = Dank des Ältesten
sauril_escort_reward_text = Dank deiner Hilfe hat der Älteste sein Ziel sicher erreicht. Im Gegenzug ließ er ein Sardil-Milizlager in deinem Dorf errichten.
saurils_reward_summary = Nimm die Belohnung an.

defend_the_keep_title = Burghaltung
defend_the_keep_summary = Eine Gruppe von Soldaten fordert dein Kommando, während sie sich auf einen Monsterangriff vorbereiten.
defend_the_keep_text = Du findest eine Burg, in der Soldaten und Monster gegenüberstehen. Die Soldaten erklären, dass die Monster kurz davor sind, einzufallen, und eine große Horde bald ankommen wird. Mangels Erfahrung bitten sie um deine Führung. Wenn die Burg erfolgreich verteidigt wird, sagen sie, werden sie dich unterstützen, wann immer du Truppen benötigst.

accept_defend_title = Verteidige die Burg mit den Soldaten
accept_defend_summary = Verteidige die Burg mit den Soldaten

defend_reward_title =
defend_reward_text = Die Soldaten danken dir für deine Führung und bieten eine Belohnung an.

choice_reinforce_card_summary = Erhalte Verstärkungs-Karten

gold_stolen_title = Goldraub
gold_stolen_text = Ein Monster ist in dein schlecht bewachtes Lager eingebrochen und hat einen Teil deines Goldes mitgenommen!

soul_stolen_title = Seelensteinraub
soul_stolen_text = Ein Monster hat die niedrige Sicherheit des Dorfes ausgenutzt und Seelensteine aus deinem Lager gestohlen!

epidemic_title = Epidemie
epidemic_text = Aufgrund der mangelnden Sicherheit im Dorf hat sich eine Epidemie ausgebreitet, die deine Verbündeten vergiftet. Dieser Fluch wird eine Woche andauern.

gold_bonus_title = Goldene Zwerge
gold_bonus_text = In deinem sicheren Dorf hat ein Goldener Zwerg Halt gemacht und ein Geschenk aus Gold hinterlassen.

soul_bonus_title = Seelenstein Geschenk
soul_bonus_text = In Anerkennung der Ordnung und des Friedens in deinem Dorf ließ ein Alchemist einen Seelenstein als Zeichen der Dankbarkeit zurück, bevor er ging.

heal_bonus_title = Engel-Geschenk
heal_bonus_text = Der Wohlstand deines Dorfes hat den Bewohnern Freude gebracht, was das Göttliche bewegte, einen Engel zu senden. Der Engel hat die Gesundheit deiner Mitmercenaries vollständig wiederhergestellt.

named_merc_title = Renommierter Söldner
named_merc_text = In Kenntnis deines Rufs ist der renommierte Söldner {0} gekommen, um dich zu besuchen. Dieser Söldner erwähnte, dass er diese Woche in der Taverne bleiben wird.\n{1}

monster_invasion_title = Monsterinvasion
monster_invasion_text = Die Monster haben die schwachen Verteidigungen des Gebiets ausgenutzt und sind eingefallen! Wenn du sie nicht besiegst, werden sie ein Gebäude des Dorfes zerstören.

bandits_invasion_title = Banditeninvasion
bandits_invasion_text = Eine Bande von Banditen hat die schwachen Verteidigungen des Gebiets ausgenutzt und ist eingefallen! Wenn du sie nicht besiegst, werden sie das Gold und die Seelensteine des Dorfes plündern.

wraith_invasion_title = Gespensterinvasion
wraith_invasion_text = Gespenster, die von dunkler Energie ermächtigt sind, haben dein Gebiet überfallen! Wenn du sie nicht besiegst, werden sie ein Gebäude im Dorf zerstören. Wenn keine Gebäude mehr übrig sind, wird dein Gebiet fallen.

potion_bonus_title = Heiltrank
potion_bonus_text = Der Besitzer des Trankladens, dankbar für dein Engagement für das Dorf, hat einen Heiltrank gespendet.

curse_title = Fluch
curse_text = Ein böser Magier ist ins Dorf gekommen und hat einen Fluch auf deine Söldner gelegt! Dieser Fluch wird eine Woche andauern.

special_event_title = Sonderereignis
special_event_text = Ein Sonderereignis wurde im Observatorium entdeckt. Es kann im Gildenhaus überprüft werden.

gear_bonus_title = Magische Waffe
gear_bonus_text = Der Waffenhändler ist dankbar für dein Engagement und hat dir eine magische Waffe gegeben!

xp_bonus_title = XP-Bonus
xp_bonus_text = Heiliges Licht strömt aus der Halle der Erfahrung und gewährt allen deinen Söldnern XP!

xp_penalty_title = XP-Verlust
xp_penalty_text = Der Stress durch die Bedrohungen für dein Gebiet hat dazu geführt, dass deine Söldner XP verloren haben!

invasion_title = Invasion
invasion_summary = Die feindlichen Kräfte sind stärker geworden und Monster haben das Dorf überfallen!
invasion_text = Die feindlichen Kräfte sind stärker geworden und Monster haben das Dorf überfallen!

defend_camp_title = Tolbok-Abwehr
defend_camp_summary = Du musst dich gegen eine Horde von Tolboks verteidigen.
defend_camp_text = Du begegnest einer Gruppe von Kriegern. Sie erklären, dass vor ein paar Tagen eine massive Tolbok-Invasion gemeldet wurde und obwohl sie Verteidigungen um ihr Dorf herum aufgebaut haben, fehlen ihnen genug Kämpfer. Sie bitten um deine Hilfe. Wenn du tust, was du tun kannst, versprechen sie, dir eine Bolt-Turm-Karte zu geben. Was wirst du tun?
accept_defend_camp_summary = Hilf den Kriegern.
defend_camp_reward_title = Abwehrbelohnung
defend_camp_reward_text = Dankbar für deine Hilfe bieten dir die Krieger eine Belohnung an.
choice_bolt_turret_card_summary = Erhalte eine Bolt-Turm-Karte.

defend_keep3_title = Verteidige die Burg
defend_keep3_text = Du findest eine Gruppe von Soldaten auf den Wehrgängen. Sie erklären, dass Dämonen sich versammeln, um die Burg anzugreifen, und sie nicht genügend Bogenschützen haben, um die Wände zu verteidigen. Wenn du ihnen hilfst, versprechen sie, dich mit einer Verteidiger-Verstärkungskarte zu belohnen, die du nach Bedarf beschwören kannst.
defend_keep3_summary = Hilf den Soldaten, die Burg vor den Dämonen zu verteidigen.
accept_defend_keep3_summary = Hilf den Soldaten. 
defend_keep3_reward_title = Abwehrbelohnung
defend_keep3_reward_text = Die Soldaten danken dir und bieten eine Belohnung an.
choice_reinforcement_defender_summary = Nimm die Belohnung entgegen.

defend_keep2_title = Burghaltung
defend_keep2_text = Du findest eine Gruppe von Bogenschützen auf den Burgwänden. Sie erklären, dass Sadils sich auf eine Invasion vorbereiten und obwohl sie Verteidigungen aufgebaut haben, fehlt ihnen immer noch manpower. Wenn du ihnen hilfst, werden sie dich mit einer Bogenschützen-Verstärkungskarte belohnen, mit der du sie nach Bedarf beschwören kannst.
defend_keep2_summary = Hilf den Bogenschützen, die Burg vor den Dämonen zu verteidigen.
accept_defend_keep2_summary = Hilf den Soldaten.
defend_keep2_reward_title = Belohnung für Invasionabwehr
defend_keep2_reward_text = Die Soldaten danken dir und bieten eine Belohnung an.
choice_reinforcement_archer_summary = Erhalte eine Verstärkungskarte für Bogenschützen.

siege_kronasle_camp_title = Übernehm das Kronasle-Lager
siege_kronasle_camp_summary = Hilf den Soldaten, das Kronasle-Lager zu erobern.
siege_kronasle_camp_text = Du entdeckst ein Lager der Kronasle-Dämonen. Davor bereiten sich Soldaten auf einen Angriff vor. Sie erklären, dass die Dämonen ihr Dorf ständig belästigen und sie sie beseitigen möchten, aber keine Erfahrung haben. Sie bitten dich, sie im Angriff zu führen. Als Belohnung versprechen sie eine Verstärkungskarte für Verteidiger.
accept_siege_kronasle_camp_summary = Kommandiere die Soldaten.
siege_kronasle_camp_reward_title = Belohnung der Soldaten
siege_kronasle_camp_reward_text = Dankbar für deine Hilfe bieten dir die Soldaten eine Verstärkungskarte für Verteidiger an.
choice_reinforce_defender_card_summary = Erhalte eine Verstärkungskarte für Verteidiger.

defend_keep_title = Verteidigung des Keep
defend_keep_text = Du hast eine Gruppe von Soldaten auf den Schlossmauern gefunden. Sie sagten, Dämonen warten darauf, vor den Mauern einzufallen, und sie haben keine Bogenschützen, um sich von oben gegen den Feind zu verteidigen. Wenn du ihnen hilfst, sagen sie, dass sie dir eine Kanonensummonkarten als Belohnung geben werden.
defend_keep_summary = Hilf den Soldaten, die Schlossmauern gegen die Dämonen zu verteidigen.
accept_defend_keep_summary = Hilf den Soldaten.
defend_keep_reward_title = Belohnung für Verteidigung
defend_keep_reward_text = Die Soldaten danken dir und bieten eine Belohnung an.
choice_cannon_card_summary = Erhalte die Belohnung.

siege_thieves_keep_title = Übernehmt das Diebes- keep
siege_thieves_keep_text = Du hast ein gut verteidigtes Keep und eine Gruppe von Kriegern davor gefunden. Sie sagten, sie wollen das Keep erobern, das die Basis der Diebe ist, und sie auslöschen, aber wissen nicht, wie sie es nehmen können. Sie baten dich um Hilfe beim Angriff, und wenn das Keep erobert wird, werden sie dir eine Verstärkungskarte für Krieger geben, mit der du sie jederzeit beschwören kannst. Was ist deine Wahl?
siege_thieves_keep_summary = Die Krieger wollen das Diebes- keep erobern.
accept_siege_thieves_keep_summary = Führe die Krieger und übernehmt das Keep.
siege_thieves_keep_reward_title = Belohnung für die Keep-Eroberung
siege_thieves_keep_reward_text = Die Krieger dankten dir für deine Hilfe und boten eine Belohnung an.
choice_reinforce_warrior_card_summary = Erhalte die Verstärkungskarte für Krieger.

siege_taves_keep_title = Erobere das Taves Keep
siege_taves_keep_summary = Erobere das Taves Keep mit der Drachenkannon.
siege_taves_keep_text = Du entdeckst das Taves- Keep. Draußen steht ein Ritter und Drachenkannonen. Er kann die Verteidigung des Keeps mit den Kanonen angreifen, hat aber Angst, dass die Truppen von Taves in der Zwischenzeit die Kanonen angreifen könnten. Er bietet eine Drachenkannonenkarte an, die beschworen werden kann, wenn du ihm hilfst. Was ist deine Entscheidung?
accept_siege_taves_keep_summary = Nimm die Bitte des Ritters an.
siege_taves_keep_reward_title = Belohnung für die Eroberung des Keeps
siege_taves_keep_reward_text = Der Ritter dankt dir für deine Hilfe und bietet eine Belohnung an.
choice_dragon_cannon_summary = Erhalte eine Drachenkannonenkarte
