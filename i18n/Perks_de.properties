KnowledgeIsPower = Wissen ist Macht  
KnowledgeIsPower_desc = Physische Nahkampfwaffenangriffe verursachen zusätzlichen Schaden basierend auf Intelligenz.

CurseIsPoison = Fluch ist Gift  
CurseIsPoison_desc = Ziele, die von Fluch betroffen sind, erleiden auch zusätzlichen Giftschaden.

FearMonger = Angstschürer  
FearMonger_desc = Dunkler Schaden, der an Feinden verursacht wird, steigt proportional zu ihrem Angstlevel.

VehicleOwner = Fahrzeugbesitzer

TrapExpert = Fallenexperte  
TrapExpert_desc = Erhöht den Schadensbereich beim Aktivieren von Kanonen, Fässern und ähnlichen Geräten.

FireSpreader = Feuerverbreiter  
FireSpreader_desc = Feuer breitet sich beim Entzünden von Feldern auf einem größeren Gebiet aus.

LightningSpreader = Blitzverbreiter  
LightningSpreader_desc = Erhöht die Reichweite, wenn Blitzschaden zu Wasser verursacht wird.

HeadOrTail = Kopf oder Zahl
HeadOrTail_desc = Wenn der Angriff trifft, wähle, ob du eine Münze werfen möchtest. Landet sie auf Kopf, schieße erneut. Landet sie auf Zahl, wird der bisher erlittene Schaden geheilt. Die Münze kann bis zu 4 Mal geworfen werden.

AmplifyingDice = Verstärkende Würfel
AmplifyingDice_desc = Wurf 2 oder weniger: Schaden 0 / Wurf 3 oder mehr: Schaden (Wurf x 50)%.

DualWielder = Doppelwächter
DualWielder_desc = Beim Führen von zwei Waffen löst die Nutzung eines einhändigen Nahkampfskills einen zusätzlichen Angriff mit der Nebenhand aus.

BladeAndGunMastery = Klingen- und Waffenmeisterschaft
BladeAndGunMastery_desc = Wenn du sowohl eine Waffe als auch eine Klinge führst, schieße die Waffe nach einer normalen Nahkampfattacke. Bei Verwendung eines Nahkampfskills, führe einen zusätzlichen Angriff mit der Nebenhand-Waffe aus.

HeavyDualWield = Schweres Doppeltreiben
HeavyDualWield_desc = Erlaubt das Ausrüsten von zwei zweihändigen Waffen, die keine Speere sind, eine in jeder Hand.

CurseSpreader = Fluchverbreiter
CurseSpreader_desc = Wenn du einen Fluch verursachst, breitet er sich auf alle Gruppenmitglieder des verfluchten Ziels aus.

SummonBlessingSpreader = Beschwörungssegenverbreiter
SummonBlessingSpreader_desc = Wenn du einen Segen erhältst, breitet er sich auch auf deine Beschwörungen aus.

ToxicologyMaster = Toxikologie-Meister
ToxicologyMaster_desc = Verlängert die Dauer von Giftangriffen. Giftschaden kann das Ziel töten.

FireAndLightningSpreaderAura = Feuer- und Blitzverbreiteraura
FireAndLightningSpreaderAura_desc = Erhöht die Reichweite der Feuerverbreitung durch Verbündete und die Reichweite von Elektrizität über Wasser.

PlayingCardDeck = Spielkarten-Deck
PlayingCardDeck_desc = Zu Beginn des Dungeons ziehe 4 Karten aus einem Deck mit 17. Gezogene Karten können mit der Kartenzieh-Fähigkeit verwendet werden. Wenn 3 Karten verwendet werden und die Summe ihrer Zahlen 7 ist oder ein Joker enthalten ist, steigt das Glück. Nach der Verwendung von 3 Karten ziehe 4 neue Karten aus dem verbleibenden Deck.

Cheating = Betrug
Cheating_desc = Alle Wetten gelingen. Münzen landen immer auf Kopf, Würfel werfen immer 6 und eine zufällige Karte im Deck wird ein Joker.
